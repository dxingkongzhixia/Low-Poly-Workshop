/* canvas 2D 不吃 CSS 变量（ctx.fillStyle='var(--x)' 是无效的），
 * 要手动把变量读成具体颜色。改主题后重绘就跟着变。 */
function themeColor(name, fallback){
  try{
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }catch(e){ return fallback; }
}

function polygonCanvas(pr,onChange){
  const cv=document.createElement('canvas'); cv.width=190; cv.height=190;
  cv.style.cssText='border:1px solid var(--line);border-radius:4px;background:var(--raise);cursor:crosshair;touch-action:none;width:100%;max-width:190px';
  const ctx=cv.getContext('2d'); const view={cx:0,cy:0,s:1}; const pts=()=>pr.points;
  function fit(){ const xs=pts().map(p=>p[0]), ys=pts().map(p=>p[1]);
    const mnX=Math.min(...xs),mxX=Math.max(...xs),mnY=Math.min(...ys),mxY=Math.max(...ys);
    const w=Math.max(1e-3,mxX-mnX),h=Math.max(1e-3,mxY-mnY),pad=24;
    view.s=Math.min((cv.width-pad*2)/w,(cv.height-pad*2)/h); view.cx=(mnX+mxX)/2; view.cy=(mnY+mxY)/2; }
  const toPx=(x,y)=>[cv.width/2+(x-view.cx)*view.s, cv.height/2-(y-view.cy)*view.s];
  const toW=(px,py)=>[+(view.cx+(px-cv.width/2)/view.s).toFixed(3), +(view.cy-(py-cv.height/2)/view.s).toFixed(3)];
  let drag=-1;
  function draw(){ ctx.clearRect(0,0,cv.width,cv.height);
    /* ★ canvas 2D 不认 CSS 变量，要手动读出来（否则浅色模式下网格和顶点会看不见）*/
    ctx.strokeStyle=themeColor('--hairline','rgba(255,255,255,.07)');
    for(let i=0;i<=8;i++){ const p=i*cv.width/8; ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,cv.height);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,p);ctx.lineTo(cv.width,p);ctx.stroke(); }
    ctx.beginPath(); pts().forEach((p,i)=>{ const [x,y]=toPx(p[0],p[1]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.closePath(); ctx.fillStyle=themeColor('--glow-accent','rgba(191,216,230,.18)'); ctx.fill();
    ctx.strokeStyle=themeColor('--accent','#bfd8e6'); ctx.lineWidth=1.5; ctx.stroke();
    pts().forEach((p,i)=>{ const [x,y]=toPx(p[0],p[1]); ctx.beginPath(); ctx.arc(x,y,4.5,0,Math.PI*2);
      ctx.fillStyle=i===drag?themeColor('--green','#4fe07a'):themeColor('--ink','#eef2f3'); ctx.fill();
      ctx.strokeStyle=themeColor('--bg','#12222b'); ctx.lineWidth=1; ctx.stroke(); });
    const [ox,oy]=toPx(0,0); ctx.strokeStyle=themeColor('--glow-gold','rgba(255,180,84,.55)'); ctx.beginPath();
    ctx.moveTo(ox-7,oy);ctx.lineTo(ox+7,oy);ctx.moveTo(ox,oy-7);ctx.lineTo(ox,oy+7);ctx.stroke(); }
  fit(); draw();
  const local=(e)=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; };
  cv.onpointerdown=(e)=>{ const [px,py]=local(e); let best=-1,bd=14;
    pts().forEach((p,i)=>{ const [x,y]=toPx(p[0],p[1]); const d=Math.hypot(x-px,y-py); if(d<bd){bd=d;best=i;} });
    if(e.button===2||e.ctrlKey||e.shiftKey){ if(best>=0&&pts().length>3){ pts().splice(best,1); draw(); onChange(); } return; }
    if(best>=0){ drag=best; try{cv.setPointerCapture(e.pointerId);}catch(x){} draw(); return; }
    const P=pts(); let bi=-1,bd2=1e9,bx=0,by=0;
    for(let i=0;i<P.length;i++){ const a=toPx(P[i][0],P[i][1]), b=toPx(P[(i+1)%P.length][0],P[(i+1)%P.length][1]);
      const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy||1;
      const t=Math.max(0,Math.min(1,((px-a[0])*dx+(py-a[1])*dy)/L));
      const qx=a[0]+dx*t,qy=a[1]+dy*t,d=Math.hypot(qx-px,qy-py);
      if(d<bd2){ bd2=d; bi=i; bx=qx; by=qy; } }
    if(bd2<18){ P.splice(bi+1,0,toW(bx,by)); draw(); onChange(); } };
  cv.onpointermove=(e)=>{ if(drag<0)return; const [px,py]=local(e); pts()[drag]=toW(px,py); draw(); onChange(); };
  cv.onpointerup=()=>{ if(drag>=0){ drag=-1; draw(); onChange(); } };
  cv.oncontextmenu=(e)=>e.preventDefault();
  return cv;
}

section('三角面统计','参考 study 预算',false,b=>{ b.id='budBody'; });
function renderBudget(){
  const b=document.getElementById('budBody'); if(!b) return;
  let real=0,meshes=0; if(built) built.root.traverse(o=>{ if(o.isMesh){ meshes++; const g=o.geometry; real+=(g.index?g.index.count:g.attributes.position.count)/3; }});
  const totals={}; let est=0, viol=[];
  for(const part of spec.parts){ let t=0;
    for(const pr of part.primitives||[]){
      if(pr.kind==='box'){ const c=Math.min(pr.w,pr.h,pr.d); t += c>0.12?108:12; }
      else if(pr.kind==='panel'){ const k=(pr.points||[]).length; t += (k-2)*2+k*2; }
      else if(pr.kind==='op'){ t += (Array.isArray(pr.tris)&&pr.tris.length)?pr.tris.length:(pr._tri||0); } }
    if(part.mirror) t*=2;
    totals[part.category]=(totals[part.category]||0)+t; est+=t; }
  if(est>BUDGET.total||est<BUDGET.min) viol.push('total: '+est);
  for(const [c,lim] of Object.entries(BUDGET.parts)) if((totals[c]||0)>lim) viol.push(`${c}: ${totals[c]}/${lim}`);
  b.innerHTML=`实际渲染：<b>${Math.round(real)}</b> 面 · <b>${meshes}</b> 网格<br>新增部件估算：<b>${est}</b> 面`;
  const tb=document.createElement('table'); tb.className='bud';
  for(const c of new Set([...Object.keys(BUDGET.parts),...Object.keys(totals)])){
    const lim=BUDGET.parts[c],cur=totals[c]||0;
    const tr=document.createElement('tr'); tr.innerHTML=`<td>${c}</td><td class="n ${lim&&cur>lim?'over':''}">${cur}${lim?' / '+lim:''}</td>`;
    tb.appendChild(tr); }
  b.appendChild(tb);
  const n=document.createElement('div'); n.style.cssText='font-size:10.5px;color:var(--dim)';
  n.textContent='※ 配额出自原作 study(立绘) 模型，仅供参考。'; b.appendChild(n);
  if(viol.length){ const v=document.createElement('div'); v.className='over'; v.textContent='超出参考配额：'+viol.join('、'); b.appendChild(v); }
}

/* ============================ 部件树 ============================ */
function partTriangles(part){ let n=0;
  for(const pr of part.primitives||[]){
    if(pr.kind==='box'){ const c=Math.min(pr.w,pr.h,pr.d); n+=c>0.12?108:12; }
    else if(pr.kind==='panel'){ const k=(pr.points||[]).length; n+=(k-2)*2+k*2; }
    else if(pr.kind==='op'){ n += (Array.isArray(pr.tris)&&pr.tris.length) ? pr.tris.length : (pr._tri||0); }
    else if(pr.kind==='geo'){ n += (pr._tri||0) || 60; }
  }
  return part.mirror?n*2:n; }
function renderPartList(){
  plistEl.innerHTML='';
  const items=[];
  if(spec.mode==='base' && spec.base){
    const groups=new Map();
    for(const e of BASE_MESHES){
      const g=roleKey(e.mesh); if(!groups.has(g)) groups.set(g,[]);
      groups.get(g).push(e);
    }
    for(const [rk,arr] of groups){
      const label=ROLE_CN[rk]||rk;
      const el=document.createElement('div'); el.className='pitem';
      const hidden=arr.filter(e=>(spec.base.hidden||[]).includes(e.key)).length;
      el.innerHTML=`<div class="nm"><span style="color:var(--dim)">▸</span> ${label}<div class="cat">基础网格 · ${arr.length} 个${hidden?'（隐藏 '+hidden+'）':''}</div></div><div class="tri">选</div>`;
      el.onclick=(ev)=>{ setSelection(arr.map(e=>e.key), ev.ctrlKey||ev.metaKey); };
      plistEl.appendChild(el);
    }
  }
  if(spec.mode==='parts' && spec.useOrigFace) items.push({id:'__head',name:'头（原作脸）',category:'基础头型',builtin:true});
  items.push(...spec.parts);
  for(const p of items){
    const el=document.createElement('div');
    el.className='pitem'+(p.id===selectedId?' on':'');
    el.innerHTML=`<div class="nm">${p.name}${p.mirror?' ⇄':''}<div class="cat">${p.category} · ${p.parent||''}</div></div><div class="tri">${p.builtin?'jT/MT':partTriangles(p)}</div>`;
    el.onclick=(ev)=>{ if(p.builtin){ toast('头部由 src/characters.face.js 生成'); return; }
      selectedId=p.id;
      setSelection(MESHES.filter(x=>x.part&&x.part.id===p.id).map(x=>x.key), ev.ctrlKey||ev.metaKey); };
    plistEl.appendChild(el);
  }
  document.getElementById('partCount').textContent=(spec.mode==='base'?'基础 + ':'')+spec.parts.length+' 部件';
}
function roleOf(mesh){
  if(baseModel){
    for(let n=mesh;n&&n!==baseModel.root;n=n.parent){
      if(n===baseModel.head) return 'head';
      if(baseModel.arms&&n===baseModel.arms[0]) return 'armL';
      if(baseModel.arms&&n===baseModel.arms[1]) return 'armR';
      if(baseModel.legs&&n===baseModel.legs[0]) return 'legL';
      if(baseModel.legs&&n===baseModel.legs[1]) return 'legR';
      if(n===baseModel.coatTails) return 'coatTails';
      if(n===baseModel.tail) return 'tail';
    }
    return 'body';
  }
  let n=mesh, top='';
  while(n && n!==built?.root){ if(n.name) top=n.name; n=n.parent; }
  return top||'body';
}
const ROLE_CN={ body:'身体', head:'头 / 脸', armL:'左臂', armR:'右臂', legL:'左腿', legR:'右腿',
  coatTails:'后摆', tail:'兽尾' };
function roleLabel(mesh){ const r=roleOf(mesh); return ROLE_CN[r]||r; }
function roleKey(mesh){ return roleOf(mesh); }
let meshSeq=0;
function registerBaseMeshes(root){
  meshSeq=0;
  root.traverse(o=>{ if(o.isMesh){
    const key='base#'+pathKey(o,root);
    o.userData.__entry={ key };
    o.userData.__label = o.name || ('网格'+String(++meshSeq).padStart(2,'0'));
    const e={ mesh:o, key, part:null, primIndex:-1, mirrored:false, imported:true };
    BASE_MESHES.push(e); MESHES.push(e);
  }});
}

  spec.parts.push(np); selectedId=nid; build();

function loadBase(source){

}

/* ============================ 导出代码 ============================ */
function exportCode(){
  const C=Object.entries(spec.palette).map(([k,v])=>`${k}:0x${(v>>>0).toString(16)}`).join(', ');
  // id 可能含 '-'（如 img2threejs 的 'chibi-twin-tail-character'），要转成合法标识符
  const FN = 'build_'+String(spec.id||'character').replace(/[^A-Za-z0-9_$]/g,'_');
  const L=[];
  L.push(`/* ============================================================`);
  L.push(`   由「低模部件编辑器」导出 —— ${spec.name} (${spec.id})`);
  L.push(`   依赖：src/characters.orig.js 的 Q / XT${spec.useOrigFace? ' + src/characters.face.js 的 attachFace':''}；`);
  L.push(`   用法：const c = ${FN}(); scene.add(c.root);`);
  L.push(`   ============================================================ */`);
  L.push(`function ${FN}(){`);
  L.push(`  const C = { ${C} };`);
  L.push(`  const Ft = [${spec.rig.headScale.map(v=>+v.toFixed(4)).join(', ')}];`);
  L.push(`  const X = THREE.Group;`);
  const emitRigCode=(L)=>{
    if(spec.rig.groups){
      L.push(`  const RG=${JSON.stringify(spec.rig.groups)};`);
      L.push(`  for(const k of ['body','head','armL','armR','legL','legR','coatTails','tail']){ const g=RG[k]; if(!g) continue; const o=P[k]; if(!o) continue;`);
      L.push(`    if(g.p)o.position.set(...g.p); if(g.r)o.rotation.set(...g.r); if(g.s)o.scale.set(...g.s); }`);
      L.push(`  if(RG.root){ if(RG.root.p)root.position.set(...RG.root.p); if(RG.root.s)root.scale.set(...RG.root.s); }`);
    }else{
      L.push(`  if(${spec.rig.rootScale??1}!==1) root.scale.setScalar(${spec.rig.rootScale??1});`);
      L.push(`  body.position.y=${spec.rig.bodyY}; head.position.y=${spec.rig.headY}; head.scale.set(...Ft);`);
      L.push(`  armL.position.set(${-spec.rig.armX},${spec.rig.armY},0); armR.position.set(${spec.rig.armX},${spec.rig.armY},0);`);
      L.push(`  legL.position.set(${-spec.rig.legX},${spec.rig.legY},0); legR.position.set(${spec.rig.legX},${spec.rig.legY},0);`);
      if(spec.rig.coatTails) L.push(`  coatTails.position.set(...${JSON.stringify(spec.rig.coatTails)});`);
      if(spec.rig.tail) L.push(`  tail.position.set(...${JSON.stringify(spec.rig.tail)});`);
    }
  };
  let baseNote='', applyBase='';
  if(spec.mode==='base' && spec.base){
    L.push(`  // 复用作原低模作为基础，再叠加新增部件`);
    L.push(`  const base = XT(${JSON.stringify(spec.base.source)});`);
    L.push(`  const root=base.root, body=base.body, head=base.head,`);
    L.push(`        armL=base.arms[0], armR=base.arms[1], legL=base.legs[0], legR=base.legs[1],`);
    L.push(`        coatTails=base.coatTails, tail=base.tail;`);
    const BT=spec.base.transforms||{};
    if(Object.keys(BT).length){
      L.push(`  const BT = ${JSON.stringify(BT)};`);
      L.push(`  const _path=(o,r)=>{const p=[];for(let n=o;n&&n!==r;n=n.parent)p.unshift(Array.prototype.indexOf.call(n.parent.children,n));return p.join('.');};`);
      L.push(`  root.traverse(o=>{ if(o.isMesh){ const t=BT[_path(o,root)]; if(t){ if(t.p)o.position.set(...t.p); if(t.r)o.rotation.set(...t.r); if(t.s)o.scale.set(...t.s); } } });`);
    }
    const hid=spec.base.hidden||[];
    if(hid.length){ L.push(`  const HID = ${JSON.stringify(hid)};`);
      L.push(`  root.traverse(o=>{ if(o.isMesh && HID.includes('base#'+_path(o,root))) o.visible=false; });`); }
    L.push(`  const P={body,head,armL,armR,legL,legR,coatTails,tail};`);
    emitRigCode(L);
    L.push(`  const __build=(m)=>{ m.userData.part=m.name; return m; };`);
  }else{
    L.push(`  const root=new X(), body=new X(), head=new X(),`);
    L.push(`        armL=new X(), armR=new X(), legL=new X(), legR=new X(), coatTails=new X(), tail=new X();`);
    L.push(`  root.add(body); body.add(head); body.add(coatTails); body.add(tail); body.add(armL,armR,legL,legR);`);
    L.push(`  const P={body,head,armL,armR,legL,legR,coatTails,tail};`);
    emitRigCode(L);
  }
  // ---- 通用几何体构造器（kind:'geo'）----
  const hasGeo = spec.parts.some(p=>p.primitives.some(q=>q.kind==='geo'));
  if(hasGeo){
    L.push(`  // ---- 通用几何体 ----`);
    L.push(`  function __geo(parent, d, pos, rot, scl, color, name){`);
    L.push(`    const p=d.params||{}, seg=Math.max(3,Math.min(64,p.seg|0||18));`);
    L.push(`    const seg2=Math.max(2,Math.min(64,p.seg2|0||Math.max(6,Math.round(seg/2))));`);
    L.push(`    let g;`);
    L.push(`    switch(d.shape){`);
    L.push(`      case 'sphere': case 'ellipsoid': g=new THREE.SphereGeometry(.5,seg,seg2); break;`);
    L.push(`      case 'cylinder': g=new THREE.CylinderGeometry(.5,.5,1,seg,1,!!p.open); break;`);
    L.push(`      case 'cone': g=new THREE.ConeGeometry(.5,1,seg,1,!!p.open); break;`);
    L.push(`      case 'capsule': g=new THREE.CapsuleGeometry(.5,1,Math.min(20,seg2),seg); break;`);
    L.push(`      case 'torus': g=new THREE.TorusGeometry(.5,Math.max(.01,Math.min(1,p.tube??.3)),Math.min(32,seg2),Math.min(64,seg)); break;`);
    L.push(`      case 'lathe': g=new THREE.LatheGeometry((p.points||[[.05,0],[.5,.2],[.35,.7],[.05,1]]).map(q=>new THREE.Vector2(q[0],q[1])),seg); break;`);
    L.push(`      case 'extrude': g=new THREE.ExtrudeGeometry(new THREE.Shape((p.points||[[-.5,-.5],[.5,-.5],[.5,.5],[-.5,.5]]).map(q=>new THREE.Vector2(q[0],q[1]))),{depth:Math.max(.01,p.depth??.2),bevelEnabled:false,steps:1,curveSegments:1}); break;`);
    L.push(`      default: g=new THREE.BoxGeometry(1,1,1);`);
    L.push(`    }`);
    L.push(`    g.scale(d.w,d.h,d.d); g.computeVertexNormals();`);
    L.push(`    const c=new THREE.Color(color), n=g.attributes.position.count, arr=new Float32Array(n*3);`);
    L.push(`    for(let i=0;i<n;i++){ arr[i*3]=c.r; arr[i*3+1]=c.g; arr[i*3+2]=c.b; }`);
    L.push(`    g.setAttribute('color', new THREE.BufferAttribute(arr,3));`);
    L.push(`    const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.75,metalness:.05,side:d.shape==='extrude'?THREE.DoubleSide:THREE.FrontSide}));`);
    L.push(`    m.castShadow=true; m.receiveShadow=true; m.name=name;`);
    L.push(`    m.position.set(pos[0],pos[1],pos[2]); m.rotation.set(rot[0],rot[1],rot[2]); m.scale.set(scl[0],scl[1],scl[2]);`);
    L.push(`    parent.add(m);`);
    L.push(`  }`);
  }
  const hasOp = spec.parts.some(p=>p.primitives.some(q=>q.kind==='op'));
  if(hasOp){    // —— 原作图元拆分器：运行时按 primitiveVertexCounts 还原每个原始图元（与编辑器内部完全一致）——
    const srcId = (spec.parts.find(p=>p.primitives.some(q=>q.kind==='op')).primitives.find(q=>q.kind==='op')).src;
    const sp = sourceParts(srcId);
    const skips=[];
    sp.model.root.traverse(o=>{ if(o.isMesh && o.geometry && o.geometry.userData && o.geometry.userData.primitiveVertexCounts
      && guessCategory(o.name)==='基础头型' && !skips.includes(o.name||'')) skips.push(o.name||''); });
    L.push(`  // ---- 原作图元拆分器（保留原始形状：倒角/斜切/多边形挤出）----`);
    L.push(`  const SRCID=${JSON.stringify(srcId)};`);
    L.push(`  const SKIP=${JSON.stringify(skips)};`);
    L.push(`  const _src=XT(SRCID); _src.root.updateMatrixWorld(true);`);
    L.push(`  const MESHTAB=[]; _src.root.traverse(o=>{ if(o.isMesh && o.geometry && o.geometry.userData && o.geometry.userData.primitiveVertexCounts && !SKIP.includes(o.name)) MESHTAB.push(o); });`);
    L.push(`  function __op(role,mi,pi,tris,pos,rot,scl,color,mir,name,metal,rough){`);
    L.push(`    const o=MESHTAB[mi]; if(!o) return;`);
    L.push(`    const target = (P[role]||body); target.updateWorldMatrix(true,false);`);
    L.push(`    const M=new THREE.Matrix4().copy(target.matrixWorld).invert().multiply(o.matrixWorld);`);
    L.push(`    const NM=new THREE.Matrix3().getNormalMatrix(M);`);
    L.push(`    const counts=o.geometry.userData.primitiveVertexCounts, cnt=counts[pi];`);
    L.push(`    let off=0; for(let i=0;i<pi;i++) off+=counts[i];`);
    L.push(`    const pa=o.geometry.getAttribute('position'), na=o.geometry.getAttribute('normal'), ca=o.geometry.getAttribute('color');`);
    L.push(`    const list = (tris && tris.length) ? tris : Array.from({length:cnt/3},(_,i)=>i);`);
    L.push(`    const vn=list.length*3, PP=new Float32Array(vn*3), NN=new Float32Array(vn*3), CC=new Float32Array(vn*3);`);
    L.push(`    const p=new THREE.Vector3(), nv=new THREE.Vector3(); let w=0, sx0=0, sy0=0, sz0=0;`);
    L.push(`    for(const t of list){ for(let k=0;k<3;k++){ const i=off+t*3+k;`);
    L.push(`      p.set(pa.getX(i),pa.getY(i),pa.getZ(i)).applyMatrix4(M);`);
    L.push(`      PP[w*3]=p.x; PP[w*3+1]=p.y; PP[w*3+2]=p.z; sx0+=p.x; sy0+=p.y; sz0+=p.z;`);
    L.push(`      if(na){ nv.set(na.getX(i),na.getY(i),na.getZ(i)).applyMatrix3(NM).normalize(); NN[w*3]=nv.x; NN[w*3+1]=nv.y; NN[w*3+2]=nv.z; }`);
    L.push(`      CC[w*3]=ca?ca.getX(i):1; CC[w*3+1]=ca?ca.getY(i):1; CC[w*3+2]=ca?ca.getZ(i):1; w++; } }`);
    L.push(`    for(let k=0;k<w;k++){ PP[k*3]-=sx0/w; PP[k*3+1]-=sy0/w; PP[k*3+2]-=sz0/w; }`);
    L.push(`    if(mir){ for(let k=0;k<w;k++){ PP[k*3]=-PP[k*3]; NN[k*3]=-NN[k*3]; }`);
    L.push(`      for(let t=0;t<w;t+=3){ for(let j=0;j<3;j++){`);
    L.push(`        let a=PP[(t+1)*3+j]; PP[(t+1)*3+j]=PP[(t+2)*3+j]; PP[(t+2)*3+j]=a;`);
    L.push(`        a=NN[(t+1)*3+j]; NN[(t+1)*3+j]=NN[(t+2)*3+j]; NN[(t+2)*3+j]=a;`);
    L.push(`        a=CC[(t+1)*3+j]; CC[(t+1)*3+j]=CC[(t+2)*3+j]; CC[(t+2)*3+j]=a; } } }`);
    L.push(`    const g=new THREE.BufferGeometry();`);
    L.push(`    g.setAttribute('position',new THREE.BufferAttribute(PP,3));`);
    L.push(`    g.setAttribute('normal',new THREE.BufferAttribute(NN,3));`);
    L.push(`    g.setAttribute('color',new THREE.BufferAttribute(CC,3));`);
    L.push(`    const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:(rough==null?0.69:rough),metalness:(metal==null?0.05:metal)}));`);
    L.push(`    m.castShadow=true; m.receiveShadow=true; m.name=name;`);
    L.push(`    m.userData.__op={ src:SRCID, mesh:mi, prim:pi };`);
    L.push(`    m.position.set(mir?-pos[0]:pos[0], pos[1], pos[2]);`);
    L.push(`    m.rotation.set(rot[0], mir?-rot[1]:rot[1], mir?-rot[2]:rot[2]); m.scale.set(scl[0],scl[1],scl[2]);`);
    L.push(`    target.add(m);`);
    L.push(`  }`);
  }
  const emit=(part,prims,parentKey,suffix,mirrored)=>{
    L.push(`  // ---- ${part.name}${suffix} (${part.category}) ----`);
    prims.forEach((pr,i)=>{
      const col = typeof pr.color==='number' ? '0x'+(pr.color>>>0).toString(16)
                : (typeof pr.color==='string' && pr.color in spec.palette ? 'C.'+pr.color
                   : '0x'+(normColor(pr.color)>>>0).toString(16));
      const nm=part.name+suffix+' #'+(i+1);
      if(pr.kind==='op'){
        L.push(`  __op(${JSON.stringify(parentKey)},${pr.mesh},${pr.prim},${JSON.stringify(pr.tris)},`
          + `[${pr.x},${pr.y},${pr.z}],[${pr.rotX||0},${pr.rotY||0},${pr.rotZ||0}],[${pr.sclX??1},${pr.sclY??1},${pr.sclZ??1}],`
          + `${pr.color==null?'null':col},${mirrored?'true':'false'},${JSON.stringify(nm)},`
          + `${pr.metalness==null?'null':pr.metalness},${pr.roughness==null?'null':pr.roughness});`);
        return;
      }
      if(pr.kind==='geo'){
        L.push(`  __geo(P.${parentKey}, ${JSON.stringify({shape:pr.shape,w:pr.w,h:pr.h,d:pr.d,params:pr.params||{}})},`
          + `[${pr.x||0},${pr.y||0},${pr.z||0}],[${pr.rotX||0},${pr.rotY||0},${pr.rotZ||0}],[${pr.sclX??1},${pr.sclY??1},${pr.sclZ??1}],`
          + `${col},${JSON.stringify(nm)});`);
        return;
      }
      if(pr.kind==='box'){
        L.push(`  { const q=new Q(); q.box(0,0,0, ${pr.w},${pr.h},${pr.d}, ${col}, 0);`);
        L.push(`    const m=q.build(P.${parentKey}, ${part.metalness??0.05});`);
        L.push(`    m.position.set(${pr.x||0},${pr.y||0},${pr.z||0}); m.rotation.set(${pr.rotX||0},${pr.rotY||0},${pr.rotZ||0}); m.name=${JSON.stringify(nm)}; }`);
      }else{
        const c=polyCentroid(pr.points);
        const local=pr.points.map(p=>[+(p[0]-c[0]).toFixed(4),+(p[1]-c[1]).toFixed(4)]);
        L.push(`  { const q=new Q(); q.shape(${JSON.stringify(local)}, 0, ${pr.depth}, ${col});`);
        L.push(`    const m=q.build(P.${parentKey}, ${part.metalness??0.05}); m.position.set(${c[0]},${c[1]},${pr.z}); m.name=${JSON.stringify(nm)}; }`);
      }
    });
  };
  for(const part of spec.parts){
    if(!part.primitives.length) continue;
    emit(part,part.primitives,part.parent,'',false);
    if(part.mirror) emit(part,part.primitives.map(mirrorPrimitive),OPPOSITE[part.parent]||part.parent,' (镜像)',true);
  }
  if(spec.mode!=='base' && spec.useOrigFace){
    L.push(`  attachFace(head, { id:${JSON.stringify(spec.id)}, iris:[${spec.iris.map(c=>'0x'+(c>>>0).toString(16)).join(',')}] });`);
  }
  L.push(`  return { root, body, head, arms:[armL,armR], legs:[legL,legR], coatTails, tail };`);
  L.push(`}`);
  return L.join('\n');
}

/* 体素/模型导入器已抽到共享模块 src/vox-import.js（pages/model-import.html 也在用）*/
/** 把「盒列表」落到某个部件里（统一处理缩放 / 定位 / 镜像 / 颜色覆盖）
 *  opts: { parent, position:[x,y,z], fitHeight, scale, color, up:'z'|'y', id, name, category, mirror } */
function boxesToPart(boxes, opts={}){
  if(!boxes.length) return err('没有解析出任何块');
  const up=opts.up||'y';                       // 'z' = 源是 Z-up，需要转 Y-up
  const M=(b)=> up==='z'
    ? { x0:b.x0,x1:b.x1, y0:b.z0,y1:b.z1, z0:b.y0,z1:b.y1, c:b.c, hex:b.hex }
    : b;
  const B=boxes.map(M);
  let mnx=1e9,mny=1e9,mnz=1e9,mxx=-1e9,mxy=-1e9,mxz=-1e9;
  for(const b of B){ mnx=Math.min(mnx,b.x0); mny=Math.min(mny,b.y0); mnz=Math.min(mnz,b.z0);
    mxx=Math.max(mxx,b.x1); mxy=Math.max(mxy,b.y1); mxz=Math.max(mxz,b.z1); }
  const h=mxy-mny, w=mxx-mnx, d=mxz-mnz;
  let sc=opts.scale;
  if(sc==null) sc = opts.fitHeight ? opts.fitHeight/h : 1;
  // 底部中心对齐到 position
  const pos=opts.position||[0,0,0];
  const cx=(mnx+mxx)/2, cz=(mnz+mxz)/2;
  const ox=pos[0]-cx*sc, oy=pos[1]-mny*sc, oz=pos[2]-cz*sc;
  const r4=v=>+v.toFixed(4);
  const prims=B.map(b=>{
    const w2=(b.x1-b.x0)*sc, h2=(b.y1-b.y0)*sc, d2=(b.z1-b.z0)*sc;
    return { kind:'box',
      x:r4((b.x0+b.x1)/2*sc+ox), y:r4((b.y0+b.y1)/2*sc+oy), z:r4((b.z0+b.z1)/2*sc+oz),
      w:r4(Math.max(w2,0.004)), h:r4(Math.max(h2,0.004)), d:r4(Math.max(d2,0.004)),
      color: opts.color!=null ? opts.color : (b.hex!=null ? b.hex : b.c),
      rotX:0, rotY:0, rotZ:0 };
  }).map(normPrim);
  const id=opts.id||('vox'+Math.random().toString(36).slice(2,5));
  const part={ id, name:opts.name||'导入体素', category:opts.category||'额外装饰',
    parent:opts.parent||'head', metalness:0.05, mirror:!!opts.mirror, primitives:prims };
  const s=spec; s.parts.push(part);
  build(); renderAll(); renderPartList();
  return ok({ id, blocks:prims.length, sourceBounds:[+w.toFixed(3),+h.toFixed(3),+d.toFixed(3)],
    scale:+sc.toFixed(4), position:[r4(ox),r4(oy),r4(oz)] });
}
/* ============================================================================
 * 参照图：把参考图贴进视口当「描图底」，并支持取色 / 提主色板
 * 大模型的工作流：setRefImage(参考图) → sampleRefColor / refPalette 对齐配色
 *              → recipes()/buildPart() 拼精细部件 → render() 叠图自检 → 迭代
 * ========================================================================== */
/* 实现部分（状态 refImg / REF_PLANES 在 UI 之前已声明）*/
function clearRefImg(){ if(refImg){ if(refImg.mesh.parent) refImg.mesh.parent.remove(refImg.mesh);
  refImg.mesh.geometry.dispose(); refImg.tex.dispose(); refImg.mesh.material.dispose(); refImg=null; } }
function applyRefOpts(o={}){
  if(!refImg) return;
  const m=refImg.mesh, info=refImg.info;
  if(o.opacity!=null){ info.opacity=o.opacity; m.material.opacity=o.opacity; }
  if(o.visible!=null){ info.visible=o.visible; m.visible=o.visible; }
  if(o.height!=null){ info.height=o.height; const a=info.aspect; m.geometry.dispose();
    m.geometry=new THREE.PlaneGeometry(o.height*a, o.height); info.width=o.height*a; }
  if(o.plane){ const P=REF_PLANES[o.plane]; if(P){ info.plane=o.plane;
    if(o.position==null) m.position.set(...P.pos); if(o.rot==null) m.rotation.set(...P.rot); } }
  if(o.position) m.position.set(...o.position);
  if(o.rot) m.rotation.set(...o.rot);
  if(o.z!=null) m.position.z=o.z;
  if(o.crop!==undefined) info.crop=o.crop;
}
function loadRefImage(src, o={}){
  return new Promise(resolve=>{
    if(!src) return resolve({ ok:false, error:'需要 src（dataURL 或同源 URL）' });
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{ try{
      clearRefImg();
      const h=o.height??2.4, aspect=(img.width/img.height)||1;
      const tex=new THREE.CanvasTexture(img); tex.colorSpace=THREE.SRGBColorSpace;
      const mesh=new THREE.Mesh(new THREE.PlaneGeometry(h*aspect, h),
        new THREE.MeshBasicMaterial({ map:tex, transparent:true, opacity:o.opacity??0.45,
          depthWrite:false, side:THREE.DoubleSide, toneMapped:false }));
      const plane=o.plane||'front', P=REF_PLANES[plane]||REF_PLANES.front;
      mesh.rotation.set(...(o.rot||P.rot));
      mesh.position.set(...(o.position||P.pos));
      mesh.renderOrder=-100; mesh.userData.__ref=true;
      scene.add(mesh);
      const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
      c.getContext('2d',{ willReadFrequently:true }).drawImage(img,0,0);
      refImg={ mesh, tex, canvas:c, info:{ plane, height:h, width:h*aspect, aspect:+aspect.toFixed(4),
        opacity:o.opacity??0.45, visible:true, crop:o.crop||null,
        src:(typeof src==='string'&&src.length>80)? ('(dataURL '+img.width+'×'+img.height+')') : String(src) } };
      resolve({ ok:true, width:img.width, height:img.height, aspect:+aspect.toFixed(4),
        note:'用 updateRefImage({opacity,plane,height,position}) 调；render() 会带上它' });
    }catch(e){ resolve({ ok:false, error:String((e&&e.message)||e) }); } };
    img.onerror=()=>resolve({ ok:false, error:'图片加载失败（请用 dataURL，或与页面同源的 URL）' });
    img.src=src;
  });
}
function refPixel(u,v){
  const c=refImg.canvas;
  const x=Math.max(0,Math.min(c.width-1, Math.round(u*c.width)));
  const y=Math.max(0,Math.min(c.height-1, Math.round(v*c.height)));
  const d=c.getContext('2d').getImageData(x,y,1,1).data;
  const hex='#'+[d[0],d[1],d[2]].map(z=>z.toString(16).padStart(2,'0')).join('');
  return { u,v, x, y, rgb:[d[0],d[1],d[2]], hex, alpha:d[3] };
}
function refPaletteOf(n=6, region){
  const c=refImg.canvas, W=Math.min(c.width,180), H=Math.max(1,Math.round(c.height*W/c.width));
  const rg=region||{ x:0,y:0,w:1,h:1 };
  const sx=Math.round(rg.x*c.width), sy=Math.round(rg.y*c.height),
        sw=Math.max(1,Math.round(rg.w*c.width)), sh=Math.max(1,Math.round(rg.h*c.height));
  const tmp=document.createElement('canvas'); tmp.width=W; tmp.height=H;
  const tx=tmp.getContext('2d',{ willReadFrequently:true });
  tx.drawImage(c, sx,sy,sw,sh, 0,0,W,H);
  const d=tx.getImageData(0,0,W,H).data, hist=new Map();
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<128) continue;                       // 透明像素不算
    const k=((d[i]>>4)<<8)|((d[i+1]>>4)<<4)|(d[i+2]>>4);
    const e=hist.get(k)||{ n:0,r:0,g:0,b:0 };
    e.n++; e.r+=d[i]; e.g+=d[i+1]; e.b+=d[i+2]; hist.set(k,e);
  }
  const tot=[...hist.values()].reduce((a,e)=>a+e.n,0)||1;
  return [...hist.values()].sort((a,b)=>b.n-a.n).slice(0, Math.max(1,Math.min(24,n|0||6)))
    .map(e=>({ hex:'#'+[e.r/e.n,e.g/e.n,e.b/e.n].map(z=>Math.round(z).toString(16).padStart(2,'0')).join(''),
      rgb:[Math.round(e.r/e.n),Math.round(e.g/e.n),Math.round(e.b/e.n)], share:+(e.n/tot).toFixed(4) }));
}

/* =========================================================================
   ★ 面向大模型（LLM）的编程接口：window.EditorAPI
   —— 全部命令只接受/返回 JSON 可序列化数据，永不抛异常（返回 {ok:false,error}）
   ========================================================================= */
const API_VERSION='1.0';
const clone = o => JSON.parse(JSON.stringify(o));
/* 颜色归一化：支持 0xRRGGBB 数字 / '#RRGGBB' 字符串 / 调色板键名 */
function normColor(c){
  if(typeof c==='number') return c>>>0;
  if(typeof c==='string'){
    const s=c.trim();
    if(/^#?[0-9a-fA-F]{6}$/.test(s)) return parseInt(s.replace('#',''),16);
    if(s in spec.palette) return s;      // 调色板键名
    return 0xffffff;
  }
  return 0xffffff;
}
/** 由 {src,mesh,prim,tris?,...} 造一个 op 图元；x/y/z 默认取该(子)图元的形心 */
function makeOpPrim(o){
  const src=String(o.src!=null?o.src:spec.id);
  const sp=sourceParts(src);
  const mref=sp.meshes[o.mesh|0], q=mref && mref.prims[o.prim|0];
  if(!q) return { ok:false, error:'源图元不存在: '+src+' mesh='+o.mesh+' prim='+o.prim+'（用 sourceMeshes(\''+src+'\') 查）' };
  let tris=null;
  if(Array.isArray(o.tris) && o.tris.length){
    for(const t of o.tris) if(!(t>=0 && t<q.tri)) return { ok:false, error:'三角形下标越界: '+t+'（该图元共 '+q.tri+' 个三角形）' };
    tris=o.tris.slice().sort((a,b)=>a-b);
  }
  const c=(tris? triSetCentroid(q,tris) : q.center), r4=v=>+v.toFixed(4);
  return { ok:true, prim:{
    kind:'op', src, mesh:o.mesh|0, prim:o.prim|0, tris,
    color: (o.color===undefined||o.color===null) ? null : normColor(o.color),
    metalness: o.metalness!=null? o.metalness : q.metalness,
    roughness: o.roughness!=null? o.roughness : q.roughness,
    x:r4(o.x!=null?o.x:c[0]), y:r4(o.y!=null?o.y:c[1]), z:r4(o.z!=null?o.z:c[2]),
    rotX:o.rotX||0, rotY:o.rotY||0, rotZ:o.rotZ||0,
    sclX:o.sclX??1, sclY:o.sclY??1, sclZ:o.sclZ??1,
    _tri: tris? tris.length : q.tri, _label: o._label||q.cat||'其他' } };
}
function normPrim(q){
  if(!q) return q;
  if(q.color!==undefined && q.color!==null) q.color=normColor(q.color);
  if(q.kind==='box'){ for(const k of ['x','y','z','w','h','d','rotX','rotY','rotZ']) if(typeof q[k]!=='number') q[k]=0; }
  if(q.kind==='panel' && !Array.isArray(q.points)) q.points=[[-.15,0],[.15,0],[.1,-.4],[-.1,-.4]];
  if(q.kind==='op'){
    for(const k of ['x','y','z','rotX','rotY','rotZ']) if(typeof q[k]!=='number') q[k]=0;
    for(const k of ['sclX','sclY','sclZ']) if(typeof q[k]!=='number') q[k]=1;
    if(q.tris!==null && !Array.isArray(q.tris)) q.tris=null;
    if(q.color===undefined) q.color=null;
  }
  if(q.kind==='geo'){
    if(!q.shape) q.shape='box';
    for(const k of ['x','y','z','rotX','rotY','rotZ']) if(typeof q[k]!=='number') q[k]=0;
    for(const k of ['w','h','d']) if(typeof q[k]!=='number') q[k]=1;
    for(const k of ['sclX','sclY','sclZ']) if(typeof q[k]!=='number') q[k]=1;
    if(q.params===undefined) q.params={};
  }
  return q;
}
function ok(o={}){ return { ok:true, ...o }; }
function err(m){ return { ok:false, error:String(m && m.message || m) }; }
function wrap(fn){ return (...a)=>{ try{ return fn(...a); }catch(e){ return err(e); } }; }

/* =========================================================================
 * ★ 质量门 / 流水线 的编辑器侧辅助（提炼自 img2threejs 的 render_bridge + stage4）
 *   原则：脚本只度量、不评判；「没测」不等于「通过」。
 * ========================================================================= */

/** 服务端存储调用的统一包装：**永远返回 {ok:...}，绝不 reject**
 *  （其余 100+ 个命令都是这个约定，Store 系的异步命令不能例外）*/
async function storeCall(label, fn){
  try{ return ok(await fn()); }
  catch(e){ return err(label + '：' + ((e && e.message) || e)); }
}

/** 对象连同祖先是否都可见（隐藏的祖先会让子树整体不渲染）*/
function visibleNow(o){ for(let n=o;n;n=n.parent) if(n.visible===false) return false; return true; }

/** 在「只有模型、纯色背景」的干净场景里执行 fn（拍门用的图）*/
function withCleanScene(fn, opts={}){
  const hidden=[];
  for(const c of scene.children){
    if(c===built?.root || c.isLight) continue;
    if(c.visible){ c.visible=false; hidden.push(c); }
  }
  const savedBg=scene.background;
  scene.background=new THREE.Color(opts.bg ?? 0xffffff);
  try{ return fn(); }
  finally{ for(const c of hidden) c.visible=true; scene.background=savedBg; }
}

/** 模型在场景里的取景框（门用的是正交相机，没有透视变形，剪影才好比）*/
function modelFrame(opts={}){
  if(!built) return null;
  const bb=new THREE.Box3().setFromObject(built.root);
  const ctr=bb.getCenter(new THREE.Vector3()), sz=bb.getSize(new THREE.Vector3());
  const half=Math.max(sz.x, sz.y, sz.z) * 0.5 * (opts.pad ?? 1.10);
  return { ctr, sz, half: Math.max(half, 1e-4) };
}

/** 正交拍摄一张，返回 2D canvas（可直接喂给质量门）
 *  ⚠ 会临时改 renderer 尺寸，**必须还原**，否则主画布会一直卡在 size×size */
function orthoShot(frame, azimuth, size){
  const cam=new THREE.OrthographicCamera(-frame.half, frame.half, frame.half, -frame.half, 0.001, frame.half*80);
  const r=frame.half*30, a=(azimuth||0)*Math.PI/180;
  cam.position.set(frame.ctr.x+Math.sin(a)*r, frame.ctr.y, frame.ctr.z+Math.cos(a)*r);
  cam.up.set(0,1,0); cam.lookAt(frame.ctr);
  renderer.setSize(size, size, false);
  try{
    renderer.render(scene, cam);
    const c=document.createElement('canvas'); c.width=size; c.height=size;
    c.getContext('2d',{willReadFrequently:true}).drawImage(renderer.domElement, 0, 0, size, size);
    return c;
  }finally{
    renderer.setSize(innerWidth, innerHeight);      // ★ 还原主画布
  }
}

/** 每个部件的世界包围盒（接缝门 / 净空门用）
 *  ⚠ Box3.setFromObject 只更新对象自己的世界矩阵，**不更新父级** ——
 *    build() 之后、还没渲染过时父级矩阵是旧的，会算出「局部盒」。
 *    所以这里先强制刷一遍矩阵。 */
function partBoxes(){
  if(built && built.root) built.root.updateMatrixWorld(true);
  const m=new Map();
  for(const e of MESHES){
    if(!e.part || !e.mesh) continue;
    const b=new THREE.Box3().setFromObject(e.mesh);
    const cur=m.get(e.part.id); if(cur) cur.union(b); else m.set(e.part.id, b);
  }
  return m;
}

/** 身份特征件：头发 / 兽耳 / 马尾 / 尾巴 / 角 / 饰品 —— 这些东西最不能是一个大方块 */
const IDENTITY_RE = /发|耳|尾|角|翼|饰|冠|披风|围巾|腰带|扣|徽/;
/** 含 op 图元 = 来自原作几何（boxify 拆出来的）；纯 box/panel/geo = 手搓部件。
 *  这个判据很好用：boxify 之后原作的头部各件也都叫「头发」，光看名字分不出谁是宿主。 */
function isOriginalPart(p){ return (p.primitives||[]).some(q=>q.kind==='op'); }
function identityParts(){
  return spec.parts.filter(p => !isOriginalPart(p) && IDENTITY_RE.test((p.name||'')+' '+(p.category||'')));
}

/** 拍一张「评审用」的干净正面图，并可选地存成基线 */
function capturePassShot(opts={}){
  const frame=modelFrame(opts);
  if(!frame) return null;
  return withCleanScene(()=>orthoShot(frame, opts.azimuth ?? 0, opts.size || 512), opts);
}

/** 流水线跑完 / 硬停 = 这次接管结束 → ★ 自动交还接管位。
 *  （完成可能发生在 mark() 里，也可能发生在 record() 里，所以两处都要调）*/
function maybeAutoRelease(){
  const st = PIPELINE.s.status;
  if(st !== 'complete' && st !== 'stopped') return;
  if(!_agentSelf) return;
  _agentSelf = null;
  Store.releaseAgent(st === 'complete' ? '流水线 27 步跑完，自动交还'
    : ('硬停，自动交还：' + PIPELINE.s.stopReason)).then(()=>refreshPipeUI()).catch(()=>{});
}

/** 流水线状态变了就让面板重绘（不阻塞调用方）*/
function refreshPipeUI(){ if(pipeBody && typeof renderPipelinePanel==='function') setTimeout(renderPipelinePanel, 0); }

/** Agent 续约：正在用 EditorAPI 干活就说明还活着。1 分钟最多 ping 一次。
 *  ★ 只有**本页登记过**才 ping —— 否则没接管却去 ping 会被服务端拒（400）。
 *  超过租约（默认 30 分钟）没动静 → 服务端把接管位当作已空出（occupying=false）。 */
let _lastPing = 0, _agentSelf = null, _agentPending = null;
function agentHeartbeat(){
  if(!_agentSelf) return;
  const now = Date.now();
  if(now - _lastPing < 60000) return;
  _lastPing = now;
  // 自愈：如果服务端其实已经没人接管（比如接管位被别人交了、或存档过期），
  // 就清掉 _agentSelf，别一直重试 ping（否则每次都会 400）
  try{ Store.pingAgent().catch(e=>{ if(/没有 Agent 接管/.test(String((e&&e.message)||e))) _agentSelf=null; }); }catch(e){}
}

/** ★ 流水线自动持久化 —— 「对话上下文可丢，state 才是权威」。
 *  页面刷新/崩溃/换一个 AI 会话都能接着干，不用手动 saveSession。
 *  存在 localStorage（key 带版本号），reset 时清掉。 */
function persistPipeline(){
  try{ localStorage.setItem(PIPELINE_KEY, JSON.stringify({
    v:PIPELINE_VERSION, savedAt:Date.now(), agent:_agentSelf, state:PIPELINE.toJSON() })); }catch(e){}
}
function restorePipeline(){
  try{
    const raw = localStorage.getItem(PIPELINE_KEY); if(!raw) return false;
    const j = JSON.parse(raw);
    if(!j || j.v !== PIPELINE_VERSION || !j.state || !Array.isArray(j.state.checklist)) return false;
    PIPELINE.s = j.state;
    // ★ 存档里记的「我是接管者」先挂起，**等跟服务端核对通过才算数** ——
    //   否则面板一渲染就会拿它去 ping，白挨一个 400
    if(j.agent) _agentPending = j.agent;
    return true;
  }catch(e){ return false; }
}
function clearPersistedPipeline(){ try{ localStorage.removeItem(PIPELINE_KEY); }catch(e){} }

/** 参照图可用性判定 —— 照抄 check_reference_admission.py 的阈值，另加「三视图拼版」检测 */
function admitReference(){
  if(!refImg) return { admitted:false, reasons:['还没有载入参照图'], command:"await EditorAPI.setRefImage('<URL 或 dataURL>')" };
  const cv=refImg.canvas;
  const m=GATES.largestComponent(GATES.maskFromCanvas(cv, { mode:'auto' }));
  const short=Math.min(cv.width, cv.height);
  const reasons=[], advice=[];
  if(short < 64) reasons.push(`短边 ${short}px < 64px`);
  if(m.coverage < 0.05) reasons.push(`前景占比 ${(m.coverage*100).toFixed(1)}% < 5%`);
  if(m.coverage > 0.97) reasons.push(`前景占比 ${(m.coverage*100).toFixed(1)}% > 97%（没有背景可分离）`);
  if(m.discarded > 0.40) reasons.push(`最大连通块只占前景 ${((1-m.discarded)*100).toFixed(0)}% < 60%（主体不连通）`);
  const aspect=cv.width/cv.height;
  if(aspect > 3.0 || aspect < 0.33) reasons.push(`长宽比 ${aspect.toFixed(2)} 超出 [0.33, 3.0]`);

  // ★ 多视图拼版检测：拼版不能直接用来跑 silhouette 门
  const views = GATES.detectViews(m);
  if(views.count > 1){
    reasons.push(`检测到 ${views.count} 个分离的视图（三视图拼版）→ 轮廓门需要**单视图**`);
    advice.push('用 refCrop({x,w}) 指定其中一屏（下面的 suggestedCrops 是自动切好的），'
      + '或者把参考图先裁成单视图再 setRefImage()');
  }
  return {
    admitted: reasons.length===0,
    reasons, advice,
    metrics:{ width:cv.width, height:cv.height, shortSide:short, aspect:+aspect.toFixed(4),
      foregroundCoverage:+m.coverage.toFixed(4), largestComponentShare:+(1-m.discarded).toFixed(4),
      detectedViews:views.count },
    views, suggestedCrops: views.crops,
    warnings: m.warnings,
    note: reasons.length===0
      ? '参照图可用于度量（silhouette 门可以跑）'
      : '★ 参照图有问题：'+reasons.join('；')+(views.count>1? ' → 建议先 refCrop() 切出单视图' : ''),
  };
}

async function saveSession(){
  const payload={ savedAt:Date.now(), pipeline:PIPELINE.toJSON(), spec, baseline:null,
    refSrc: refImg ? refImg.info.src : null };
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(payload)); }catch(e){}
  return payload;
}
function loadSessionPayload(j){
  if(j.pipeline) PIPELINE.s = j.pipeline;
  if(j.spec){ spec=j.spec; detachGizmo(); selectedId=null; build(); renderAll(); renderPartList(); }
  return { pipeline:PIPELINE.status(), specId:spec.id, restoredSpec:!!j.spec };
}

  /* ---- 参照（默认拉普兰德低模） ---- */
  reference(source='lappland'){
    const m=XT(String(source));
    const groups={};
    const push=(role,o)=>{ if(!o) return; const bb=new THREE.Box3().setFromObject(o);
      const sz=bb.getSize(new THREE.Vector3()), c=bb.getCenter(new THREE.Vector3());
      (groups[role]=groups[role]||[]).push({ name:o.name||'', size:[sz.x,sz.y,sz.z].map(v=>+v.toFixed(3)),
        center:[c.x,c.y,c.z].map(v=>+v.toFixed(3)) }); };
    push('body',m.body); push('head',m.head); push('coatTails',m.coatTails); push('tail',m.tail);
    (m.arms||[]).forEach((a,i)=>push(i?'armR':'armL',a));
    (m.legs||[]).forEach((a,i)=>push(i?'legR':'legL',a));
    // 网格级
    const meshes=[]; m.root.traverse(o=>{ if(o.isMesh){ o.geometry.computeBoundingBox();
      const bb=o.geometry.boundingBox, sz=bb.getSize(new THREE.Vector3()), c=bb.getCenter(new THREE.Vector3());
      meshes.push({ name:o.name||'', category:guessCategory(o.name), role: roleOfBase(m,o),
        size:[sz.x,sz.y,sz.z].map(v=>+v.toFixed(3)), center:[c.x,c.y,c.z].map(v=>+v.toFixed(3)),
        color:'#'+avgVertexColor(o.geometry).toString(16).padStart(6,'0') }); }});
    return { source:String(source), label:(LOW_CHARS.find(c=>c[0]===source)?.[1]||source),
      rig: measureRig({ body:m.body, head:m.head, armL:m.arms?.[0], armR:m.arms?.[1],
        legL:m.legs?.[0], legR:m.legs?.[1], coatTails:m.coatTails, tail:m.tail, root:m.root }),
      headScale:Ft.slice().map(v=>+v.toFixed(4)),
      palette: KT[source]? {...KT[source]} : null,
      iris: AT[source]? AT[source].slice() : null,
      rootScale: It ? It(source) : 1,
      groups, meshes };
  },
