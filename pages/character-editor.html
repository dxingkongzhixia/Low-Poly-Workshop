  /* ---- 图元 ---- */
  addPrimitive(partId,prim){ const p=spec.parts.find(x=>x.id===partId); if(!p) return err('无此部件: '+partId);
    let q;
    // ★ kind 白名单：非法 kind 必须报错，不能静默降级成 box（会让人以为加成功了）
    if(prim && prim.kind!=null && !['box','panel','op','geo'].includes(prim.kind))
      return err('未知图元类型: '+JSON.stringify(prim.kind)+'（可用: box | panel | op | geo）');
    if(prim && prim.kind==='op'){
      const r=makeOpPrim(prim); if(!r.ok) return r; q=r.prim;
    }else if(prim && prim.kind==='panel'){
      q=normPrim({ kind:'panel', points:prim.points||[[-.15,0],[.15,0],[.1,-.4],[-.1,-.4]], depth:prim.depth??.05, z:prim.z??0, color:prim.color??'trim' });
    }else if(prim && prim.kind==='geo'){
      q=normPrim({ kind:'geo', shape:prim.shape||'box', w:prim.w??.22, h:prim.h??.22, d:prim.d??.22,
          x:prim.x??0, y:prim.y??1.15, z:prim.z??0.28, color:prim.color??'trim',
          rotX:prim.rotX??0, rotY:prim.rotY??0, rotZ:prim.rotZ??0, params:prim.params||{} });
    }else{
      q=normPrim({ kind:'box', x:prim?.x??0, y:prim?.y??1.15, z:prim?.z??0.28, w:prim?.w??.22, h:prim?.h??.22, d:prim?.d??.22,
          color:prim?.color??'trim', rotX:prim?.rotX??0, rotY:prim?.rotY??0, rotZ:prim?.rotZ??0 });
    }
    p.primitives.push(q); build(); renderAll(); renderPartList();
    return ok({ index:p.primitives.length-1, kind:q.kind }); },

  /* ---- ★ 精细构造（参照图 / 提示词驱动改造角色）----
   * 目标：饰品 / 头发 / 马尾 / 尾巴这类部件要「多个小模块拼接」，
   * 而不是一个大致的方块。用法：
   *   EditorAPI.recipes()                                 先看有哪些配方
   *   EditorAPI.buildPart({recipe:'twinTail', mirror:true}) 一句话生成几十个小图元
   *   EditorAPI.buildPart({name:'披风', category:'服装装饰', parent:'body', ops:[...]}) 自己写算子
   *   EditorAPI.build(partId, ops)                          往已有部件追加
   * ------------------------------------------------------------------------ */
  recipes(){ return Object.entries(RECIPES).map(([k,r])=>({ name:k, label:r.label,
    category:r.category, parent:r.parent, doc:r.doc, params:r.def })); },
  recipe(name, params={}){ const r=RECIPES[name];
    if(!r) return err('无此配方: '+name+'（可用：'+Object.keys(RECIPES).join(' / ')+'）');
    const p=Object.assign({}, r.def, params||{});
    try{ const ops=r.make(p);
      return ok({ name, params:p, ops, primitives:expandOps(ops,{}).length,
        note:'ops 可以直接改，再 EditorAPI.build(partId, ops) 生成' });
    }catch(e){ return err(e); } },
  build(partId, ops, opts={}){ const part=spec.parts.find(x=>x.id===partId);
    if(!part) return err('无此部件: '+partId+'（用 buildPart 可顺带新建）');
    return buildInto(part, ops, opts); },
  buildPart(args={}){ let ops=args.ops, label=args.name, category=args.category, parent=args.parent;
    if(args.recipe){
      const r=RECIPES[args.recipe];
      if(!r) return err('无此配方: '+args.recipe+'（可用：'+Object.keys(RECIPES).join(' / ')+'）');
      const p=Object.assign({}, r.def, args.params||{});
      try{ ops=r.make(p); }catch(e){ return err(e); }
      label=label||r.label; category=category||r.category; parent=parent||r.parent;
    }
    if(!Array.isArray(ops)||!ops.length) return err('需要 ops 数组（算子表）或 recipe 名');
    const ex=expandChecked(ops, { seed:args.seed, mirror:!!args.mirror, color:args.color });
    if(!ex.ok) return err(ex.error);                       // 先校验再建部件，失败不留空壳
    const id=args.id||('part'+Math.random().toString(36).slice(2,5));
    let part=spec.parts.find(x=>x.id===id);
    if(!part){ part={ id, name:label||'新部件', category:category||'额外装饰',
      parent:parent||'body', metalness:args.metalness??0.05, primitives:[] }; spec.parts.push(part); }
    if(args.mirror) part.mirror=true;
    part.primitives.push(...ex.list);
    if(args.build!==false){ build(); renderAll(); renderPartList(); }
    return ok({ id:part.id, name:part.name, added:ex.list.length,
      primitives:part.primitives.length, triangles:partTriangles(part) });
  },
  /** 精细度报告：哪些部件「一个图元打天下」，需要拆细 */
  detailReport(){ return ok({ parts:spec.parts.map(p=>{
      const n=manualPrims(p).length, all=p.primitives.length, tri=partTriangles(p);
      const want=DETAIL_MIN[p.category];
      const applies = all>0 && n===all;                    // 全是原作图元 → 不要求
      return { id:p.id, name:p.name, category:p.category, manualPrimitives:n, primitives:all, triangles:tri,
        checked:applies, enough: (!applies||want==null) ? null : (n>=want),
        hint: (!applies||want==null) ? (all? '原作图元，无需拆' : null)
          : (n>=want? 'ok' : `建议拆成 ≥${want} 个小图元（现在 ${n} 个）`) }; }),
    rules:DETAIL_MIN,
    note:'饰品/头发/马尾/尾巴优先用多个小模块拼接。用 recipes() + buildPart 最快；'
       + 'boxify 出来的原作图元本身就是真几何，不参与该检查。' }); },

  /* ---- ★ 导入 img2threejs 的「雕刻规格」(sculpt spec) ----
   * 它的 componentTree 本来就是「层级化的单位基本体 + TRS」，和本编辑器的 parts/primitives 同构：
   *   component.id/name/role        → part
   *   component.parent              → 层级（沿父链累积世界矩阵）
   *   primitive + dimensions/scale  → geo（box/sphere/cylinder/torus/extrude…）
   *   transform.position/rotation   → 图元位置/旋转
   *   material/baseColor            → 图元颜色
   * 导入后会清空骨架（rig 归零），因为那是它自己的比例，不该套我们的角色网格。
   * src 可以是 URL 字符串、dataURL、或已解析的对象。 */
  async importSculptSpec(src, opts={}){
    try{
      let j = src;
      if(typeof src === 'string'){
        const t = src.trim();
        j = (t[0]==='{') ? JSON.parse(t) : await (await fetch(src)).json();
      }
      if(!j || !Array.isArray(j.componentTree)) return err('不是 img2threejs 雕刻规格（缺少 componentTree）');

      const mats={}; for(const m of (j.materials||[])) mats[m.id]=m;
      const colorOf=(c)=>{
        const m = c.material ? (mats[typeof c.material==='string'? c.material : (c.material.id||'')]) : null;
        const rec = c.colorMaterialRecipe||{};
        const hex = (m&&(m.baseColor||m.color||m.albedo)) || rec.baseColor || rec.color || null;
        if(typeof hex==='string' && /^#?[0-9a-f]{6}$/i.test(hex)) return hex[0]==='#'?hex:('#'+hex);
        return opts.color || '#8d979c';
      };
      const PRIM={ box:'box', sphere:'sphere', ellipsoid:'ellipsoid', cylinder:'cylinder',
        cone:'cone', capsule:'capsule', torus:'torus', tube:'tube', lathe:'lathe', extrude:'extrude',
        'plane-card':'box',          // 薄板 → 压扁的 box
        'tapered-sweep':'cylinder',  // 锥形扫掠 → 圆柱近似
        'curve-sweep':'cylinder',
        'ground-blade':'extrude',
        'instanced-cluster':'box' };
      // 分类映射（贴到我们已有的分类表上）
      const roleCat=(role)=> role==='garment' ? '服装装饰' : role==='shell' ? '额外装饰' : '基础身体';

      // ① 沿父链累积世界矩阵
      const byId={}; for(const c of j.componentTree) byId[c.id]=c;
      const world={};
      const calcWorld=(c, seen)=>{
        if(world[c.id]) return world[c.id];
        if(seen.has(c.id)) return new THREE.Matrix4();
        seen.add(c.id);
        const t=c.transform||{}, pos=t.position||[0,0,0], rot=t.rotation||[0,0,0], scl=t.scale||[1,1,1];
        const local=new THREE.Matrix4().compose(
          new THREE.Vector3(pos[0],pos[1],pos[2]),
          new THREE.Quaternion().setFromEuler(new THREE.Euler(rot[0],rot[1],rot[2],'XYZ')),
          new THREE.Vector3(1,1,1));       // 尺寸直接烘进几何，scale 不参与累积
        const p = c.parent ? byId[c.parent] : null;
        const m = p ? calcWorld(p, seen).clone().multiply(local) : local.clone();
        world[c.id]=m; return m;
      };
      for(const c of j.componentTree) calcWorld(c, new Set());

      // ② 组装成 parts（全部挂在 body 下，位置取世界矩阵，避免套我们的骨架）
      //   规格是「逐遍构建」的：macro 级 role=shell/garment 的盒是 **blockout 外框**，
      //   它下面挂着 meso 细节（如 tail-l 外框 vs 5 段 tail-slab）。两层都渲染 = 外框吞掉细节。
      //   默认丢掉这种外框（opts.envelope:'render' 可保留）。
      const hasKids={}; for(const c of j.componentTree) if(c.parent) hasKids[c.parent]=(hasKids[c.parent]||0)+1;
      const isEnvelope=c => c.level==='macro' && (c.role==='shell'||c.role==='garment') && hasKids[c.id]>0;
      const parts=[]; let skipped=0, envelopes=0;
      for(const c of j.componentTree){
        const t=c.transform||{}, dim=c.dimensions||{};
        const w=+(dim.width|| (t.scale&&t.scale[0]) || 0), h=+(dim.height||(t.scale&&t.scale[1])||0), d=+(dim.depth||(t.scale&&t.scale[2])||0);
        if(!(w>0 && h>0 && d>0)) { skipped++; continue; }          // root 之类 0.001 占位，丢
        if(c.topologyClass==='material-only') { skipped++; continue; } // 规格自己标注「不产生可见表面」
        if(!c.primitive) { skipped++; continue; }
        if(opts.envelope!=='render' && isEnvelope(c)) { envelopes++; continue; }
        const shape=PRIM[c.primitive]||'box';
        const M=world[c.id];
        const p=new THREE.Vector3(), q=new THREE.Quaternion(), s=new THREE.Vector3();
        M.decompose(p,q,s);
        const e=new THREE.Euler().setFromQuaternion(q,'XYZ');
        const r4=v=>+v.toFixed(4);
        parts.push({ id:'sc_'+c.id, name:c.name||c.id, category:roleCat(c.role),
          parent:'body', metalness:0.05, mirror:false, _srcLevel:c.level, _srcPrim:c.primitive,
          primitives:[{ kind:'geo', shape, w:r4(w), h:r4(h), d:r4(d),
            x:r4(p.x), y:r4(p.y), z:r4(p.z),
            rotX:r4(e.x), rotY:r4(e.y), rotZ:r4(e.z), sclX:1, sclY:1, sclZ:1,
            color: colorOf(c), params: (c.primitive==='extrude'&&c.geometryDescriptor&&c.geometryDescriptor.points)
              ? { points:c.geometryDescriptor.points } : {} }] });
      }
      if(!parts.length) return err('规格里没有可用的部件');

      // ③ 落地：清空骨架（不套我们的角色比例），替换部件表
      //    注意：导出器会无条件读 rig.headScale 等旧扁平字段，所以两套都要给全。
      const zero={ p:[0,0,0], r:[0,0,0], s:[1,1,1] };
      const rig={ bodyY:0, headY:0, headScale:[1,1,1], armX:0, armY:0, legX:0, legY:0, rootScale:1,
        coatTails:[0,0,0], tail:[0,0,0],
        groups:{ body:{...zero}, head:{...zero}, armL:{...zero}, armR:{...zero},
          legL:{...zero}, legR:{...zero}, coatTails:{...zero}, tail:{...zero}, root:{...zero} } };
      spec = { id:opts.id||j.targetId||'sculpt', name:opts.name||j.targetName||'导入的雕塑规格',
        mode:'parts', base:null, useOrigFace:false,
        iris:[0xffffff,0xffffff,0xffffff], palette: mkPalette('lappland'),
        rig, zones:[], parts };
      detachGizmo(); selectedId=null; build(); renderAll(); renderPartList();
      const st=stats();
      return ok({ id:spec.id, name:spec.name, parts:parts.length, skipped, envelopes,
        triangles:st.triangles, source:{ target:j.targetName, version:j.schemaVersion,
          components:j.componentTree.length, suitability:j.suitability,
          scores:j.scores, tier1:j.tier1Results ? j.tier1Results.map(t=>t.passed) : null },
        note:'已清空骨架（rig 归零）；部件全部挂在 body 下，位置用的是规格里的世界坐标；'
           + (envelopes? ('跳过了 '+envelopes+' 个 blockout 外框（opts.envelope="render" 可保留）') : '没有外框被跳过') });
    }catch(e){ return err(e); }
  },

  /* ---- ★ 导入体素 / 模型（吃 VoxelAI Studio / MagicaVoxel / 任意 GLB 的产物）----
   * await importVox(src, opts?)     .vox：逐体素解析 → 贪心合并 → box 图元（颜色保留）
   * await importMesh(src, opts?)    .glb/.gltf/.obj：按连通分量拆成轴对齐盒
   * opts: { parent:'head', position:[x,y,z], fitHeight, scale, color, up:'z'|'y',
   *         id, name, category, mirror }
   *   · fitHeight 给了就自动缩放到该高度；否则用 scale（默认 1）
   *   · 模型以「底部中心」对齐到 position
   *   · up:'z' = 源是 Z-up（MagicaVoxel/VoxelAI 默认），自动转成 Y-up
   * ------------------------------------------------------------------------- */
  async importVox(src, opts={}){
    try{
      const buf=await fetchArrayBuffer(src);
      const p=parseVox(buf);
      if(!p.count) return err('.vox 里没有体素');
      const boxes=voxGreedy(p.size, p.cells).map(b=>({ ...b, hex:p.palette[(b.c-1+256)%256] }));
      const r=boxesToPart(boxes, Object.assign({ up:'z', name:'导入体素' }, opts||{}));
      return r.ok ? ok(Object.assign({}, r, { voxels:p.count, voxSize:p.size, palette:p.palette.length })) : r;
    }catch(e){ return err(e); }
  },
  async importMesh(src, opts={}){
    try{
      // opts.voxelize = true → 平滑网格先体素化再合并（Meshy/TRELLIS 出的网格必须走这条）
      const ext=(opts.ext||src.split('?')[0].split('.').pop()||'').toLowerCase();
      const r0=await readBoxes(src, ext, { voxelize:!!opts.voxelize, res:opts.res, fill:opts.fill });
      const r=boxesToPart(r0.boxes, Object.assign({ up: opts.voxelize?'y':'y', name:'导入模型' }, opts||{}));
      return r.ok ? ok(Object.assign({}, r, { boxes:r0.boxes.length, kind:r0.kind,
        voxels:(r0.stats&&r0.stats.voxels)||0 })) : r;
    }catch(e){ return err(e); }
  },
  /** 只解析不落盘，先看统计（方便定 parent/position/fitHeight）*/
  async inspectVox(src){
    try{
      const p=parseVox(await fetchArrayBuffer(src));
      const boxes=voxGreedy(p.size, p.cells);
      return ok({ voxels:p.count, voxSize:p.size, mergedBoxes:boxes.length, models:p.models,
        paletteTop:p.palette.slice(0,8) });
    }catch(e){ return err(e); }
  },
  /* ---- ★ 参照图（描图底 + 取色）----
   * setRefImage 是唯一的异步命令，要 await。其余同步。
   * 工作流：await setRefImage(图) → sampleRefColor / refPalette 对齐配色
   *        → recipes()/buildPart() 拼精细部件 → render() 叠图自检 → 迭代
   * ---------------------------------------------------------------------- */
  setRefImage(src, opts={}){ return loadRefImage(src, opts); },
  refImage(){ return refImg ? ok(Object.assign({}, refImg.info)) : err('还没有载入参照图'); },
  updateRefImage(patch={}){ if(!refImg) return err('还没有载入参照图');
    applyRefOpts(patch||{}); return ok(Object.assign({}, refImg.info)); },
  clearRefImage(){ clearRefImg(); return ok(); },
  sampleRefColor(u, v){ if(!refImg) return err('还没有载入参照图');
    if(typeof u!=='number' || typeof v!=='number') return err('需要归一化坐标 u,v（0~1，左上角为 0,0）');
    return ok(refPixel(u,v)); },
  refPalette(n=6, region){ if(!refImg) return err('还没有载入参照图');
    if(region) for(const k of ['x','y','w','h']) if(typeof region[k]!=='number')
      return err('region 形如 {x:0,y:0,w:1,h:1}（归一化，可用来只统计人物区域）');
    return ok({ colors: refPaletteOf(n, region||undefined), region: region||{x:0,y:0,w:1,h:1} }); },
  updatePrimitive(partId,index,patch={}){ const p=spec.parts.find(x=>x.id===partId); if(!p) return err('无此部件: '+partId);
    const q=p.primitives[index]; if(!q) return err('无此图元: '+index);
    if(q.kind!=='op' && ('mesh' in patch || 'prim' in patch || 'tris' in patch))
      return err('图元 #'+index+' 是 '+q.kind+'，没有 src/mesh/prim/tris；这些字段只属于 kind:\'op\'');
    if(q.kind==='op' && ('mesh' in patch || 'prim' in patch || 'tris' in patch)){
      // 换了源图元 / 三角形子集：重算默认位置（除非这次显式给了 x/y/z）
      const merged=Object.assign({}, q, patch);
      if(!('x' in patch)&&!('y' in patch)&&!('z' in patch)){ delete merged.x; delete merged.y; delete merged.z; }
      const r=makeOpPrim(merged); if(!r.ok) return r;
      Object.assign(q, r.prim);
    }else{
      Object.assign(q, patch);
    }
    normPrim(q); build(); renderAll(); renderPartList(); return ok({ kind:q.kind, triangles:(Array.isArray(q.tris)&&q.tris.length)?q.tris.length:q._tri }); },
  removePrimitive(partId,index){ const p=spec.parts.find(x=>x.id===partId); if(!p) return err('无此部件: '+partId);
    if(!p.primitives[index]) return err('无此图元: '+index);
    p.primitives.splice(index,1); detachGizmo(); build(); renderAll(); renderPartList(); return ok(); },
  listPrimitives(partId){ const p=spec.parts.find(x=>x.id===partId); if(!p) return err('无此部件: '+partId);
    return p.primitives.map((q,i)=>Object.assign({ index:i, triangles:(Array.isArray(q.tris)&&q.tris.length)?q.tris.length:(q.kind==='op'?(q._tri||0):undefined) }, clone(q))); },

  /* ---- 基础网格 ---- */
  listBaseMeshes(){ return BASE_MESHES.map(e=>{ const bb=new THREE.Box3().setFromObject(e.mesh);
    return { key:e.key, name:e.mesh.userData.__label||e.mesh.name||'', group:roleKey(e.mesh),
      groupLabel:ROLE_CN[roleKey(e.mesh)]||roleKey(e.mesh),
      hidden:(spec.base.hidden||[]).includes(e.key),
      transform: spec.base.transforms[e.key] || null,
      center:bb.getCenter(new THREE.Vector3()).toArray().map(v=>+v.toFixed(3)),
      size:bb.getSize(new THREE.Vector3()).toArray().map(v=>+v.toFixed(3)) }; }); },
  setBaseTransform(key,t={}){ if(!spec.base) return err('当前不是基础模型');
    if(!meshByKey(key)) return err('无此基础网格: '+key);
    spec.base.transforms[key]={...(spec.base.transforms[key]||{}), ...t}; build(); return ok(); },
  hideBaseMesh(key,hidden=true){ if(!spec.base) return err('当前不是基础模型');
    const set=new Set(spec.base.hidden||[]); hidden?set.add(key):set.delete(key);
    spec.base.hidden=[...set]; build(); renderAll(); return ok(); },
  showAllBase(){ if(spec.base){ spec.base.hidden=[]; build(); renderAll(); } return ok(); },

  /* ---- 外观 / 骨架 ---- */
  setPalette(key,color){ if(!(key in spec.palette)) return err('无此调色板键: '+key);
    spec.palette[key]=normColor(color); build(); return ok(); },
  setPaletteAll(obj){ for(const [k,v] of Object.entries(obj||{})) if(k in spec.palette) spec.palette[k]=normColor(v);
    build(); return ok(); },
  setIris(arr){ if(!Array.isArray(arr)||arr.length!==3) return err('iris 需要 3 个颜色');
    spec.iris=arr.map(v=>v>>>0); if(spec.mode==='parts'&&spec.useOrigFace) build(); return ok(); },
  /** 改骨架。★ 走统一读写桥 —— **groups 和扁平字段一起写**。
   *  ⚠ 以前是 `Object.assign(spec.rig, patch)`：对已经 build 过一次的规格（rig 带 groups，
   *    applyRig 只看 groups）等于「改了没用」。传进来的 ref.rig 是旧扁平格式，
   *    正好由桥负责搬到 groups 去。 */
  setRig(patch={}){ rigPatch(patch); build(); return ok({ rigFormat: spec.rig.groups ? 'groups' : 'legacy' }); },

  /* ---- 选择 / 视口 ---- */
  select(keys=[]){ setSelection(keys.map(String),false); return ok({selection:selection.slice()}); },
  selectPart(partId){ const keys=MESHES.filter(x=>x.part&&x.part.id===partId).map(x=>x.key);
    if(!keys.length) return err('该部件没有网格: '+partId);
    setSelection(keys,false); return ok({selection:keys}); },
  selectBaseGroup(label){ const keys=BASE_MESHES.filter(e=>{ const k=roleKey(e.mesh);
      return k===label || (ROLE_CN[k]||'')===label; }).map(e=>e.key);
    if(!keys.length) return err('无此基础组: '+label+'（可用: '+[...new Set(BASE_MESHES.map(e=>roleKey(e.mesh)))].join(', ')+'）');
    setSelection(keys,false); return ok({selection:keys}); },
  clearSelection(){ detachGizmo(); return ok(); },
  setMode(m){ if(!['translate','rotate','scale','select'].includes(m)) return err('mode 只能 translate/rotate/scale/select');
    setMode(m); return ok({mode:m}); },
  setSpace(s){ if(!['local','world'].includes(s)) return err('space 只能 local/world'); space=s; applyMode(); return ok({space:s}); },
  camera(o={}){ if(o.target) controls.target.set(...o.target);
    if(o.position) camera.position.set(...o.position);
    if(o.fit){ const bb=new THREE.Box3().setFromObject(built.root); const c=bb.getCenter(new THREE.Vector3());
      const sz=bb.getSize(new THREE.Vector3()); const d=Math.max(sz.x,sz.y,sz.z)*2.2;
      controls.target.copy(c); camera.position.set(c.x+d*0.35, c.y+sz.y*0.15, c.z+d); }
    controls.update(); return ok(); },

  /* ---- 输出 ---- */
  /** render()                  截当前视口
   *  render({pass:true})       截「评审图」：纯白背景 + 正交相机（**没有透视变形，剪影才能和参考图比**）
   *  render({pass:true, size}) 指定边长；render({baseline:true}) 顺便把它存成内外差门的基线 */
  render(opts={}){
    if(opts.pass || opts.clean || opts.baseline){
      const c = capturePassShot(opts);
      if(!c) return err('还没有构建（先 build() / loadPreset / loadBase）');
      if(opts.baseline) BASELINE_CANVAS = c;
      return ok({ dataURL:c.toDataURL('image/png'), mode:'pass', size:c.width, baseline:!!opts.baseline,
        note:'纯背景 + 正交相机；可直接当评审对比图，也可以喂给 gates()' });
    }
    renderer.render(scene,camera);
    return ok({ dataURL: renderer.domElement.toDataURL('image/png') });
  },
  exportJS(){ return ok({ code: exportCode() }); },
  exportSpecJSON(){ return ok({ json: JSON.stringify(spec,null,2) }); },
  validate(){
    const errors=[],warnings=[]; const st=stats();
    if(!spec.id) errors.push('id 为空');
    // ★ 只有 parts 模式才要求「必须有部件」——base 模式本来就是一个部件都没有（用原作模型）
    if(spec.mode==='parts' && !spec.parts.length)
      errors.push('规格里一个部件都没有（parts 模式请先 addPart / buildPart / boxify）');
    if(spec.mode==='base' && !(spec.base && spec.base.source))
      errors.push('base 模式但没有 base.source（请先 loadBase(角色id)）');
    for(const p of spec.parts){
      if(!(p.primitives||[]).length) warnings.push(`部件 ${p.id} 没有任何图元（渲染不出来）`);
      if(!PARENTS.map(x=>x[0]).includes(p.parent)) errors.push(`部件 ${p.id} 的父级非法: ${p.parent}`);
      if(!CATEGORIES.includes(p.category)) warnings.push(`部件 ${p.id} 的分类不在原作列表: ${p.category}`);
      for(const [i,q] of p.primitives.entries()){
        if(q.kind==='box'){ if(!(q.w>0&&q.h>0&&q.d>0)) errors.push(`部件 ${p.id} #${i} 尺寸非正`);
          if(q.color===undefined) warnings.push(`部件 ${p.id} #${i} 没有颜色`); }
        else if(q.kind==='panel'){ if(!Array.isArray(q.points)||q.points.length<3) errors.push(`部件 ${p.id} #${i} 面板点数 <3`); }
        else if(q.kind==='op'){
          const sp=sourceParts(q.src); const mr=sp.meshes[q.mesh]; const pq=mr&&mr.prims[q.prim];
          if(!pq) errors.push(`部件 ${p.id} #${i} 引用的原作图元不存在: ${q.src} mesh=${q.mesh} prim=${q.prim}`);
          else if(Array.isArray(q.tris)){
            for(const t of q.tris) if(!(t>=0 && t<pq.tri)){ errors.push(`部件 ${p.id} #${i} 三角形下标越界: ${t}`); break; }
          }
          if(typeof q.x!=='number'||typeof q.y!=='number'||typeof q.z!=='number') errors.push(`部件 ${p.id} #${i} 缺少位置`);
        }
        else if(q.kind==='geo'){
          if(!q.shape) errors.push(`部件 ${p.id} #${i} geo 缺少 shape`);
          if(!(q.w>0&&q.h>0&&q.d>0)) errors.push(`部件 ${p.id} #${i} geo 尺寸非正`);
        }
        else errors.push(`部件 ${p.id} #${i} 未知类型: ${q.kind}`);
      }
    }
    for(const p of spec.parts) if(p.mirror && !OPPOSITE[p.parent]) warnings.push(`部件 ${p.id} 开启镜像但父级无对侧（将在同侧镜像）`);
    for(const p of spec.parts){                             // 精细度：手工图元太少的部件给提示
      const m=manualPrims(p); if(!m.length || m.length!==p.primitives.length) continue;
      const want=DETAIL_MIN[p.category];
      if(want!=null && m.length<want) warnings.push(`部件 ${p.id}（${p.category}）只用了 ${m.length} 个手工图元，`+
        `建议用 ≥${want} 个小模块拼精细些（recipes() 看配方，buildPart 生成）`);
    }
    // 同一个源图元的三角形被重复占用 → rezone 时归属有歧义（不重叠地切开是正常的，不警告）
    const refs=new Map();
    for(const p of spec.parts) for(const [i,q] of p.primitives.entries()){
      if(q.kind!=='op') continue;
      const k=q.src+'|'+q.mesh+'|'+q.prim;
      let e=refs.get(k); if(!e){ e={ owners:[], whole:false, set:new Set() }; refs.set(k,e); }
      const whole=(!Array.isArray(q.tris)||!q.tris.length);
      let dup=false;
      if(whole){ if(e.whole || e.set.size) dup=true; }
      else if(e.whole){ dup=true; }
      else { for(const t of q.tris) if(e.set.has(t)){ dup=true; break; } }
      if(dup) warnings.push(`源图元被重复占用：${q.src} 网格${q.mesh} 图元${q.prim} → ${e.owners.join(' / ')} 与 ${p.id}#${i} 的三角形重叠（rezone 归属有歧义）`);
      else { e.owners.push(p.id+'#'+i);
        if(whole) e.whole=true; else for(const t of q.tris) e.set.add(t); }
    }
    return { ok: errors.length===0, errors, warnings, stats:st, budget:{ estimate: estimatedBudget(), limits:BUDGET } };
  },

  /* ---- 撤销 / 批量 ---- */
  undo(){ if(!undoStack.length) return err('没有可撤销的步骤');
    redoStack.push(clone(spec)); spec=undoStack.pop(); detachGizmo(); build(); renderAll(); renderPartList(); return ok(); },
  redo(){ if(!redoStack.length) return err('没有可重做的步骤');
    undoStack.push(clone(spec)); spec=redoStack.pop(); detachGizmo(); build(); renderAll(); renderPartList(); return ok(); },
  /* =======================================================================
   * ★★ AI 生成流水线（提炼自 img2threejs 的 next.py / workflow_state.py）
   *    「对话上下文可丢弃；state 才是本地清单的权威。」
   *    任何 AI 在任何一个回合，先调 pipeline() 就知道下一步干什么、命令是什么、证据要什么。
   * ===================================================================== */

  /** 现在在哪一步 / 哪一遍 / 下一步的确切命令。**每个回合开始都应该先调这个。** */
  pipeline(){ agentHeartbeat(); return ok(PIPELINE.status()); },

  /** 标记一步（按顺序、必须带证据）。status 默认 'done' */
  pipelineMark(stepId, opts={}){ agentHeartbeat(); const r=PIPELINE.mark(stepId, opts); persistPipeline(); maybeAutoRelease(); refreshPipeUI(); return r; },

  /** 写入一条评审：continue | refine-spec | refine-code | request-input | stop
   *  · continue 必须带 evidence（对比图/文件名/gate 报告），分数 <0.7 会被拒（不许硬说通过）
   *  · refine-* 计循环：每遍 3 次、总计 6 次，到顶 pipeline 硬停（status='stopped'）
   *  · refine-spec = 规格错/浅（回去改规格，别改代码掩盖）；refine-code = 规格对、实现不对 */
  record(action, payload={}){ agentHeartbeat(); const r=PIPELINE.record(action, payload); persistPipeline(); maybeAutoRelease(); refreshPipeUI(); return r; },

  /** 显式换遍 / 重置流水线 */
  pipelineSetPass(passId){ const r=PIPELINE.setPass(passId); persistPipeline(); refreshPipeUI(); return r; },
  pipelineReset(opts={}){ PIPELINE.reset(opts); clearPersistedPipeline(); refreshPipeUI(); return ok(PIPELINE.status()); },

  /** 读 / 写质量契约（复杂度档位 + 完成定义 + 最小配额）
   *  不传参数 = 读；传 = 合并写入。complexity 决定最小部件/图元/身份件数量。 */
  contract(patch){
    if(!patch){
      const c = PIPELINE.s.contract || makeContract();
      return ok({ contract:c, check:checkContract(spec, c),
        complexityOptions:Object.keys(COMPLEXITY_MINIMUMS), minimums:COMPLEXITY_MINIMUMS,
        featureGroups:FEATURE_GROUPS });
    }
    // ★ 复杂度档位必须是已知的 —— 否则 minimumSpecDepth 会静默退化成上一个档位，
    //   后面 checkContract / 严格校验全都会按错的配额判
    if(patch.complexity && !COMPLEXITY_MINIMUMS[patch.complexity])
      return err('未知复杂度档位: '+JSON.stringify(patch.complexity)
        + '（可用: '+Object.keys(COMPLEXITY_MINIMUMS).join(' | ')+'）');
    const base = PIPELINE.s.contract || makeContract(patch.complexity || 'moderate');
    const merged = { ...base, ...patch };
    if(patch.complexity) merged.minimumSpecDepth = COMPLEXITY_MINIMUMS[patch.complexity];
    PIPELINE.s.contract = merged;
    return ok({ contract:merged, check:checkContract(spec, merged) });
  },
  /** contract(patch) 的显式别名 */
  setContract(patch){ return EditorAPI.contract(patch); },

  /** 会话存档：把流水线状态 + 规格写进 localStorage（页面刷新/换一个 AI 会话都能接着干）*/
  saveSession(){ return saveSession().then(p=>({ ok:true, bytes:JSON.stringify(p).length, key:SESSION_KEY })); },
  loadSession(){ try{ const raw=localStorage.getItem(SESSION_KEY); if(!raw) return err('本地没有存档');
      return ok(loadSessionPayload(JSON.parse(raw))); }catch(e){ return err(e); } },
  exportSession(){ const p={ savedAt:Date.now(), pipeline:PIPELINE.toJSON(), spec }; 
    return ok({ json:JSON.stringify(p), bytes:JSON.stringify(p).length }); },
  importSession(j){ const o = typeof j==='string'? JSON.parse(j) : j; return ok(loadSessionPayload(o)); },

  /* =======================================================================
   * ★★ 质量门（提炼自 img2threejs 的 stage4_review/）—— 确定性度量
   *    · 轮廓 IoU 用 224² 网格、最大值连通块、归一化到各自包围盒
   *    · 转盘门不需要参考图（多角度自洽）
   *    · 「没测」一律报 unevaluated，绝不报 pass
   * ===================================================================== */

  /** 参照图可用性判定（照抄 check_reference_admission 的阈值 + 三视图拼版检测）*/
  admit(){ return ok(admitReference()); },

  /** 一个门失败时的人话原因（面板和 AI 都能用）*/
  gateFailDetail(gate){ return GATES.failDetail(gate); },

  /** 设置/读取参照图的裁切区（归一化 {x,y,w,h}）—— 三视图拼版必须先切出一屏，轮廓门才有意义
   *  不传参数 = 读；传 null = 清除；传 {index:n} = 用 admit() 建议的第 n 屏 */
  refCrop(rect){
    if(!refImg) return err('还没有参照图');
    if(rect === undefined) return ok({ crop: refImg.info.crop||null, usesFullImage: !refImg.info.crop });
    if(rect && rect.index != null){
      const v = GATES.detectViews(GATES.largestComponent(GATES.maskFromCanvas(refImg.canvas, { mode:'auto' })));
      const c = v.crops[rect.index];
      if(!c) return err(`没有第 ${rect.index} 屏（共 ${v.count} 屏）`, undefined);
      refImg.info.crop = c.rect;
      return ok({ crop:c.rect, label:c.label, allViews:v.crops });
    }
    refImg.info.crop = rect;
    return ok({ crop:rect, usesFullImage: !rect });
  },

  /** 跑全部适用的质量门。
   *  opts: {
   *    passId,          默认取当前遍（决定 IoU 门槛）
   *    turntable:true,  拍 8 个方位跑转盘门（稍慢）
   *    penetration:false,  默认关（O(对数×采样)——部件多时慢）
   *    clearance:true,  默认开（身份件 vs 宿主的净空）
   *    size:512, pad:1.10, grid, allowHoles
   *  }
   *  返回每个门的完整报告 + summary（有 unevaluated 就是 unevaluated，不是 pass）*/
  async gates(opts={}){
    if(!built) return err('还没有构建（先 build() / loadPreset / loadBase）');
    const t0=performance.now();
    const passId = opts.passId || PIPELINE.s.currentPass;
    const size = opts.size || 512;
    const report={};
    const frame=modelFrame(opts);
    if(!frame) return err('取不到模型包围盒');

    const front = withCleanScene(()=>orthoShot(frame, opts.azimuth ?? 0, size), opts);

    // 门 0 · 轮廓
    if(opts.silhouette===false){
      report.silhouette={ gate:'silhouette', verdict:'unevaluated', reason:'opts.silhouette=false 主动跳过' };
    }else if(!refImg){
      report.silhouette={ gate:'silhouette', verdict:'unevaluated', reason:'还没有参照图 → 先 await setRefImage()' };
    }else if(!refImg.info.visible){
      report.silhouette={ gate:'silhouette', verdict:'unevaluated', reason:'参照图当前隐藏（updateRefImage({visible:true}) 打开）' };
    }else{
      report.silhouette = GATES.silhouetteGate(refImg.canvas, front, { passId, grid:opts.grid, bg:[255,255,255],
        refCrop: opts.refCrop ?? refImg.info.crop ?? null });
    }

    // 门 1 · 转盘（多角度自洽，不需要参考图）
    if(opts.turntable){
      const azs = opts.azimuths || [0,45,90,135,180,225,270,315];
      const views = withCleanScene(()=>azs.map(az=>({ azimuth:az, canvas:orthoShot(frame, az, size) })), opts);
      report.turntable = GATES.turntableGate(views, { allowHoles:!!opts.allowHoles, bg:[255,255,255] });
    }

    // 门 2 · 内外差（要有基线；基线默认第一次 gates 时自动存当前这一帧）
    if(BASELINE_CANVAS){
      report.interior = GATES.interiorDifference(BASELINE_CANVAS, front, { bg:[255,255,255] });
    }else{
      BASELINE_CANVAS = front;
      report.interior = { gate:'interior-difference', verdict:'unevaluated',
        reason:'还没有基线图 —— 已把当前这一帧存为基线；改完模型再跑一次 gates() 就能看到内部差异' };
    }

    // 门 3 · 左右镜像
    report.chirality = GATES.chiralityGate(spec, {});

    // 一次算好每个部件的世界包围盒，后面几个门共用
    const boxes = partBoxes();
    const boxOf = id => boxes.get(id) || null;

    // 门 4 · 接缝（部件→部件；以及「手搓部件 vs 它挂靠组的原作几何」）
    //   注意：groupBoxes 只能用**原作几何**（含 op 图元）算，绝不能把部件自己算进去——
    //   否则包围盒天然包含自己，门恒真、毫无意义。
    const groupBoxes = new Map();
    for(const p of spec.parts){
      if(!isOriginalPart(p)) continue;
      const a = boxOf(p.id); if(!a) continue;
      const cur = groupBoxes.get(p.parent); if(cur) cur.union(a); else groupBoxes.set(p.parent, a);
    }
    report.seam = GATES.seamGate(spec, boxes, { groupBoxes });

    // 门 5 · 净空（身份件不许陷进宿主）
    if(opts.clearance !== false){
      // 按**部件**聚合网格（一个部件 55 个网格不能算 55 个探针）
      const wrapMeshes = (name, meshes) => ({ name, traverse: cb => { for(const m of meshes) cb(m); } });
      const byPart = new Map();
      for(const e of MESHES){
        if(e.imported || !e.part || !e.mesh || !e.mesh.geometry) continue;
        let rec = byPart.get(e.part.id);
        if(!rec){ rec = { part:e.part, meshes:[], anyVisible:false }; byPart.set(e.part.id, rec); }
        rec.meshes.push(e.mesh);
        if(visibleNow(e.mesh)) rec.anyVisible = true;
      }
      const mk = (rec, label) => ({ name:(rec.part.name||rec.part.id)+(label?(' ['+label+']'):''),
        object: wrapMeshes((rec.part.name||rec.part.id), rec.meshes) });
      const probes=[], hosts=[];
      // 探针 = 手搓的身份件（含 op 图元的原作件已经在原位，不用查）
      for(const rec of byPart.values()){
        if(!rec.anyVisible || isOriginalPart(rec.part)) continue;
        if(IDENTITY_RE.test((rec.part.name||'')+' '+(rec.part.category||''))) probes.push(mk(rec));
      }
      // 宿主 = 有原作几何的部件（头骨/躯体），优先 head/body 组
      for(const rec of byPart.values()){
        if(!isOriginalPart(rec.part)) continue;
        if(rec.part.parent==='head' || rec.part.parent==='body') hosts.push(mk(rec));
      }
      // ★ 纯手搓角色（比如「通用体型」）没有 op 图元，但 attachFace 加进来的那张
      //   脸/头骨网格才是「头发沉进头骨」真正该比的宿主 —— 它不在 MESHES 里，要单独找
      {
        const skullMeshes=[];
        if(built && built.G && built.G.head)
          built.G.head.traverse(o=>{ if(o.isMesh && o.geometry && !o.userData.__entry) skullMeshes.push(o); });
        if(skullMeshes.length) hosts.push({ name:'头骨（原作脸）', object: wrapMeshes('skull', skullMeshes) });
      }
      // 兜底：还是没宿主 → 用 head/body 下的其它手搓部件
      if(!hosts.length){
        for(const rec of byPart.values()){
          if(!rec.anyVisible || isOriginalPart(rec.part)) continue;
          if(rec.part.parent!=='head' && rec.part.parent!=='body') continue;
          if(IDENTITY_RE.test((rec.part.name||'')+' '+(rec.part.category||''))) continue;
          hosts.push(mk(rec));
        }
      }
      report.clearance = (probes.length && hosts.length)
        ? GATES.clearanceGate(probes, hosts, { samples: opts.clearanceSamples ?? 150 })
        : { gate:'clearance', verdict:'unevaluated',
            reason: probes.length
              ? '找不到宿主（需要 head/body 组里有原作几何的部件；也可以在 opts 里显式给 hosts）'
              : '场景里没有手搓的身份特征件（头发/兽耳/马尾/饰品…）—— 若这些件来自 boxify，它们已经在原位，无需净空检查' };

      // 门 5b · 头皮覆盖（头发专用，硬门）：头皮有没有露出来
      //   ★ 这才是「秃斑」的正确判据 —— 「头发有没有在头骨里」是错的问题（发根本来就埋着）
      const hairProbes = [], skullHost = hosts.find(h=>/头骨|skull/.test(h.name));
      for(const rec of byPart.values()){
        if(!rec.anyVisible) continue;
        if(!IDENTITY_RE.test((rec.part.name||'')+' '+(rec.part.category||''))) continue;
        if(/发|刘海/.test((rec.part.name||'')+' '+(rec.part.category||''))) hairProbes.push({ name:rec.part.name, object: wrapMeshes(rec.part.name, rec.meshes) });
      }
      const skullObj = skullHost ? skullHost.object : null;
      report.scalp = (hairProbes.length && skullObj)
        ? GATES.scalpGate(skullObj, hairProbes, { maxExposed: opts.maxExposed ?? 0.05, lateral: opts.scalpLateral })
        : { gate:'scalp-coverage', verdict:'unevaluated',
            reason: hairProbes.length ? '找不到头骨宿主' : '场景里没有头发件' };
    }

    // 门 6 · 穿插（默认关：O(对数×采样)）
    if(opts.penetration){
      // 按**部件**分组（一个部件几十个网格不能当几十个对象），并标出是手搓还是原作几何
      const wrapM = (name, meshes) => ({ name, traverse: cb => { for(const m of meshes) cb(m); } });
      const recs = new Map();
      for(const e of MESHES){
        if(e.imported || !e.part || !e.mesh || !e.mesh.geometry || !visibleNow(e.mesh)) continue;
        let rec = recs.get(e.part.id);
        if(!rec){ rec = { name:e.part.name||e.part.id, meshes:[], kind: isOriginalPart(e.part) ? 'original' : 'hand',
          hair: /发|刘海/.test((e.part.name||'')+' '+(e.part.category||'')) }; recs.set(e.part.id, rec); }
        rec.meshes.push(e.mesh);
      }
      const objs = [...recs.values()].map(r=>({ name:r.name, kind:r.kind, hair:r.hair, object:wrapM(r.name, r.meshes) }));
      report.penetration = objs.length>=2
        ? GATES.penetrationGate(objs, { samples: opts.penetrationSamples ?? 150, maxPairs: opts.maxPairs ?? 60,
            // 原作几何之间本来就靠互相压叠来避免接缝 —— 报它们是噪声
            // 头发各件之间也是**故意**互相嵌入的（刘海要嵌进主帽、发束要嵌进后发板）
            skipPair: (a,b)=> (a.kind==='original' && b.kind==='original') || (a.hair && b.hair) })
        : { gate:'penetration', verdict:'unevaluated', reason:'可测对象少于 2 个' };
    }

    const summary = GATES.summarize(report);
    LAST_GATE = { report, summary, passId, iouThreshold: GATES.IOU_BY_PASS[passId] ?? GATES.IOU_BY_PASS._default, ts:Date.now() };
    if(typeof renderPipelinePanel === 'function' && pipeBody) setTimeout(renderPipelinePanel, 0);
    return ok({ report, summary, passId, iouThreshold: GATES.IOU_BY_PASS[passId] ?? GATES.IOU_BY_PASS._default,
      ms: Math.round(performance.now()-t0),
      note: summary.verdict==='pass' ? '所有门通过'
        : (summary.verdict==='fail' ? '★ 有门没通过：'+summary.reasons.join(' / ')
        : '★ 有门没测到：'+summary.unevaluated.join(', ')+' —— 没测 ≠ 通过') });
  },

  /** 只存/取门用的基线图（同相机同取景的干净正面图）*/
  baseline(action){
    if(action==='clear'){ BASELINE_CANVAS=null; return ok({ baseline:null }); }
    if(action==='get'){ return ok({ baseline: BASELINE_CANVAS? BASELINE_CANVAS.toDataURL('image/png') : null }); }
    const c = capturePassShot({});
    if(!c) return err('还没有构建');
    BASELINE_CANVAS = c;
    return ok({ baseline:'已更新', dataURL:c.toDataURL('image/png') });
  },

  /* =======================================================================
   * 给 AI 用的便捷件（加部件 / 改部件 / 看结构）
   * ===================================================================== */

  /** 紧凑的部件树 —— 比 listParts() 便宜，一眼看清层级和层级下的图元数 */
  tree(opts={}){
    const full=!!opts.full;
    const ids=new Set(spec.parts.map(p=>p.id));
    const mk = p => ({ id:p.id, name:p.name, cat:p.category, parent:p.parent,
      prims:(p.primitives||[]).length, tris:partTriangles(p), mirror:!!p.mirror,
      ...(full? { primitives:p.primitives } : {}),
      children: spec.parts.filter(q=>q.parent===p.id).map(mk) });
    return ok({
      id:spec.id, name:spec.name, mode:spec.mode,
      roots: spec.parts.filter(p=>!ids.has(p.parent)).map(mk),
      counts:{ parts:spec.parts.length,
        primitives:spec.parts.reduce((a,p)=>a+(p.primitives||[]).length,0),
        triangles: spec.parts.reduce((a,p)=>a+partTriangles(p),0) },
      identityParts: identityParts().map(p=>({ id:p.id, name:p.name, primitives:(p.primitives||[]).length,
        enough:(p.primitives||[]).length >= ((PIPELINE.s.contract&&PIPELINE.s.contract.minimumSpecDepth.detailPerPart)||3) })),
    });
  },

  /** 一个部件的全部信息（含包围盒、所在组、父级、图元明细）*/
  describe(partId){
    const p=spec.parts.find(x=>x.id===partId);
    if(!p) return err('无此部件: '+partId+'（用 tree() 看全部 id）');
    const boxes=partBoxes(), b=boxes.get(partId);
    return ok({ part:p,
      triangles:partTriangles(p), primitives:(p.primitives||[]).length,
      bounds: b? { min:b.min.toArray().map(v=>+v.toFixed(4)), max:b.max.toArray().map(v=>+v.toFixed(4)),
        size:b.getSize(new THREE.Vector3()).toArray().map(v=>+v.toFixed(4)),
        center:b.getCenter(new THREE.Vector3()).toArray().map(v=>+v.toFixed(4)) } : null,
      primitivesDetail: (p.primitives||[]).map((q,i)=>({ index:i, kind:q.kind, color:q.color,
        pos:[q.x||0,q.y||0,q.z||0], size:[q.w||null,q.h||null,q.d||null].some(v=>v!=null)? [q.w,q.h,q.d]:null,
        shape:q.shape||null, points:q.points||null })) });
  },

  /** 幂等添加/更新一个部件（**重跑一遍同样的调用不会产生重复部件**）
   *  part = { id, name, category, parent, metalness?, mirror?, primitives:[...] }
   *  已存在 → 更新字段；给了 primitives → 整体替换图元表 */
  upsertPart(part={}){
    if(!part.id) return err('upsertPart 需要 id');
    const exist = spec.parts.find(p=>p.id===part.id);
    if(exist){
      const before = JSON.stringify({ n:exist.name, c:exist.category, p:exist.parent, k:(exist.primitives||[]).length });
      for(const k of ['name','category','parent','metalness','mirror']) if(part[k]!==undefined) exist[k]=part[k];
      if(Array.isArray(part.primitives)) exist.primitives = part.primitives.map(normPrim);
      detachGizmo(); build(); renderAll(); renderPartList();
      return ok({ created:false, id:part.id, primitives:(exist.primitives||[]).length, changed: before!==JSON.stringify({ n:exist.name, c:exist.category, p:exist.parent, k:(exist.primitives||[]).length }) });
    }
    const r = EditorAPI.addPartJSON({ parent:'body', category:'额外装饰', mirror:false, ...part });
    return r.ok ? { ok:true, created:true, id:part.id, primitives:(part.primitives||[]).length } : r;
  },

  /** 批量加部件（一次 undo 记录）。items 同上 upsertPart；opts.upsert=true 时用 upsert 语义 */
  addParts(items=[], opts={}){
    if(!Array.isArray(items)) return err('addParts 需要数组');
    const results = items.map(it => (opts.upsert || it.upsert) ? EditorAPI.upsertPart(it) : EditorAPI.addPartJSON(it));
    const created = results.filter(r=>r.ok).length;
    return { ok: created===results.length, created, total:items.length,
      failures: results.filter(r=>!r.ok).map(r=>r.error) };
  },

  /** 配方参数的机器可读说明（AI 用来决定参数，不用猜）
   *  返回每个配方的 label / doc / category / parent / params(默认值) */
  recipeSchema(){
    return ok({ recipes: Object.entries(RECIPES).map(([name,r])=>({
      name, label:r.label, category:r.category, parent:r.parent||'head', doc:r.doc,
      params: r.def, paramKeys: Object.keys(r.def||{}),
    })) });
  },

  /** 给某个部件做一个「真正的镜像孪生」（x 取反 + 绕 y/z 的旋转取反；lathe/extrude 的轮廓也镜像）
   *  比复制粘贴靠谱，也比手工填 -x 靠谱 —— 「左右是镜像，不是旋转」 */
  mirrorPair(partId, newName){
    const p=spec.parts.find(x=>x.id===partId);
    if(!p) return err('无此部件: '+partId+'（用 tree() 看全部 id）');
    if(p.mirroredFrom) return err(`部件 ${partId} 本身已经是镜像产物（源=${p.mirroredFrom}）`);
    // ★ mirror:true 的部件在渲染时**已经自动镜像出对侧**了 —— 再镜像就是第 3、4 份重复几何
    if(p.mirror) return err(`部件 ${partId} 已经开了 mirror（渲染时会自动镜像到对侧），`
      + `再做镜像会得到重复几何。要单独的孪生件，请先 updatePart('${partId}',{mirror:false})`);
    let id=partId+'_m', n=2; while(spec.parts.some(x=>x.id===id)) id=partId+'_m'+(n++);
    const twin = clone(p);
    twin.id = id;
    twin.name = newName || (/L$/.test(p.name||'') ? p.name.replace(/L$/,'R')
                        : /R$/.test(p.name||'') ? p.name.replace(/R$/,'L')
                        : (p.name||p.id)+'（镜像）');
    twin.mirror = true; twin.mirroredFrom = p.id;
    twin.primitives = (p.primitives||[]).map(mirrorPrimitive);
    spec.parts.push(twin);
    detachGizmo(); build(); renderAll(); renderPartList();
    return ok({ id, name:twin.name, primitives:twin.primitives.length, source:partId });
  },

  /** 按名字/类别/父级模糊查部件 */
  findParts(q){
    const re = new RegExp(String(q||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
    return ok({ query:String(q||''), matches: spec.parts.filter(p=>re.test(p.id+' '+p.name+' '+p.category+' '+p.parent))
      .map(p=>({ id:p.id, name:p.name, category:p.category, parent:p.parent, primitives:(p.primitives||[]).length })) });
  },

  /** 一次调用改一批图元（比 N 次 updatePrimitive 少 N-1 次重建）*/
  updatePrimitives(edits=[]){
    if(!Array.isArray(edits)) return err('updatePrimitives 需要数组 [{partId, index, patch}]');
    const results = edits.map(e=>{
      const p=spec.parts.find(x=>x.id===e.partId);
      if(!p) return { ok:false, error:'无此部件: '+e.partId };
      const q=p.primitives[e.index];
      if(!q) return { ok:false, error:`无此图元: ${e.partId}#${e.index}` };
      Object.assign(q, e.patch||{}); normPrim(q); return { ok:true };
    });
    build(); renderAll(); renderPartList();
    return { ok:results.every(r=>r.ok), changed:results.filter(r=>r.ok).length, failures:results.filter(r=>!r.ok).map(r=>r.error) };
  },

  /* ---- 变体 / 选择还原（以前只是内部函数，文档里提到了但 API 上够不着）---- */

  /** 体型变体：**纯函数**，不动当前规格，返回一个新的 spec。
   *  variantSpec(baseSpec, { height, width, head, armLen, armThick, legThick }, name?)
   *    height 纵向 / width 横向 / head 头放大 / armLen 臂长 / armThick·legThick 粗细
   *  脚落地、头坐肩、比例解算都做完了。
   *  例：EditorAPI.setSpec(EditorAPI.variantSpec(EditorAPI.getSpec().spec, { height:0.95 }, '矮一点').spec) */
  variantSpec(base, v = {}, name){
    const src = (base && base.parts) ? base : spec;        // 不传就用当前规格
    const s = variantSpec(src, v, name);
    const out = { spec:s, id:s.id, name:s.name, parts:s.parts.length,
      primitives: s.parts.reduce((a, p) => a + ((p.primitives||[]).length), 0) };
    if(s._variantWarn) out.warn = s._variantWarn;          // 见 variantSpec()：全是 op 图元时只挪骨架
    return ok(out);
  },

  /** 选中图元的**位置快照**。图元索引会变（rezone / boxify 之后 key 不稳定），位置不会。
   *  配合 selectByPositions() 用：改完规格还能找回「原来选中的那几个」。 */
  snapshotPrimPositions(){ return ok({ positions: snapshotPrimPositions() }); },

  /** 按位置快照找回图元**并选中**，返回选中的 key 数组。 */
  selectByPositions(list){
    if(!Array.isArray(list) || !list.length) return err('selectByPositions 需要位置快照数组 [{x,y,z}]');
    const keys = selectByPositions(list);
    if(keys.length){ selection = keys; refreshGizmo(); }
    return ok({ keys, count:keys.length });
  },

  /* =======================================================================
   * ★ 保存 / 新增模型 / 缓存 / 显卡 / Agent 接管
   *   三个目录分工（**别混用**）：
   *     NewlyAddedModelList/           确认的新增模型（正式）→ 角色实验室「新增模型」展示
   *     NewlyAddedModelTemporaryList/  待确认的新增模型（临时）
   *     TemporaryCache/                AI 测试产物 / 缓存，随时可清
   * ===================================================================== */

  /** 显卡：当前浏览器实际用哪块卡跑 3D */
  gpu(){ const info=gpuInfo(); const advice=gpuAdvice(info);
    return ok({ ...info, level:advice.level, title:advice.title, steps:advice.steps, docs:advice.docs }); },

  /** 把**当前规格**存成「新增模型」。默认进临时区；confirmed:true 直接进正式区。
   *  opts: { id?, name?, note?, confirmed?, withJs?, withThumb? } */
  async saveModel(opts={}){
    const id = opts.id || spec.id || 'model';
    const payload = { id, name: opts.name || spec.name || id,
      category: opts.category || '新增模型', source:'editor:exportJS', note: opts.note || '',
      spec: clone(spec),
      stats: { parts: spec.parts.length,
        primitives: spec.parts.reduce((a,p)=>a+((p.primitives||[]).length),0),
        triangles: stats().triangles, mode: spec.mode },
      dir: opts.confirmed ? 'confirmed' : 'temporary' };
    if(opts.withJs !== false) payload.js = exportCode();
    if(opts.withThumb !== false){ try{ renderer.render(scene,camera); payload.thumb = renderer.domElement.toDataURL('image/png'); }catch(e){} }
    try{
      const r = await Store.saveModel(payload);
      return ok({ ...r, note: r.where==='confirmed' ? '已存进 NewlyAddedModelList（正式）' : '已存进 NewlyAddedModelTemporaryList（临时）—— 确认后调 confirmModel()' });
    }catch(e){ return err('保存失败：'+((e&&e.message)||e)); }
  },

  /** 列出已保存的新增模型（正式 + 临时） */
  listStoredModels(){ return storeCall('读模型列表', ()=>Store.listModels()); },

  /** 从已保存的模型载入编辑器 */
  async loadStoredModel(id, opts={}){
    let r;
    try{ r = await Store.getModel(id); }catch(e){ return err('载入失败：'+((e&&e.message)||e)); }
    if(!r || !r.spec) return err('这个模型里没有 spec: '+id);
    spec = r.spec; detachGizmo(); selectedId=null; build(); renderAll(); renderPartList();
    return ok({ id:r.id, name:r.name, where:r.where, parts:spec.parts.length, triangles:stats().triangles });
  },

  /** 临时 → 正式（确认这个新增模型）*/
  confirmModel(id){ return storeCall('确认模型', async()=>{ const r = await Store.confirm(id||spec.id); return { ...r, note:'已移入 NewlyAddedModelList' }; }); },
  /** 正式 → 临时（撤回确认）*/
  unconfirmModel(id){ return storeCall('撤回确认', async()=>{ const r = await Store.unconfirm(id||spec.id); return { ...r, note:'已移回 NewlyAddedModelTemporaryList' }; }); },
  removeStoredModel(id){ return storeCall('删除模型', ()=>Store.removeModel(id)); },

  /* =======================================================================
   * ★ 模型文件：AI Agent 取用（详见 docs/model-files.md）
   *   磁盘上的模型    → Store.getModelBundle(id) / GET /api/models/:id/bundle
   *   没保存的当前状态 → modelFile()（同一形状，只是不落盘）
   * ===================================================================== */

  /** ★ 把**当前编辑器状态**当成一个「模型文件」返回。
   *  形状和 `GET /api/models/:id/bundle` 完全一致，调用方不用区分磁盘/内存。
   *  用处：AI 想读现场但还不想保存；或者只想把模型拿走做参考。 */
  modelFile(opts={}){
    const parts = spec.parts || [];
    const st = { parts: parts.length,
      primitives: parts.reduce((a, p) => a + ((p.primitives||[]).length), 0),
      triangles: stats().triangles, mode: spec.mode };
    return ok({ ok:true, id: spec.id, where:'memory',
      path:'(只在浏览器内存里，还没落盘)',
      schema:'lowpoly-workshop/model@1',
      meta:{ id:spec.id, name:spec.name, category:spec.category || '新增模型',
        source:'editor:modelFile', note: opts.note || '', createdAt:null, updatedAt:Date.now() },
      spec: clone(spec), stats: st,
      js: opts.withJs === false ? null : exportCode(),
      files: [], urls:{ model:null, js:null, thumb:null },
      howto:'要落盘就调 saveModel()；要拿磁盘上已存的用 Store.getModelBundle(id)。' });
  },

  /** 原作角色索引（低模 14 人 + 高模烘焙变体）。浏览器才是权威来源。 */
  characters(){ return storeCall('读角色索引', ()=>Store.characters()); },

  /** 把权威角色清单写回 `data/characters.json` —— 服务端就不用靠扫目录猜了 */
  exportCharacterIndex(){ return storeCall('导出角色索引', async()=>{
    const [cur, ref] = await Promise.all([
      Store.characters(),
      fetch('/data/reference-models.json').then(r => r.json()).catch(()=>null) ]);
    const labels = {};
    for(const k of Object.keys((ref && ref.models) || {})) labels[k] = ref.models[k].label;
    const low = (cur.low || []).map(m => ({ ...m, label: labels[m.id] || m.label }));
    const r = await Store.publishCharacters({ ...cur, low, generatedBy:'EditorAPI.exportCharacterIndex()' });
    return { ...r, note:'已写回 data/characters.json' };
  }); },

  /** AI 入口总览（服务端 /api/index 的代理）—— 「这里有什么、从哪拿」 */
  aiIndex(){ return storeCall('读 AI 入口', ()=>Store.index()); },


  /** 把任意数据丢进 TemporaryCache（AI 测试产物都放这）
   *  opts: { name?, data, ext?, thumb? } —— 不传 data 就存当前规格 */
  cachePut(opts={}){
    const data = opts.data !== undefined ? opts.data
      : { spec: clone(spec), state: state(), pipeline: PIPELINE.toJSON() };
    return storeCall('写缓存', ()=>Store.cachePut({ name: opts.name || (spec.id+'-cache'), data, ext: opts.ext, thumb: opts.thumb }));
  },
  cacheList(){ return storeCall('读缓存列表', ()=>Store.cacheList()); },
  /** 清空 TemporaryCache —— 主界面也有这个按钮 */
  cacheClear(){ return storeCall('清缓存', ()=>Store.cacheClear()); },

  /** 当前接管生成流程的 AI Agent（租约制：超过 ttlMinutes 没 ping 就算已退出）
   *  ★ 交还规矩：Agent 干完活必须交还 —— await agentRelease('做完交还')
   *    没交还也没关系：租约到期后 occupying 会变成 false，接管位自动空出来 */
  agent(){ return storeCall('读 Agent', ()=>Store.getAgent()); },
  /** 接管登记（名字 + 备注 + 可选租约分钟数，默认 30） */
  async setAgent(agent, note, ttlMinutes){
    try{
      if(agent){
        const r = await Store.setAgent({ agent, note, ttlMinutes });
        _agentSelf = agent; _lastPing = Date.now(); persistPipeline();
        return ok(r);
      }
      _agentSelf = null;                  // 交还后不再心跳
      const r = await Store.releaseAgent(note);
      persistPipeline();
      return ok(r);
    }catch(e){ return err('setAgent：'+((e&&e.message)||e)); }
  },
  /** ★ 交还接管（AI 退出/干完必须调） */
  async agentRelease(note){
    _agentSelf = null;
    try{ const r = await Store.releaseAgent(note); persistPipeline(); return ok(r); }
    catch(e){ return err('交还失败：'+((e&&e.message)||e)); }
  },
  /** 续约：长时间干活时定期调，别让租约过期。没接管时返回 {ok:false}（不抛异常）*/
  agentPing(){ return storeCall('续约', ()=>Store.pingAgent()); },

  /** 一站式：跑门 + 存截图 + 把报告丢进缓存（AI 跑流程时每遍调一次）*/
  async gateAndCache(opts={}){
    if(!built) return err('还没有构建');
    const g = await EditorAPI.gates(opts);
    if(!g.ok) return g;
    const shot = capturePassShot({ size: opts.size || 512 });
    try{
      const rec = await Store.cacheGate((opts.passId||PIPELINE.s.currentPass)+'-'+Date.now(), g.report,
        shot ? shot.toDataURL('image/png') : null);
      return ok({ summary:g.summary, cached:rec.name });
    }catch(e){ return err('写缓存失败：'+((e&&e.message)||e)); }
  },

  batch(cmds=[]){ if(!Array.isArray(cmds)) return err('batch 需要数组');
    pushUndo();
    const results=cmds.map(c=>{ if(!c||!EditorAPI[c.cmd]) return {ok:false,error:'未知命令: '+(c&&c.cmd)};
      const a = (c.args===undefined) ? [] : (Array.isArray(c.args) ? c.args : [c.args]);
      return EditorAPI[c.cmd](...a); });
    // ⚠ 只读命令（state/schema/getSpec/tree/reference/sourceMeshes…）返回的是**纯数据**，
    //   没有 ok 字段 —— 那种也算成功，不能当成失败。
    const isOk = r => (r && typeof r==='object' && 'ok' in r) ? !!r.ok : true;
    return { ok: results.every(isOk), results };
  },
};
function estimatedBudget(){ const totals={}; let est=0;
  for(const part of spec.parts){ let t=0;
    for(const pr of part.primitives||[]){
      if(pr.kind==='box'){ const c=Math.min(pr.w,pr.h,pr.d); t+=c>0.12?108:12; }
      else if(pr.kind==='panel'){ const k=(pr.points||[]).length; t+=(k-2)*2+k*2; }
      else if(pr.kind==='op'){ t += (Array.isArray(pr.tris)&&pr.tris.length) ? pr.tris.length : (pr._tri||0); }
      else if(pr.kind==='geo'){ t += (pr._tri||0) || 60; }
    }
    if(part.mirror) t*=2; totals[part.category]=(totals[part.category]||0)+t; est+=t; }
  return { total:est, totals }; }
/* 把会改规格的命令包一层 undo 记录 */
let undoStack=[], redoStack=[];
function pushUndo(){ undoStack.push(clone(spec)); if(undoStack.length>60) undoStack.shift(); redoStack.length=0; }
for(const k of ['setSpec','loadPreset','loadBase','boxify','addPart','addPartJSON','updatePart','removePart','duplicatePart',
  'addPrimitive','updatePrimitive','removePrimitive','setPalette','setPaletteAll','setIris','setRig',
  'build','buildPart',
  'setBaseTransform','hideBaseMesh','showAllBase',
  'setZones','addZone','updateZone','removeZone','moveZone','rezone','zonesFromSelection',
  'importSculptSpec','importVox','importMesh',
  'upsertPart','addParts','mirrorPair','updatePrimitives']){
  const f=EditorAPI[k]; EditorAPI[k]=(...a)=>{ try{ pushUndo(); return wrap(f)(...a); }catch(e){ return err(e); } };
}
/* 兜底：未包装的命令也统一 try/catch */
for(const k of Object.keys(EditorAPI)){ if(typeof EditorAPI[k]==='function' && !['help','schema','state','getSpec','listParts','listPrimitives','listBaseMeshes','validate','render','exportJS','exportSpecJSON','undo','redo','batch','clearSelection','select','selectPart','selectBaseGroup','setMode','setSpace','camera','reference','version'].includes(k)){
    const f=EditorAPI[k]; EditorAPI[k]=(...a)=>{ try{ return f(...a); }catch(e){ return err(e); } }; } }
window.EditorAPI=EditorAPI;
// ★ 页面加载时恢复上次的流水线状态（对话上下文可丢，state 才是权威）
(function(){
  const ok = restorePipeline();
  if(ok){
    const st = PIPELINE.status();
    console.log('[editor] 流水线状态已恢复：'+st.progress.done+'/'+st.progress.total+' 步 · 当前遍 '+st.currentPass
      + ' · 循环 '+st.loops.total+'/'+st.loops.maxTotal + (st.status==='stopped'?'（硬停）':''));
  }
  // 存档里的「我是接管者」先挂起；跟服务端核对通过才恢复，否则清掉本地标记
  if(_agentPending){
    const pending = _agentPending;
    Store.getAgent().then(a=>{
      _agentPending = null;
      if(a.agent === pending && a.occupying){
        _agentSelf = pending; _lastPing = Date.now();
        console.log('[editor] 接管位已确认：'+pending);
      }else{
        console.log('[editor] 存档里的接管者（'+pending+'）和服务端不一致，已清除本地接管标记');
      }
      persistPipeline();
    }).catch(()=>{ _agentPending = null; });
  }
  if(pipeBody) setTimeout(renderPipelinePanel, 30);
})();
window.__ed = { THREE, scene, camera, controls, renderer, gizmo, spec:undefined,
  Q, XT, attachFace, sourceParts,
  PIPELINE, GATES, PASS_ORDER, COMPLEXITY_MINIMUMS, makeContract, checkContract,
  get BASELINE(){ return BASELINE_CANVAS; }, set BASELINE(v){ BASELINE_CANVAS=v; },
  get spec(){return spec;}, set spec(v){ spec=v; detachGizmo(); build(); renderAll(); },
  build, renderAll, renderPartList, exportCode, boxifySpec, lapplandSpec, templateSpec, PRESETS,
  get built(){return built;}, get meshes(){return MESHES;}, get selection(){return selection;}, get sel(){return sel;},
  setSelection, setMode, get mode(){return mode;}, stats,
  shot(){ renderer.render(scene,camera); return renderer.domElement.toDataURL('image/png'); } };
console.log('[editor] window.EditorAPI ready · v'+API_VERSION);
</script>

<script>
  setTimeout(function(){
    if(document.querySelector('canvas')) return;
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px/1.8 Arial,"Microsoft YaHei",sans-serif;text-align:center;padding:24px';
    d.innerHTML='<div><h2 style="letter-spacing:.12em;margin:0 0 10px">需要本地服务器</h2><p style="color:var(--dim);margin:0">请运行 <code style="color:var(--ok-ink2)">node tools/_serve.js</code> 后访问 <a style="color:var(--ok-ink2)" href="http://localhost:8765/character-editor.html">http://localhost:8765/character-editor.html</a></p></div>';
    document.body.appendChild(d);
  }, 6000);
</script>
