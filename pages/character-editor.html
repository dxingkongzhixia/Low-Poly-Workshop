<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>低模部件编辑器 · Lappland</title>
<style>
  /* 主题变量统一在 styles/shell.css（本页不再重复定义） */
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;font-size:12px}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #left{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--glass);
    border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
  #right{position:fixed;right:0;top:0;bottom:0;width:360px;background:var(--glass);
    border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
  .hd{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:800;letter-spacing:.08em;
    display:flex;justify-content:space-between;align-items:center;gap:6px}
  .hd small{font-weight:400;color:var(--dim);letter-spacing:0}
  .scroll{overflow:auto;flex:1;padding:10px}
  .sec{border:1px solid var(--line);border-radius:6px;margin-bottom:10px;overflow:hidden}
  .sec>h3{margin:0;padding:7px 9px;font-size:11.5px;background:var(--panel2);color:var(--accent);
    cursor:pointer;user-select:none;display:flex;justify-content:space-between}
  .sec>h3 span{color:var(--dim);font-weight:400}
  .sec.collapsed .body{display:none}
  .body{padding:9px;display:flex;flex-direction:column;gap:7px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .row label{color:var(--dim);white-space:nowrap;font-size:11.5px}
  input[type=number],input[type=text],select{background:var(--raise);color:var(--ink);
    border:1px solid var(--line);border-radius:3px;padding:3px 5px;font-size:11px;width:100%;box-sizing:border-box;font-family:inherit}
  input[type=range]{flex:1;accent-color:var(--accent);height:16px}
  input[type=color]{width:38px;height:20px;padding:0;border:1px solid var(--line);background:none;border-radius:3px;cursor:pointer;flex:none}
  input[type=checkbox]{accent-color:var(--green)}
  button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;
    padding:5px 7px;font-size:11.5px;cursor:pointer}
  button:hover{background:var(--hover);border-color:var(--accent)}
  button.pri{background:var(--ok-bg2);border-color:var(--ok-line)}
  button.danger{background:var(--danger-bg);border-color:var(--danger-line)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .btns input.sc-url{grid-column:1/-1;min-width:0;background:var(--bg2);color:inherit;border:1px solid var(--line);border-radius:4px;padding:4px 6px;font-size:11px}
  /* ---- 生成流水线面板 ---- */
  .pipe-info{font-size:11px;line-height:1.6;padding:5px 7px;background:var(--deep);border:1px solid var(--line);border-radius:4px;margin-bottom:5px}
  .pipe-info.over{border-color:var(--warn);color:var(--warn-ink)}
  .pipe-focus{font-size:10.5px;line-height:1.55;color:var(--dim);margin-bottom:5px}
  .pipe-cmd{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;line-height:1.5;background:var(--sunken);border:1px dashed var(--line2);
    border-radius:4px;padding:5px 7px;margin-bottom:5px;cursor:pointer;word-break:break-all;color:var(--info-ink)}
  .pipe-cmd:hover{border-color:var(--info);background:var(--info-bg)}
  .pipe-ev{font-size:10px;color:var(--gold2);margin-bottom:6px;line-height:1.5}
  .pipe-list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:4px;margin-bottom:6px}
  .pipe-grp{font-size:10px;font-weight:700;color:var(--mint);background:var(--chip-bg);padding:3px 7px;position:sticky;top:0}
  .pipe-grp.cur{color:var(--gold);background:var(--warn-bg)}
  .pipe-step{font-size:10.5px;padding:3px 7px 3px 14px;border-top:1px solid var(--line4);cursor:pointer;line-height:1.5}
  .pipe-step:hover{background:var(--bg2)}
  .pipe-step.done{color:var(--muted2);text-decoration:line-through}
  .pipe-step.skipped{color:var(--muted2)}
  .pipe-step.now{color:var(--gold);font-weight:700;background:var(--warn-bg)}
  .pipe-gates{font-size:10.5px;line-height:1.6;border:1px solid var(--line);border-radius:4px;padding:5px 7px}
  .pipe-gate{color:var(--dim)}
  .pipe-gate.over{color:var(--warn-ink2)}
  .plist{display:flex;flex-direction:column;gap:3px}
  .pitem{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid transparent;border-radius:4px;cursor:pointer}
  .pitem:hover{background:var(--row-hover)}
  .pitem.on{background:var(--hover2);border-color:var(--accent)}
  .pitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pitem .tri{color:var(--dim);font-size:10.5px}
  .pitem .cat{color:var(--dim);font-size:10px}
  .tag{display:inline-block;padding:0 4px;border-radius:3px;background:var(--raise);color:var(--dim);font-size:10px}
  .prim{border:1px solid var(--line);border-radius:5px;padding:6px;background:var(--row)}
  .prim.on{border-color:var(--green);box-shadow:0 0 0 1px var(--glow-green)}
  .prim .ph{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:6px}
  .prim .pc{display:none;flex-direction:column;gap:5px;margin-top:6px}
  .prim.on .pc{display:flex}
  .grid7{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .grid7 .f{display:flex;flex-direction:column;gap:1px}
  .grid7 .f span{color:var(--dim);font-size:9.5px}
  #hud{position:fixed;left:250px;top:10px;z-index:15;font-size:11px;color:var(--dim);
    background:var(--note);border:1px solid var(--line);border-radius:6px;padding:7px 9px;line-height:1.6;pointer-events:none}
  #toolbar{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:16;display:flex;gap:5px;
    background:var(--scrim);border:1px solid var(--line);border-radius:8px;padding:5px 6px;align-items:center}
  #toolbar button{padding:4px 9px}
  #toolbar button.on{background:var(--ok-bg2);border-color:var(--ok-line)}
  #toolbar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  #tip{position:fixed;left:250px;bottom:10px;z-index:15;font-size:11px;color:var(--dim);
    background:var(--note);border:1px solid var(--line);border-radius:6px;padding:6px 9px;line-height:1.6}
  #toast{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:60;background:var(--ok-bg2);
    border:1px solid var(--ok-line);color:var(--ok-ink);padding:7px 14px;border-radius:6px;opacity:0;transition:.25s}
  #toast.on{opacity:1}
  #api{position:fixed;right:370px;bottom:10px;z-index:15;font-size:10.5px;color:var(--green);
    background:var(--note);border:1px solid var(--ok-bg2);border-radius:6px;padding:4px 8px}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { Q, XT, KT, AT, Ft, It } from '../src/characters.orig.js';
import { attachFace } from '../src/characters.face.js';
import { parseVox, voxGreedy, fetchArrayBuffer, meshToBoxes, loadMeshBoxes, readBoxes, voxelizeMesh } from '../src/vox-import.js';
import { Pipeline, PASS_ORDER, COMPLEXITY_MINIMUMS, FEATURE_GROUPS, makeContract, checkContract,
         MAX_PER_PASS, MAX_TOTAL, PIPELINE_VERSION } from '../src/pipeline.js';
import * as GATES from '../src/quality-gates.js';
import { Store, gpuInfo, gpuAdvice } from '../src/characters.store.js';

/* ============================ 常量 ============================ */
const OPPOSITE = { armL:'armR', armR:'armL', legL:'legR', legR:'legL' };
const CATEGORIES = ['基础头型','基础手臂（含手）','基础身体','基础腿部','头发','身体装饰','手臂装饰',
  '腿部装饰','鞋子','兽耳','尾巴','额外装饰','武器／手持道具','服装装饰','隐藏杯子','隐藏纸箱','脖子'];
const PARENTS = [['body','身体'],['head','头'],['armL','左臂'],['armR','右臂'],
                 ['legL','左腿'],['legR','右腿'],['coatTails','后摆'],['tail','兽尾']];
const BUDGET = { total:2000, min:1600, parts:{ '基础头型':300,'基础手臂（含手）':100,'基础身体':60,
  '基础腿部':130,'头发':330,'身体装饰':100,'手臂装饰':100,'腿部装饰':100,'鞋子':50,'兽耳':30,
  '尾巴':80,'额外装饰':200,'武器／手持道具':200 } };
const BIG = 1e9;   // 分区规则里表示"不限"
/* 可用的低模角色（用于 base / boxify / reference） */
const LOW_CHARS = [['lappland','拉普兰德'],['texas','德克萨斯'],['exusiai','能天使'],['croissant','可颂'],
  ['sora','空'],['mostima','莫斯提马'],['chen','陈'],['hoshiguma','星熊'],['swire','诗怀雅'],
  ['emperor','大帝'],['lee','老鲤'],['aak','阿'],['hung','吽'],['waaifu','槐琥']];

/* ============================ 规格 ============================ */
function mkPalette(src){
  const kt = KT[src] || {};
  return { hair:kt.hair??0x2b2f36, hairShade:kt.shade??0x191c21, coat:kt.coat??0x2f3742,
    coatShade:0x1c2229, trim:kt.trim??0xe9edf3, eye:kt.eye??0xffffff, skin:0xf1d3bd, metal:0xb7bec6 };
}
/** 默认规格：原作拉普兰德（低模）作为基础模型 */
function lapplandSpec(){
  return {
    id:'lappland', name:'拉普兰德（低模）',
    mode:'base',
    base:{ source:'lappland', transforms:{}, hidden:[] },
    useOrigFace:false,
    iris: AT.lappland ? AT.lappland.slice() : [0xffffff,0xffffff,0xffffff],
    palette: mkPalette('lappland'),
    rig:{ bodyY:0, headY:1.47, headScale:[Ft[0],Ft[1],Ft[2]], armX:0.51, armY:1.05, legX:0.16, legY:0.73 },
    zones: defaultZones(),
    parts:[]
  };
}
/** 通用人体模板 —— 可以当「从零捏人」的起点。
 *
 *  ★ 坐标全部是**各组自己的局部空间**（不是世界坐标），数字来自实测拉普兰德：
 *      head 组 world=(0, 1.40, 0)   scale=[1.672, 1.540, 1.518]  ← 原作的大头技巧
 *        └ 头局部 1 单位 = 世界 1.67 / 1.54 / 1.52
 *        └ 头骨 skull 的局部范围：x ±0.305，y −0.200…0.285，z −0.268…0.235
 *      armL 组 world=(−0.360, 1.11, 0)    scale 1
 *      legL 组 world=(−0.160, 0.72, 0)    scale=[1, 0.85, 1]
 *      body 组 world=(0, 0, 0)            （parts 模式下 body 就在原点）
 *    ⚠ 老模板的坑：armX 写了 0.51（实测 0.36）→ 手臂往外支出 0.15；armY 写了 1.05（实测 1.11）。
 *
 *  ★ 头发由 **多个小模块** 拼成（主帽 / 刘海 / 侧发 / 后发 四个部件、20+ 个图元）。
 *    一个大方块糊上去就是头盔 —— 这条规则模板自己先遵守。
 */
function templateSpec(){
  const box=(x,y,z,w,h,d,color,rotZ,rotX)=>({kind:'box',x,y,z,w,h,d,color,rotZ:rotZ||0,rotX:rotX||0});
  // 刘海：一排长短不一的斜片，顺着额头弧度包过去
  //   ★ 三个要点（少一个就变成「贴在脸上的黑条」）：
  //     ① 片宽 > 片间距 → 相邻片在根部**交叠**，锯齿只出现在发梢，不会露额头
  //     ② 深度够大 + z 往后收一点 → 大部分嵌进额头里，只露出正面
  //     ③ 外侧片往回收 z、变短、向内倾 → 不飘到头轮廓外面
  const fringe=[]; {
    const n=7, HW=0.288, step = 2*HW/(n-1);
    for(let i=0;i<n;i++){
      const t = n===1?0.5 : i/(n-1);
      const x = -HW + 2*HW*t;
      const u = Math.abs(t-0.5)*2;                        // 0=正中间 1=最外侧
      const z = 0.204 - 0.62*x*x;                         // 跟着额头弧度往回收
      const len = (0.055 + 0.062*Math.abs(Math.sin(i*1.7+0.6))) * (1 - 0.34*u*u);
      fringe.push(box(x, 0.214-len/2, z, step*1.22, len, 0.132,
        'hair', -x*0.35, -0.06));
    }
  }
  // 后发：长短不一的下垂发束（实测原作长发垂到世界 y≈0.47）
  //   ★ 顶端必须**塞进后发板里**（后发板 z −0.267~−0.117 / y −0.160~0.310），否则侧视图会飘在空中
  const back=[]; {
    const n=5, W=0.430;
    for(let i=0;i<n;i++){
      const t=n===1?0.5:i/(n-1), x=-W/2+W*t;
      const len=0.430+0.150*Math.abs(Math.sin(i*1.1+0.3));
      back.push(box(x, 0.210-len/2, -0.238-Math.abs(t-0.5)*0.044, (W/n)*1.16, len, 0.092,
        (i%2?'hair':'hairShade')));
    }
  }
  // 手臂：armL 组在世界 y=1.11（不缩放）→ 局部 y = 世界 y − 1.11
  //   实测拉普兰德：大臂 0.244 宽 · 小臂 0.222 · 位置 y 0.864~1.118 / 0.664~0.874 / 手 0.548~0.671
  const armPr=()=>[
    // ★ 上臂顶端必须**伸进肩杠里**（肩杠 y 世界 ~1.20~1.38、x ±0.350）
    //   老版本上臂顶端只到 1.114，肩杠在 1.30~1.43 → y 不相交 → 手臂是**悬空**的
    box(0, 0.045,0,     0.232,0.400,0.250,'coat'),        // 大臂  世界 0.955~1.355
    box(0,-0.235,-0.010,0.212,0.215,0.255,'coatShade'),   // 小臂  世界 0.767~0.982
    box(0,-0.355,-0.010,0.236,0.056,0.272,'trim'),        // 袖口
    box(0,-0.455,0,     0.176,0.160,0.190,'skin'),        // 手    世界 0.575~0.735
  ];
  // 腿：legL 组在世界 y=0.72（**scale 1**，扁平 rig 格式设不了组缩放）→ 局部 y = 世界 y − 0.72
  //   实测：大腿 0.262 宽 · 小腿 0.242 · 脚 0.292×0.403
  //   ⚠ 大腿收窄到 0.235：不然手（armX 0.410）会横穿大腿 —— 穿插门会报出来
  const legPr=()=>[
    // ★ 大腿顶端要**伸进胯里**（胯 y 0.638~0.853）—— 否则双腿在剪影里是断开的两块
    box(0,-0.190,0.000,0.235,0.290,0.248,'coatShade'),    // 大腿  世界 0.385~0.675
    box(0,-0.428,0.005,0.224,0.328,0.240,'coat'),         // 小腿  世界 0.128~0.456
    box(0,-0.556,0.010,0.238,0.108,0.256,'coat'),         // 靴筒  世界 0.110~0.218
    box(0,-0.492,0.010,0.258,0.048,0.272,'trim'),         // 靴口亮边
    box(0,-0.632,0.045,0.250,0.172,0.390,'coatShade'),    // 脚    世界 0.002~0.174
    box(0,-0.700,0.052,0.262,0.036,0.404,'trim'),         // 鞋底  世界 0.000~0.036
  ];
  const s = {
    id:'myguy', name:'通用体型', mode:'parts',
    base:null, useOrigFace:true,
    iris:[0xf2a63c,0xffd27a,0xffffff],
    palette:{ skin:0xf2d8c2, skinShade:0xdcbaa1,
              hair:0x333b48, hairShade:0x232a34, hairLight:0x515e72,
              coat:0x46515f, coatShade:0x313a45, trim:0xeef2f7, metal:0xb7bec6 },
    rig:{ bodyY:0, headY:1.40, headScale:[Ft[0],Ft[1],Ft[2]], armX:0.410, armY:1.11, legX:0.185, legY:0.72 },
    zones: defaultZones(),
    parts:[
      { id:'torso', name:'躯干', category:'基础身体', parent:'body', metalness:0.05, primitives:[
        box(0,1.155,0.010,0.480,0.390,0.268,'coat'),          // 胸腔
        // ★ 肩杠要**够宽够厚**：宽度 ±0.350 才能和 armX 0.410 的手臂在 x 向相交；
        //   高度 1.200~1.380 才能和上臂顶端(1.355)在 y 向相交；**厚度 ±0.220** 才能挡住下巴
        //   （下巴前表面 z≈0.19，肩太薄就会在领口上方露出一块「像脖子」的皮肤）
        box(0,1.290,0.020,0.700,0.180,0.400,'coat'),          // 肩/领
        box(0,0.905,0.005,0.400,0.205,0.252,'coatShade'),     // 腰
        box(0,0.745,0.005,0.470,0.215,0.280,'coat'),          // 胯  0.638~0.853（大腿顶端 0.675 伸进来）
        box(0,1.115,0.140,0.070,0.460,0.030,'trim'),          // 前襟亮条
        box(0,0.865,0.014,0.412,0.055,0.288,'trim'),          // 腰带
        box(-0.255,1.110,0.112,0.090,0.135,0.050,'coatShade'),// 口袋
        box( 0.255,1.110,0.112,0.090,0.135,0.050,'coatShade'),
      ]},
      { id:'armL', name:'左臂', category:'基础手臂（含手）', parent:'armL', metalness:0.05, primitives:armPr() },
      { id:'armR', name:'右臂', category:'基础手臂（含手）', parent:'armR', metalness:0.05, primitives:armPr() },
      { id:'legL', name:'左腿', category:'基础腿部', parent:'legL', metalness:0.05, primitives:legPr() },
      { id:'legR', name:'右腿', category:'基础腿部', parent:'legR', metalness:0.05, primitives:legPr() },

      // ---- 头发：五个部件、20+ 个小模块（不是几块大方板）----
      //   主帽/侧发/后发板的尺寸直接沿用**原作实测**：
      //     头发主体 0.71×0.29×0.59 @(0,0.30,−0.055)   后发板 0.69×0.49×0.20 @(0,0.07,−0.24)
      //     侧发片   0.105×0.32×0.38/0.45 @(±0.322,0.105,−0.015/0.02)

    g[name] = o ? { p:o.position.toArray().map(v => +v.toFixed(4)),
                    r:[o.rotation.x, o.rotation.y, o.rotation.z].map(v => +v.toFixed(4)),
                    s:o.scale.toArray().map(v => +v.toFixed(4)) }

  }
  const e = g[name];
  for(const k of ['p','r']) if(!Array.isArray(e[k]) || e[k].length !== 3)

    put(a.g, a.abs ? -Math.abs(v) : v);

/** 通用几何体（kind:'geo'）：把「单位形状」按 w/h/d 烘进几何，用户在编辑器里再用 scl 缩放

function geoOf(pr){

  const seg2=Math.max(2, Math.min(64, p.seg2|0 || Math.max(6, Math.round(seg/2))));

    case 'sphere': case 'ellipsoid': g=new THREE.SphereGeometry(0.5, seg, seg2); break;
    case 'cylinder': g=new THREE.CylinderGeometry(0.5, 0.5, 1, seg, 1, !!p.open); break;
    case 'cone':     g=new THREE.ConeGeometry(0.5, 1, seg, 1, !!p.open); break;
    case 'capsule':  g=new THREE.CapsuleGeometry(0.5, 1, Math.min(20,seg2), seg); break;
    case 'torus':    g=new THREE.TorusGeometry(0.5, Math.max(0.01,Math.min(1,p.tube??0.3)), Math.min(32,seg2), Math.min(64,seg)); break;
    case 'lathe': {

      const pts=(p.points||[[-0.5,-0.5],[0.5,-0.5],[0.5,0.5],[-0.5,0.5]]).map(q=>new THREE.Vector2(q[0],q[1]));

function addPartMeshes(G, part, prims, parentKey, mirrored){
  const parent=G[parentKey]||G.body;
  prims.forEach((pr,i)=>{
    const key=keyOfPart(part.id,i,!!mirrored);
    const nm=part.name+(mirrored?' (镜像)':'');
    if(pr.kind==='op'){
      const mesh=buildOpMesh(pr, parent, part.metalness, mirrored, key, nm, part);
      if(mesh) MESHES.push({ mesh, key, part, primIndex:i, mirrored:!!mirrored, imported:false });
      return;
    }
    if(pr.kind==='geo'){
      const g=geoOf(mirrored? mirrorPrimitive(pr) : pr);
      tintGeometry(g, resolveColor(pr.color));
      const mesh=new THREE.Mesh(g, new THREE.MeshStandardMaterial({
        vertexColors:true, roughness: part.roughness??0.75, metalness: part.metalness??0.05,
        side: pr.shape==='extrude' ? THREE.DoubleSide : THREE.FrontSide }));

      const x = mirrored? -(pr.x||0) : (pr.x||0);

      mesh.rotation.set(mirrored? (pr.rotX||0) : (pr.rotX||0),
        mirrored? -(pr.rotY||0) : (pr.rotY||0),
        mirrored? -(pr.rotZ||0) : (pr.rotZ||0));
      mesh.scale.set(pr.sclX??1, pr.sclY??1, pr.sclZ??1);
      mesh.name=nm;
      parent.add(mesh);
      mesh.userData.__entry={ key };
      MESHES.push({ mesh, key, part, primIndex:i, mirrored:!!mirrored, imported:false });
      return;
    }
    const q=new Q(); const col=resolveColor(pr.color); let mesh=null;
    if(pr.kind==='box'){

      if(mesh){ mesh.position.set(pr.x,pr.y,pr.z); mesh.rotation.set(pr.rotX||0,pr.rotY||0,pr.rotZ||0); }
    }else{

      const local=pr.points.map(p=>[p[0]-c[0],p[1]-c[1]]);

      // 再由 mesh.position.z = pr.z 定位（旧代码传成了 shape(points, depth, 0)，会变成零厚度平面）
      q.shape(local, 0, pr.depth, col);

      mesh.name=part.name+(mirrored?' (镜像)':'');

}
function build(){
  clearBuilt();
  let G;
  if(spec.mode==='base' && spec.base && spec.base.source){
    baseModel = XT(spec.base.source);
    G = { root:baseModel.root, body:baseModel.body, head:baseModel.head,
          armL:baseModel.arms?.[0], armR:baseModel.arms?.[1],
          legL:baseModel.legs?.[0], legR:baseModel.legs?.[1],
          coatTails:baseModel.coatTails, tail:baseModel.tail };
    if(!spec.__rigMeasured){ spec.rig=measureRig(G); spec.__rigMeasured=true; }
    applyRig(G);
    registerBaseMeshes(G.root);

  }else{
    G = makeSkeleton();
    if(spec.useOrigFace) attachFace(G.head, { id:spec.id, iris:spec.iris });
    applyRig(G);
  }
  for(const part of spec.parts){
    addPartMeshes(G, part, part.primitives||[], part.parent, false);
    if(part.mirror) addPartMeshes(G, part, (part.primitives||[]).map(mirrorPrimitive), OPPOSITE[part.parent]||part.parent, true);

function applyBaseTransforms(){

/* ---------- 把原作模型「精确拆成可编辑图元」 ---------- */
function guessCategory(name){
  const n=(name||'').toLowerCase();
  if(/hair|fringe|locks|crown|刘海|发/.test(n)) return '头发';
  if(/(^|[-_])ear|ear[-_]|兽耳/.test(n)) return '兽耳';
  if(/boot|shoe|sole|ankle|鞋/.test(n)) return '鞋子';
  if(/knee|thigh|shin|legwear|(^|[-_])leg|腿/.test(n)) return '腿部装饰';
  if(/sleeve|(^|[-_])arm|hand|elbow|手臂/.test(n)) return '手臂装饰';
  if(/sword|blade|weapon|(^|[-_])gun|staff|武器/.test(n)) return '武器／手持道具';
  if(/chin|cheek|(^|[-_])head|face|skull|头/.test(n)) return '基础头型';
  if(/coat|jacket|(^|[-_])tail|cloth|dress|(^|[-_])body|torso/.test(n)) return '服装装饰';
  return '额外装饰';
}
function roleOfBase(m,o){
  for(let n=o;n&&n!==m.root;n=n.parent){
    if(n===m.head) return 'head';
    if(m.arms && n===m.arms[0]) return 'armL';
    if(m.arms && n===m.arms[1]) return 'armR';
    if(m.legs && n===m.legs[0]) return 'legL';
    if(m.legs && n===m.legs[1]) return 'legR';
    if(n===m.coatTails) return 'coatTails';
    if(n===m.tail) return 'tail';
  }
  return 'body';
}
function avgVertexColor(g){
  const c=g.getAttribute('color');
  if(!c) return 0xb7bec6;
  let r=0,gg=0,b=0; const n=Math.min(c.count,600);
  const step=Math.max(1,Math.floor(c.count/n));
  let k=0;
  for(let i=0;i<c.count;i+=step){ r+=c.getX(i); gg+=c.getY(i); b+=c.getZ(i); k++; }
  const col=new THREE.Color().setRGB(r/k, gg/k, b/k);
  return col.getHex();
}
/* ==================== 原作图元的精确拆分（不再退化成包围盒） ====================
 * 原作把「一个网格 = 若干净图元合并成的一个 BufferGeometry」，
 * 但同时在 geometry.userData.primitiveVertexCounts 里留下了每个图元占多少顶点。
 * 于是不需要任何几何启发式：照着这张表切，切出来的就是 100% 原始图元，
 * 圆弧倒角 / 斜切 / 任意多边形挤出（那些锯齿）全部原样保留。
 *
 * 每个图元抽出来后：
 *   · 顶点换算到「它所属父级组」的局部坐标（父级组的缩放留给运行时，和原作一致）
 *   · 整体平移到自身形心 → 形心存 center，几何以原点为中心（方便 gizmo 旋转/缩放）
 *   · 顶点色、法线逐顶点复制 → 外观与原作逐像素一致
 */
const SRC_CACHE=new Map();
function roleGroupOf(m, role){
  if(role==='head') return m.head;
  if(role==='armL') return m.arms?.[0]||m.body;
  if(role==='armR') return m.arms?.[1]||m.body;
  if(role==='legL') return m.legs?.[0]||m.body;
  if(role==='legR') return m.legs?.[1]||m.body;
  if(role==='coatTails') return m.coatTails||m.body;
  if(role==='tail') return m.tail||m.body;
  return m.body;
}
/** 角色 → { root, groups, meshes:[{name,role,cat,prims:[{pos,nor,col,center,size,tri,...}]}] }（按 id 缓存）*/
function sourceParts(source){
  const id=String(source);
  if(SRC_CACHE.has(id)) return SRC_CACHE.get(id);
  const m=XT(id);
  m.root.updateMatrixWorld(true);
  const groups={ body:m.body, head:m.head, armL:m.arms?.[0], armR:m.arms?.[1],
    legL:m.legs?.[0], legR:m.legs?.[1], coatTails:m.coatTails||null, tail:m.tail||null };
  const meshes=[];
  m.root.traverse(o=>{
    if(!o.isMesh || !o.geometry) return;
    const counts=o.geometry.userData && o.geometry.userData.primitiveVertexCounts;
    if(!counts || !counts.length) return;
    const cat=guessCategory(o.name);
    if(cat==='基础头型') return;                       // 头/脸由原作 attachFace 提供（保留表情）
    const role=roleOfBase(m,o);
    const target=roleGroupOf(m,role);
    target.updateWorldMatrix(true,false);
    // 祖先里只要有一层 visible=false，这个网格在原作里就是「默认隐藏件」，不该被翻出来
    let hidden=false; for(let n=o;n;n=n.parent) if(n.visible===false){ hidden=true; break; }
    const M=new THREE.Matrix4().copy(target.matrixWorld).invert().multiply(o.matrixWorld);
    const NM=new THREE.Matrix3().getNormalMatrix(M);
    const pa=o.geometry.getAttribute('position'), na=o.geometry.getAttribute('normal'),
          ca=o.geometry.getAttribute('color');
    if(!pa) return;
    const meshMetal=(o.material && typeof o.material.metalness==='number') ? o.material.metalness : 0.05;
    const meshRough=(o.material && typeof o.material.roughness==='number') ? o.material.roughness : 0.69;
    const p=new THREE.Vector3(), nv=new THREE.Vector3();
    let off=0; const prims=[];

      const cnt=counts[pi]; if(!cnt) continue;

      let cx=0,cy=0,cz=0;

        P[k*3]=p.x; P[k*3+1]=p.y; P[k*3+2]=p.z; cx+=p.x; cy+=p.y; cz+=p.z;
        if(na){ nv.set(na.getX(i),na.getY(i),na.getZ(i)).applyMatrix3(NM).normalize();
          N[k*3]=nv.x; N[k*3+1]=nv.y; N[k*3+2]=nv.z; }
        if(C){ C[k*3]=ca.getX(i); C[k*3+1]=ca.getY(i); C[k*3+2]=ca.getZ(i); }
      }
      cx/=cnt; cy/=cnt; cz/=cnt;
      for(let k=0;k<cnt;k++){ P[k*3]-=cx; P[k*3+1]-=cy; P[k*3+2]-=cz; }
      const bb=[1e9,1e9,1e9,-1e9,-1e9,-1e9];

  });

  SRC_CACHE.set(id,out);
  return out;
}
/** 第 t 个三角形的形心（父级组局部坐标）*/
function triCentroid(q, t){
  const P=q.pos, i=t*3;
  return { x:(P[i*3  ]+P[i*3+3]+P[i*3+6])/3 + q.center[0],
           y:(P[i*3+1]+P[i*3+4]+P[i*3+7])/3 + q.center[1],
           z:(P[i*3+2]+P[i*3+5]+P[i*3+8])/3 + q.center[2] };
}
/** 一组三角形的形心（父级组局部坐标）*/
function triSetCentroid(q, tris){
  const P=q.pos; let x=0,y=0,z=0,n=0;
  for(const t of tris){ const i=t*3;
    x+=P[i*3]+P[i*3+3]+P[i*3+6]; y+=P[i*3+1]+P[i*3+4]+P[i*3+7]; z+=P[i*3+2]+P[i*3+5]+P[i*3+8]; n+=3; }

/** 由 op 图元的规范生成 BufferGeometry（支持三角形子集 / 镜像 / 顶点色覆盖）*/
function opGeometry(pr, q, mirrored){
  const P=q.pos, N=q.nor, C=q.col;
  const idx=(Array.isArray(pr.tris) && pr.tris.length) ? pr.tris : null;
  const cx=(pr.x!=null?pr.x:q.center[0]), cy=(pr.y!=null?pr.y:q.center[1]), cz=(pr.z!=null?pr.z:q.center[2]);
  const O=[q.center[0]-cx, q.center[1]-cy, q.center[2]-cz];
  const nTri=idx?idx.length:q.tri, vc=nTri*3;
  const pos=new Float32Array(vc*3), nor=N?new Float32Array(vc*3):null, col=new Float32Array(vc*3);
  // color 支持 0xRRGGBB / '#RRGGBB' / 调色板键名（和 box/panel 一致）
  let rawC=pr.color;
  if(typeof rawC==='string' && spec && spec.palette && spec.palette[rawC]!=null) rawC=spec.palette[rawC];
  const flat=(rawC!=null) ? new THREE.Color(rawC) : null;
  const colAttr=C||flat;
  let w=0;
  for(let t=0;t<nTri;t++){
    const s=(idx?idx[t]:t)*3;
    const va=mirrored?[s,s+2,s+1]:[s,s+1,s+2];
    for(const i of va){

      if(flat){ const b=0.92+0.08*Math.max(0, (nor?nor[w*3+1]:1));

      else if(C){ col[w*3]=C[i*3]; col[w*3+1]=C[i*3+1]; col[w*3+2]=C[i*3+2]; }
      else { col[w*3]=col[w*3+1]=col[w*3+2]=1; }
      w++;
    }
  }

  g.setAttribute('position', new THREE.BufferAttribute(pos,3));

  return g;
}
/** 由 op 图元建一个可编辑网格 */
function buildOpMesh(pr, parent, metalness, mirrored, key, name, part){
  const sp=sourceParts(pr.src);
  const mref=sp.meshes[pr.mesh]; if(!mref) return null;
  const q=mref.prims[pr.prim]; if(!q) return null;
  const g=opGeometry(pr, q, !!mirrored);
  const mesh=new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    vertexColors:true, roughness:(pr.roughness!=null?pr.roughness:0.69),
    metalness:(pr.metalness!=null?pr.metalness:(metalness!=null?metalness:0.05)) }));
  mesh.castShadow=true; mesh.receiveShadow=true;
  const cx=(pr.x!=null?pr.x:q.center[0]), cy=(pr.y!=null?pr.y:q.center[1]), cz=(pr.z!=null?pr.z:q.center[2]);
  mesh.position.set(mirrored?-cx:cx, cy, cz);
  mesh.rotation.set(pr.rotX||0, mirrored?-(pr.rotY||0):(pr.rotY||0), mirrored?-(pr.rotZ||0):(pr.rotZ||0));
  mesh.scale.set(pr.sclX??1, pr.sclY??1, pr.sclZ??1);
  if(mirrored && mesh.scale.x>0) mesh.scale.x*=1;   // 镜像已烘进几何，保持正缩放
  parent.add(mesh);
  mesh.userData.__entry={ key };
  mesh.userData.__op={ src:pr.src, mesh:pr.mesh, prim:pr.prim };
  mesh.name=name;
  return mesh;
}

/* ============================ 分区规则（可编辑的 subLabel） ============================
 * 一条规则 = { enabled, label, role, cat, box:{x:[min,max],y:[min,max],z:[min,max]} }
 *   role：'any' 或 body/head/armL/armR/legL/legR/coatTails/tail
 *   cat ：'any' 或任意分类名
 *   box ：在「该部件父级组」的局部坐标里的轴对齐区域
 * 按顺序匹配，第一条命中的规则决定该图元归到哪个子部件。
 */
const BIG_UNUSED_REMOVED=0;
function zone(label, role, cat, x, y, z){

    box:{ x:x||[-BIG,BIG], y:y||[-BIG,BIG], z:z||[-BIG,BIG] }, planes:[] };
}
const AXES={ 'X轴':[1,0,0], 'Y轴':[0,1,0], 'Z轴':[0,0,1],
  '斜·左后':[-0.707,0,-0.707], '斜·右后':[0.707,0,-0.707], '斜·上后':[0,0.707,-0.707] };
function defaultZones(){

    zone('手','armR',null, null, [-BIG,-0.46]),

/** 用规则表判定某个图元（父级局部坐标 c）属于哪个子部件
 *  规则可含：box（轴对齐范围）+ planes（若干半空间 n·p ≷ d，全部满足才命中）*/
function subLabel(role, cat, c, zones){
  const list = (zones && zones.length) ? zones : (spec && spec.zones) || [];
  const inside=(b,v)=>!Array.isArray(b) || (v>=b[0] && v<=b[1]);
  const halfOK=(pl)=>{
    if(pl.enabled===false) return true;
    const n=pl.n||[1,0,0];
    const dot=n[0]*c.x + n[1]*c.y + n[2]*c.z;
    const d=pl.d||0;
    return (pl.side==='<=') ? (dot<=d) : (dot>=d);
  };
  for(const z of list){
    if(z.enabled===false) continue;
    if(z.role && z.role!=='any' && z.role!==role) continue;
    if(z.cat && z.cat!=='any' && z.cat!==cat) continue;
    const b=z.box||{};
    if(!inside(b.x,c.x) || !inside(b.y,c.y) || !inside(b.z,c.z)) continue;
    if(Array.isArray(z.planes) && z.planes.length && !z.planes.every(halfOK)) continue;
    return z.label;
  }
  return cat || '其他';
}
/** 平面半空间的取值（供 UI 显示/求交用）*/
function planeValue(pl, c){ const n=pl.n||[1,0,0]; return n[0]*c.x+n[1]*c.y+n[2]*c.z; }

/** 用 XT(source) 的精确图元生成「分子部件」规格。
 *  每个原始图元 = 一个可单独编辑的部件图元（kind:'op'，引用源角色 + 图元下标），
 *  形状 / 顶点色 / 法线逐顶点保留；再按分区规则把三角形分组到语义子部件。
 *  options: { zones, splitByZone=true, maxBoxes }  splitByZone=false 时整个图元不切开 */
function boxifySpec(source, { zones=null, splitByZone=true, maxBoxes=4000, includeHidden=false }={}){
  const zoneList = (zones && zones.length) ? zones : defaultZones();
  const src=sourceParts(source);
  const parts=new Map(); let total=0;
  const r4=v=>+v.toFixed(4);
  const push=(role, cat, label, q, tris, c1)=>{
    if(total>=maxBoxes) return;
    const pid=role+'__'+(label||cat||'其他');
    if(!parts.has(pid)) parts.set(pid,{ id:pid, name:(ROLE_CN[role]||role)+'·'+(label||cat||'其他'),
      category:cat, parent:role, metalness:0.0, primitives:[] });
    parts.get(pid).primitives.push({
      kind:'op', src:String(source), mesh:q.meshIndex, prim:q.primIndex,
      tris: tris||null, color:null, metalness:q.metalness, roughness:q.roughness,
      x:r4(c1[0]), y:r4(c1[1]), z:r4(c1[2]),
      rotX:0, rotY:0, rotZ:0, sclX:1, sclY:1, sclZ:1,
      _tri:(tris?tris.length:q.tri), _label:label||cat||'其他' });
    total++;
  };
  for(const mesh of src.meshes){
    if(mesh.hidden && !includeHidden) continue;      // 原作里被隐藏的件，默认不翻出来
    for(const q of mesh.prims){
      if(total>=maxBoxes) break;
      if(!splitByZone){
        const lab=subLabel(q.role, q.cat, {x:q.center[0],y:q.center[1],z:q.center[2]}, zoneList);
        push(q.role, q.cat, lab, q, null, q.center);
        continue;
      }
      // 按「每个三角形的形心」命中哪条规则来分组；每组仍是原始三角形 → 形状零损失
      const groups=new Map();
      for(let t=0;t<q.tri;t++){
        const lab=subLabel(q.role, q.cat, triCentroid(q,t), zoneList);
        let a=groups.get(lab); if(!a){ a=[]; groups.set(lab,a); } a.push(t);
      }
      if(groups.size<=1){
        const lab=groups.size ? [...groups.keys()][0] : (q.cat||'其他');
        push(q.role, q.cat, lab, q, null, q.center);
      }else{
        for(const [lab,tris] of groups) push(q.role, q.cat, lab, q, tris, triSetCentroid(q,tris));
      }
    }
  }
  const G=src.groups;
  const s={ id:String(source), name:(LOW_CHARS.find(c=>c[0]===source)?.[1]||source)+'（拆分版）',
    mode:'parts', base:null, useOrigFace:true,
    iris: AT[source]? AT[source].slice() : [0xffffff,0xffffff,0xffffff],
    palette: mkPalette(source),
    zones: JSON.parse(JSON.stringify(zoneList)),
    rig: measureRig({ body:G.body, head:G.head, armL:G.armL, armR:G.armR,
      legL:G.legL, legR:G.legR, coatTails:G.coatTails, tail:G.tail, root:src.model.root }),
    parts:[...parts.values()] };
  return s;
}

/* ============================ 切割面：3D 预览 + 实时切 ============================ */
let planeHelper=null, activePlane=null;      // activePlane = {zi, pi}
function hidePlaneHelper(){
  if(planeHelper){ const m=planeHelper.mesh;
    if(m.parent) m.parent.remove(m);
    m.geometry && m.geometry.dispose(); m.material && m.material.dispose();
    planeHelper=null; }
}
function showPlaneHelper(zi, pi){
  hidePlaneHelper();
  const z=(spec.zones||[])[zi]; if(!z || !z.planes || !z.planes[pi]) return;
  const pl=z.planes[pi];
  const G=built&&built.G; if(!G) return;
  const parentKey=(z.role && z.role!=='any') ? z.role : 'body';
  const parent=G[parentKey]||G.body; if(!parent) return;
  const n=new THREE.Vector3(...(pl.n||[1,0,0]));
  if(n.lengthSq()<1e-9) n.set(1,0,0);
  n.normalize();
  const size=2.4;
  const mesh=new THREE.Mesh(
    new THREE.PlaneGeometry(size,size),
    new THREE.MeshBasicMaterial({color:0x4fe07a, transparent:true, opacity:0.16, side:THREE.DoubleSide, depthWrite:false}));
  mesh.position.copy(n.clone().multiplyScalar(pl.d||0));
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), n);
  mesh.renderOrder=999;
  parent.add(mesh);
  planeHelper={ mesh, parentKey };
  activePlane={ zi, pi };
}
/** 拖动切割面时实时重新分区（节流） */
let rezoneTimer=null;
function rezoneLive(){
  if(rezoneTimer) clearTimeout(rezoneTimer);
  rezoneTimer=setTimeout(()=>{
    const keep=selection.slice();
    const r=rezone(); if(!r.ok) return;
    build(); renderPartList(); renderBudget();
    selection=keep.filter(k=>meshByKey(k));
    refreshGizmo();
  }, 90);
}
/** 用当前选区自动定一个切割面：法向=父级原点到选区中心，d 落在选区内侧 15% 处 */
function zonePlaneFromSelection(z){
  const es=selectedEntries().filter(e=>!e.imported);
  if(!es.length) return { ok:false, error:'先在视口里选中若干图元' };
  const parents=new Set(es.map(e=>e.part.parent));
  if(parents.size!==1) return { ok:false, error:'需要同一父级的选区（当前 '+parents.size+' 个）' };
  const parent=[...parents][0];
  if(!z.role || z.role==='any') z.role=parent;
  let cx=0,cy=0,cz=0,n=0;
  for(const e of es){ const pr=e.part.primitives[e.primIndex]; cx+=pr.x; cy+=pr.y; cz+=pr.z; n++; }
  cx/=n; cy/=n; cz/=n;
  let nx=cx, ny=cy, nz=cz; const L=Math.hypot(nx,ny,nz)||1; nx/=L; ny/=L; nz/=L;
  let mn=BIG, mx=-BIG;
  for(const e of es){ const pr=e.part.primitives[e.primIndex];
    const v=nx*pr.x+ny*pr.y+nz*pr.z; if(v<mn)mn=v; if(v>mx)mx=v; }
  const d=mn-0.005;                       // 让选区整体落在 >= 一侧，向内拖滑块即可切
  (z.planes=z.planes||[]).push({ enabled:true, n:[+nx.toFixed(3),+ny.toFixed(3),+nz.toFixed(3)],
    d:+d.toFixed(3), side:'>=' });
  return { ok:true, plane:z.planes[z.planes.length-1], parent };
}
/* 用「图元位置」快照 / 还原选择（rezone 会改部件 id 与索引，key 不再稳定） */
function snapshotPrimPositions(){
  return selectedEntries().filter(e=>!e.imported)
    .map(e=>{ const pr=e.part.primitives[e.primIndex]; return { x:pr.x, y:pr.y, z:pr.z }; });
}
function selectByPositions(list){
  if(!list || !list.length){ return []; }
  const keys=[];
  for(const w of list){
    const e=MESHES.find(m=>{
      if(!m.part) return false;
      const pr=m.part.primitives[m.primIndex]; if(!pr) return false;
      return Math.abs(pr.x-w.x)<1e-4 && Math.abs(pr.y-w.y)<1e-4 && Math.abs(pr.z-w.z)<1e-4;
    });
    if(e) keys.push(e.key);
  }
  return keys;
}

/* ============================ 重新分区 / 从选中创建规则 ============================ */
/** 按当前分区规则「重新归类 / 重新切分」。
 *  · op 图元：回到源图元的原始三角形，按每个三角形的形心重新分组
 *    → 所以拖动「切割面」能真正切开（和 boxify 的行为一致）；
 *    同时用 delta 还原你在编辑器里对该图元做过的位移/旋转/缩放。
 *  · box/panel 图元：按中心判标签（原有逻辑）。 */
function rezone(){
  if(!spec.parts || !spec.parts.length) return { ok:false, error:'当前没有可重新分区的图元' };
  const map=new Map(), r4=v=>+v.toFixed(4);
  const put=(parent,cat,lab,pr)=>{
    const pid=parent+'__'+(lab||cat||'其他');
    if(!map.has(pid)) map.set(pid,{ id:pid, name:(ROLE_CN[parent]||parent)+'·'+(lab||cat||'其他'),
      category:cat, parent, metalness:0.0, primitives:[] });
    map.get(pid).primitives.push(pr);
  };
  let ownSeq=0;
  const owners=new Map();          // 'mesh:prim' → [{ownerId,pr,q,whole,set,parent}]
  for(const part of spec.parts){
    for(const pr of part.primitives){
      if(pr.kind!=='op'){                    // 手作图元：按中心归类
        put(part.parent, part.category,
          subLabel(part.parent, part.category, {x:pr.x,y:pr.y,z:pr.z}, spec.zones), pr);
        continue;
      }
      const sp=sourceParts(pr.src), mref=sp.meshes[pr.mesh], q=mref&&mref.prims[pr.prim];
      if(!q){ continue; }                    // 源图元不存在（理论上 validate 会报）
      const hasTris=Array.isArray(pr.tris)&&pr.tris.length;
      const k=pr.mesh+':'+pr.prim;
      if(!owners.has(k)) owners.set(k,[]);
      owners.get(k).push({ ownerId:++ownSeq, pr, q, whole:!hasTris,
        set: hasTris ? new Set(pr.tris) : null, parent:part.parent, cat:part.category });
    }
  }
  for(const list of owners.values()){
    const q=list[0].q, cat=list[0].cat, parent=list[0].parent;
    const groups=new Map();
    for(let t=0;t<q.tri;t++){
      const ow=list.find(o=>o.whole || (o.set && o.set.has(t)));
      if(!ow) continue;                      // 这个三角形被删掉了
      const lab=subLabel(parent, cat, triCentroid(q,t), spec.zones);
      const gk=lab+'|'+ow.ownerId;
      let g=groups.get(gk); if(!g){ g={lab, ow, tris:[]}; groups.set(gk,g); }
      g.tris.push(t);
    }
    for(const g of groups.values()){
      const ow=g.ow, o=ow.pr;
      const c0=(Array.isArray(o.tris)&&o.tris.length)?triSetCentroid(q,o.tris):q.center;  // 图元原来在哪儿
      const dx=(o.x??c0[0])-c0[0], dy=(o.y??c0[1])-c0[1], dz=(o.z??c0[2])-c0[2];        // 用户把它移了多远
      const whole=(g.tris.length===q.tri);
      const c1=whole ? q.center : triSetCentroid(q,g.tris);
      const pr=Object.assign({}, o, {
        tris: whole ? null : g.tris.slice(),
        x:r4(c1[0]+dx), y:r4(c1[1]+dy), z:r4(c1[2]+dz),
        _tri: g.tris.length, _label: g.lab });
      put(parent, cat, g.lab, pr);
    }
  }
  spec.parts=[...map.values()];
  return { ok:true, parts:spec.parts.length,
    primitives:spec.parts.reduce((a,p)=>a+p.primitives.length,0) };
}
/** 用当前选中的图元生成一条分区规则（取它们中心的包围盒） */
function zoneFromSelection(name){
  const es=selectedEntries().filter(e=>!e.imported);
  if(!es.length) return { ok:false, error:'先在视口里选中若干图元' };
  const parents=new Set(es.map(e=>e.part.parent));
  if(parents.size!==1) return { ok:false, error:'选中的图元必须属于同一父级（当前 '+parents.size+' 个：'+[...parents].join(', ')+'）' };
  const parent=[...parents][0];
  const cats=new Set(es.map(e=>e.part.category));
  let mnx=BIG,mny=BIG,mnz=BIG,mxx=-BIG,mxy=-BIG,mxz=-BIG;
  for(const e of es){ const pr=e.part.primitives[e.primIndex];
    mnx=Math.min(mnx,pr.x); mxx=Math.max(mxx,pr.x);
    mny=Math.min(mny,pr.y); mxy=Math.max(mxy,pr.y);
    mnz=Math.min(mnz,pr.z); mxz=Math.max(mxz,pr.z); }
  const pad=0.02, r3=v=>+v.toFixed(3);
  const z={ enabled:true, label:name||'自定义分区', role:parent,
    cat: cats.size===1 ? [...cats][0] : 'any',
    box:{ x:[r3(mnx-pad),r3(mxx+pad)], y:[r3(mny-pad),r3(mxy+pad)], z:[r3(mnz-pad),r3(mxz+pad)] },
    planes:[] };
  (spec.zones=spec.zones||[]).unshift(z);   // 插到最前：优先匹配
  return { ok:true, zone:z, selected:es.length };
}

function setSelection(keys, additive){
  if(additive){ for(const k of keys){ const i=selection.indexOf(k); if(i>=0) selection.splice(i,1); else selection.push(k); } }
  else selection=keys.slice();
  refreshGizmo(); renderPartList(); renderSel();
}
function refreshGizmo(){
  const es=selectedEntries();
  gizmo.detach(); pivot=null; multiBase=null; sel=null;
  if(!es.length){ highlightAll(); updateSelLabel(); return; }
  if(es.length===1){
    sel={ entry:es[0], part:es[0].part, primIndex:es[0].primIndex, mirrored:es[0].mirrored,
          imported:es[0].imported, mesh:es[0].mesh, key:es[0].key };
    if(mode!=='select'){ gizmo.attach(es[0].mesh); applyMode(); }
    captureSingleBase();
  }else{
    if(!pivot){ pivot=new THREE.Object3D(); scene.add(pivot); }
    const c=new THREE.Vector3();
    es.forEach(e=>c.add(e.mesh.getWorldPosition(new THREE.Vector3())));
    c.multiplyScalar(1/es.length);
    pivot.position.copy(c); pivot.quaternion.identity(); pivot.scale.set(1,1,1); pivot.updateMatrixWorld(true);
    sel={ multi:true, entries:es };
    if(mode!=='select'){ gizmo.attach(pivot); applyMode(); }
    captureMultiBase();
  }
  highlightAll(); updateSelLabel();
}
function detachGizmo(){ selection=[]; refreshGizmo(); renderPartList(); renderSel(); }
function captureSingleBase(){
  if(!sel||sel.multi) return;
  const pr = sel.imported ? null : sel.part.primitives[sel.primIndex];
  sel.base={ pos:sel.mesh.position.clone(), rot:sel.mesh.rotation.z, rotE:sel.mesh.rotation.clone(),
    scale:sel.mesh.scale.clone(),
    points: pr&&pr.kind==='panel' ? pr.points.map(p=>[p[0],p[1]]) : null,
    centroid: pr&&pr.kind==='panel' ? polyCentroid(pr.points) : null,
    w: pr?pr.w:0, h: pr?pr.h:0, d: pr?pr.d:0, depth: pr?pr.depth:0, z: pr?pr.z:0 };
}
function captureMultiBase(){
  const es=selectedEntries();
  multiBase={ pivotPos:pivot.position.clone(), pivotQuat:pivot.quaternion.clone(),
    items: es.map(e=>{ const pr=e.imported?null:e.part.primitives[e.primIndex];
      return { e, pr, imported:e.imported, key:e.key,
        worldPos:e.mesh.getWorldPosition(new THREE.Vector3()),
        pos:e.mesh.position.clone(), quat:e.mesh.quaternion.clone(),
        w:pr?pr.w:0,h:pr?pr.h:0,d:pr?pr.d:0,depth:pr?pr.depth:0,
        points: pr&&pr.kind==='panel' ? pr.points.map(p=>[p[0],p[1]]) : null };
    })};
}
function commit(){
  const keep=selection.slice();
  if(sel && sel.multi) commitMulti(); else commitSingle();
  build();
  selection=keep.filter(k=>meshByKey(k));
  refreshGizmo(); renderSel(); renderBudget();
}
function commitSingle(){
  if(!sel||sel.multi) return;
  const b=sel.base, pos=sel.mesh.position, sc=sel.mesh.scale, rotE=sel.mesh.rotation, rot=rotE.z;
  if(sel.imported){
    const t=(spec.base.transforms[sel.key] ||= {});
    const p=[pos.x,pos.y,pos.z], r=[rotE.x,rotE.y,rotE.z], s=[sc.x,sc.y,sc.z];
    if(r.every(v=>Math.abs(v)<1e-6)) delete t.r; else t.r=r.map(v=>+v.toFixed(4));
    if(s.every(v=>Math.abs(v-1)<1e-6)) delete t.s; else t.s=s.map(v=>+v.toFixed(4));
    if(p.every(v=>Math.abs(v)<1e-6)) delete t.p; else t.p=p.map(v=>+v.toFixed(4));
    if(!Object.keys(t).length) delete spec.base.transforms[sel.key];
    return;
  }
  const pr=sel.part.primitives[sel.primIndex]; if(!pr||!b) return;
  if(pr.kind==='box'){
    let x=pos.x, rx=rotE.x, ry=rotE.y, rz=rotE.z;
    if(sel.mirrored){ x=-x; rx=-rx; ry=-ry; rz=-rz; }
    pr.x=+x.toFixed(4); pr.y=+pos.y.toFixed(4); pr.z=+pos.z.toFixed(4);
    pr.rotX=+rx.toFixed(4); pr.rotY=+ry.toFixed(4); pr.rotZ=+rz.toFixed(4);
    pr.w=+(b.w*Math.abs(sc.x)).toFixed(4); pr.h=+(b.h*Math.abs(sc.y)).toFixed(4); pr.d=+(b.d*Math.abs(sc.z)).toFixed(4);
  }else{
    const c=b.centroid;
    let pts=b.points.map(p=>[p[0],p[1]]);
    const dx=(pos.x-b.pos.x)*(sel.mirrored?-1:1), dy=pos.y-b.pos.y;
    pts=pts.map(p=>[p[0]+dx,p[1]+dy]);
    const th=rot-b.rot;
    if(Math.abs(th)>1e-6){ const cs=Math.cos(th), sn=Math.sin(th);
      pts=pts.map(p=>{ const X=p[0]-c[0],Y=p[1]-c[1]; return [c[0]+X*cs-Y*sn, c[1]+X*sn+Y*cs]; }); }
    const sx=Math.abs(sc.x), sy=Math.abs(sc.y), sz=Math.abs(sc.z);
    pts=pts.map(p=>[c[0]+(p[0]-c[0])*sx, c[1]+(p[1]-c[1])*sy]);
    if(sel.mirrored) pts=pts.map(p=>[-p[0],p[1]]).reverse();
    pr.points=pts.map(p=>[+p[0].toFixed(4),+p[1].toFixed(4)]);
    pr.depth=+(b.depth*sz).toFixed(4); pr.z=+(b.z+pos.z-b.pos.z).toFixed(4);
  }
}
function commitMulti(){
  const b=multiBase; if(!b||!b.items.length) return;
  const curPos=pivot.position, sc=pivot.scale;
  const dq=pivot.quaternion.clone().multiply(b.pivotQuat.clone().invert());
  const isTranslate=(mode==='translate');
  const sameParent = b.items.every(it=>it.e.mesh.parent===b.items[0].e.mesh.parent) && b.items.every(it=>!it.e.mirrored);
  const deltaWorld=curPos.clone().sub(b.pivotPos);
  const doRotScale = sameParent && !isTranslate;
  let parent=null,pq=null,dqLocal=null,pLocalBase=null,pLocalCur=null;
  if(doRotScale){ parent=b.items[0].e.mesh.parent;
    pq=parent.getWorldQuaternion(new THREE.Quaternion());
    dqLocal=pq.clone().invert().multiply(dq).multiply(pq);
    pLocalBase=parent.worldToLocal(b.pivotPos.clone());
    pLocalCur=parent.worldToLocal(curPos.clone()); }
  for(const it of b.items){
    const e=it.e, p=e.mesh.parent;
    if(!doRotScale){
      const w=it.worldPos.clone().add(deltaWorld);
      const l=p.worldToLocal(w.clone());
      if(it.imported){ const t=(spec.base.transforms[it.key] ||= {});
        t.p=[+l.x.toFixed(4),+l.y.toFixed(4),+l.z.toFixed(4)]; continue; }
      const pr=it.pr; let x=l.x; if(e.mirrored) x=-x;
      pr.x=+x.toFixed(4); pr.y=+l.y.toFixed(4); pr.z=+l.z.toFixed(4);
      continue;
    }
    const rel=new THREE.Vector3(it.pos.x-pLocalBase.x, it.pos.y-pLocalBase.y, it.pos.z-pLocalBase.z);
    rel.multiply(sc); rel.applyQuaternion(dqLocal);
    const np=pLocalCur.clone().add(rel);
    if(it.imported){ const t=(spec.base.transforms[it.key] ||= {});
      t.p=[+np.x.toFixed(4),+np.y.toFixed(4),+np.z.toFixed(4)];
      const nq=dqLocal.clone().multiply(it.quat); const eu=new THREE.Euler().setFromQuaternion(nq,'XYZ');
      t.r=[+eu.x.toFixed(4),+eu.y.toFixed(4),+eu.z.toFixed(4)];
      t.s=[+Math.abs(sc.x).toFixed(4),+Math.abs(sc.y).toFixed(4),+Math.abs(sc.z).toFixed(4)];
      continue; }
    const pr=it.pr;
    pr.x=+np.x.toFixed(4); pr.y=+np.y.toFixed(4); pr.z=+np.z.toFixed(4);
    if(pr.kind==='box'){
      const nq=dqLocal.clone().multiply(it.quat); const eu=new THREE.Euler().setFromQuaternion(nq,'XYZ');
      pr.rotX=+eu.x.toFixed(4); pr.rotY=+eu.y.toFixed(4); pr.rotZ=+eu.z.toFixed(4);
      pr.w=+(it.w*Math.abs(sc.x)).toFixed(4); pr.h=+(it.h*Math.abs(sc.y)).toFixed(4); pr.d=+(it.d*Math.abs(sc.z)).toFixed(4);
    }else{
      const pts=it.points.map(q=>{ const v=new THREE.Vector3(q[0]-pLocalBase.x,q[1]-pLocalBase.y,0);
        v.multiply(sc); v.applyQuaternion(dqLocal); return [pLocalCur.x+v.x, pLocalCur.y+v.y]; });
      pr.points=pts.map(q=>[+q[0].toFixed(4),+q[1].toFixed(4)]);
      pr.depth=+(it.depth*Math.abs(sc.z)).toFixed(4);
    }
  }
}

let down=null, boxEl=null, boxStart=null;
addEventListener('pointerdown', e=>{
  if(e.button!==0 || e.target!==renderer.domElement) return;
  if(e.shiftKey){
    controls.enabled=false; e.stopPropagation();
    boxStart={x:e.clientX,y:e.clientY};
    boxEl=document.createElement('div');
    boxEl.style.cssText='position:fixed;border:1px solid var(--green);background:var(--glow-green-soft);pointer-events:none;z-index:40';
    boxEl.style.left=boxStart.x+'px'; boxEl.style.top=boxStart.y+'px';
    document.body.appendChild(boxEl); return;
  }
  down={x:e.clientX,y:e.clientY,ctrl:e.ctrlKey||e.metaKey};
}, true);
addEventListener('pointermove', e=>{
  if(!boxEl||!boxStart) return;
  const x=Math.min(boxStart.x,e.clientX), y=Math.min(boxStart.y,e.clientY);
  boxEl.style.left=x+'px'; boxEl.style.top=y+'px';
  boxEl.style.width=Math.abs(e.clientX-boxStart.x)+'px';
  boxEl.style.height=Math.abs(e.clientY-boxStart.y)+'px';
});
addEventListener('pointerup', e=>{
  if(boxEl&&boxStart){
    const x1=Math.min(boxStart.x,e.clientX),y1=Math.min(boxStart.y,e.clientY);
    const x2=Math.max(boxStart.x,e.clientX),y2=Math.max(boxStart.y,e.clientY);
    boxEl.remove(); boxEl=null; boxStart=null; controls.enabled=true;
    if(x2-x1>4||y2-y1>4){
      const keys=[];
      for(const m of MESHES){
        const p=m.mesh.getWorldPosition(new THREE.Vector3()).project(camera);
        if(p.z>1) continue;
        const sx=(p.x*.5+.5)*innerWidth, sy=(-p.y*.5+.5)*innerHeight;
        if(sx>=x1&&sx<=x2&&sy>=y1&&sy<=y2) keys.push(m.key);
      }
      setSelection(keys, e.ctrlKey||e.metaKey);
    }
    return;
  }
  if(!down) return;
  const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);
  const add=down.ctrl; down=null;
  if(moved>5 || gizmo.dragging) return;
  const r=renderer.domElement.getBoundingClientRect();
  const ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(ndc,camera);
  const hits=raycaster.intersectObjects(MESHES.map(x=>x.mesh), false);
  if(!hits.length){ if(!add) setSelection([], false); return; }
  const entry=MESHES.find(x=>x.mesh===hits[0].object);
  if(entry) setSelection([entry.key], add);
});

const rscroll=document.getElementById('rscroll');
const plistEl=document.getElementById('plist');
let selectedId=null;
/* ============================================================================
 * 精细构造 DSL —— 给「参照图 / 提示词」改造角色用
 * ----------------------------------------------------------------------------
 * 一个部件只给一个大方块是最常见的失败模式。这里提供 4 个正交算子，
 * 把「一束头发 / 一条马尾 / 一只兽耳 / 一条尾巴」展开成几十个小图元，
 * 拼出参考图的轮廓与走向；生成结果就是普通 box / panel，之后可逐个再改。
 *
 *   sweep   沿折线扫掠一串渐变小盒（发束 / 马尾 / 尾巴 / 绳子 / 绑带）
 *   row     沿直线等距排列（刘海锯齿 / 链条 / 齿 / 铆钉）
 *   cluster 在盒范围内撒小盒（蓬松头发 / 毛簇 / 碎发）
 *   plate   多边形挤出薄片（衣襟 / 饰片 / 缎带）
 * ========================================================================== */
function rngOf(seed){ let a=(seed>>>0)||1; return ()=>{ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const lerpN=(a,b,t)=>a+(b-a)*t;
function profileAt(p, t){                       // p: [w,h,d] | [[w,h,d],[w,h,d]] | [[..],..,N]
  if(!Array.isArray(p) || !Array.isArray(p[0])) return p;
  const n=p.length; if(n===1) return p[0];
  const x=t*(n-1), i=Math.min(n-2, Math.floor(x)), f=x-i;
  const a=p[i], b=p[i+1];
  return [lerpN(a[0],b[0],f), lerpN(a[1],b[1],f), lerpN(a[2],b[2],f)];
}
/** Catmull-Rom 采样：返回 { pos:[Vector3], tan:[Vector3] } */
function samplePath(pts, count){
  const v=(pts||[]).map(p=>new THREE.Vector3(p[0],p[1],p[2]));
  if(v.length<2) throw new Error('sweep 至少需要 path 两个点');
  const c=new THREE.CatmullRomCurve3(v, false, 'catmullrom', 0.5);
  const pos=[], tan=[];
  for(let i=0;i<count;i++){ const t=count===1?0:i/(count-1);
    pos.push(c.getPoint(t)); tan.push(c.getTangent(t).normalize()); }
  return { pos, tan };
}
function opSweep(o){
  const count=Math.max(2, Math.min(300, o.count|0 || 10));
  const s=samplePath(o.path, count);
  const over=(o.overlap==null?1.12:o.overlap);
  const base=o.rot||[0,0,0];
  const wob=o.wobble||0;                                  // 横向正弦抖动（做块状链条感）
  const wobA=Array.isArray(wob)?wob[0]:wob, wobF=Array.isArray(wob)?wob[1]:1.5;
  // 逐块尺寸变化：sizeJitter 随机参差 / sizeWave 平滑起伏（参考图的方块大小不统一）
  const jit=o.sizeJitter||0;
  const wave=o.sizeWave||0;
  const rnd=rngOf(o.seed!=null ? o.seed : 20240929);
  const out=[];
  for(let i=0;i<count;i++){
    const t=count===1?0:i/(count-1);
    let sz=profileAt(o.profile||[0.1,0.1,0.1], t).slice();
    let m=1;
    if(wave){ const amp=Array.isArray(wave)?wave[0]:wave, fr=Array.isArray(wave)?wave[1]:1.7;
      m*=1+amp*Math.sin(i*fr); }
    if(jit){ const lo=Array.isArray(jit)?jit[0]:1-jit, hi=Array.isArray(jit)?jit[1]:1+jit;
      m*=lo+(hi-lo)*rnd(); }
    sz=[sz[0]*m, sz[1]*m, sz[2]*m];
    let rot=[base[0],base[1],base[2]];
    if(o.align!==false){
      const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), s.tan[i]);
      const e=new THREE.Euler().setFromQuaternion(q,'XYZ');
      rot=[e.x+base[0], e.y+base[1], e.z+base[2]];
    }
    const p=s.pos[i];
    let px=p.x, py=p.y, pz=p.z;
    if(wobA){
      const side=new THREE.Vector3().crossVectors(s.tan[i], new THREE.Vector3(0,0,1));
      if(side.lengthSq()<1e-8) side.set(1,0,0); else side.normalize();
      const off=Math.sin(i*wobF)*wobA;
      px+=side.x*off; py+=side.y*off; pz+=side.z*off;
    }
    out.push({ kind:'box', x:px, y:py, z:pz,
      w:sz[0]*over, h:sz[1]*over, d:sz[2]*over,
      color:o.color??'hair', rotX:rot[0], rotY:rot[1], rotZ:rot[2] });
  }
  return out;
}
function opRow(o){
  const count=Math.max(1, Math.min(240, o.count|0 || 4));
  const A=o.from||[0,0,0], B=o.to||[0,0,0];
  const s0=profileAt(o.size||[0.1,0.1,0.1], 0), s1=profileAt(o.sizeTo||o.size||[0.1,0.1,0.1], 1);
  const r0=o.rot||[0,0,0], rs=o.rotStep||[0,0,0];
  const out=[];
  for(let i=0;i<count;i++){
    const t=count===1?0.5:i/(count-1);
    out.push({ kind:'box',
      x:lerpN(A[0],B[0],t), y:lerpN(A[1],B[1],t), z:lerpN(A[2],B[2],t),
      w:lerpN(s0[0],s1[0],t), h:lerpN(s0[1],s1[1],t), d:lerpN(s0[2],s1[2],t),
      color:o.color??'trim',
      rotX:r0[0]+rs[0]*i, rotY:r0[1]+rs[1]*i, rotZ:r0[2]+rs[2]*i });
  }
  return out;
}
function opCluster(o, rnd){
  const bx=o.box||{ c:[0,0,0], s:[0.4,0.4,0.4] };
  const c=bx.c||[0,0,0], s=bx.s||[0.4,0.4,0.4];
  const count=Math.max(1, Math.min(240, o.count|0 || 12));
  const rng=o.seed!=null? rngOf(o.seed) : rnd;
  const szr=o.size||[0.05,0.12];                 // [min,max] 或 [[min..],[max..]]
  const lo=Array.isArray(szr[0])?szr[0]:[szr[0],szr[0],szr[0]];
  const hi=Array.isArray(szr[0])?szr[1]:[szr[1],szr[1],szr[1]];
  const rotr=o.rotRand||0;
  const out=[];
  for(let i=0;i<count;i++){
    out.push({ kind:'box',
      x:c[0]+(rng()-0.5)*s[0], y:c[1]+(rng()-0.5)*s[1], z:c[2]+(rng()-0.5)*s[2],
      w:lerpN(lo[0],hi[0],rng()), h:lerpN(lo[1],hi[1],rng()), d:lerpN(lo[2],hi[2],rng()),
      color:o.color??'hair',
      rotX:rotr?(rng()-0.5)*rotr:0, rotY:rotr?(rng()-0.5)*rotr:0, rotZ:rotr?(rng()-0.5)*rotr:0 });
  }
  return out;
}
/** 把算子表展开成 box/panel 图元（opts: { seed, mirror }） */
function expandOps(ops, opts={}){
  const rnd=rngOf(opts.seed??1);
  let out=[];
  for(const o of ops||[]){
    if(!o||!o.op) continue;
    if(o.op==='sweep') out=out.concat(opSweep(o));
    else if(o.op==='row') out=out.concat(opRow(o));
    else if(o.op==='cluster') out=out.concat(opCluster(o, rnd));
    else if(o.op==='plate') out.push({ kind:'panel', points:o.points, depth:o.depth??0.03, z:o.z??0, color:o.color??'trim' });
    else if(o.op==='box'){ const q=Object.assign({}, o); delete q.op; out.push(q); }
    else throw new Error('未知算子: '+o.op+'（可用 sweep / row / cluster / plate / box）');
  }
  if(opts.mirror) out=out.concat(out.map(mirrorPrimitive));
  return out.map(normPrim);
}

/** 部件「精细度」下限：低于它就提示拆细（只对真正需要体积感的部位要求）*/
const DETAIL_MIN={ '头发':5, '兽耳':3, '尾巴':3 };
/** 展开算子表并做校验（失败不留痕）*/
function expandChecked(ops, opts={}){
  try{
    const list=expandOps(ops, { seed:opts.seed, mirror:!!opts.mirror });
    if(!list.length) return { ok:false, error:'这批算子没有产出任何图元' };
    return { ok:true, list: opts.color ? list.map(q=>(q.color==null? Object.assign({},q,{color:opts.color}) : q)) : list };
  }catch(e){ return { ok:false, error:String((e&&e.message)||e) }; }
}
/** 把算子表展开并追加到部件（opts: { seed, mirror, color, build }）*/
function buildInto(part, ops, opts={}){
  const r=expandChecked(ops, opts); if(!r.ok) return err(r.error);
  part.primitives.push(...r.list);
  if(opts.build!==false){ build(); renderAll(); renderPartList(); }
  return ok({ part:part.id, added:r.list.length, totalPrimitives:part.primitives.length,
    triangles:partTriangles(part) });
}
/** 部件「精细度」是否达标；只对「手工图元」要求，boxify 出来的原作图元不在此列 */
function manualPrims(p){ return (p.primitives||[]).filter(q=>q.kind==='box'||q.kind==='panel'); }

function section(title,hint,open,fn){
  const sec=document.createElement('div'); sec.className='sec'+(open?'':' collapsed');
  const h=document.createElement('h3'); h.innerHTML=`${title}<span>${hint||''}</span>`;
  h.onclick=()=>sec.classList.toggle('collapsed');
  const b=document.createElement('div'); b.className='body'; sec.append(h,b); rscroll.appendChild(sec); fn(b); return b;
}
const row=(label,el)=>{ const r=document.createElement('div'); r.className='row';
  const l=document.createElement('label'); l.textContent=label; r.append(l,el); return r; };
function num(v,step,onChange,min,max){ const i=document.createElement('input'); i.type='number';
  i.value=v; i.step=step??0.01; if(min!==undefined)i.min=min; if(max!==undefined)i.max=max;
  i.oninput=()=>{ const x=+i.value; if(isFinite(x)) onChange(x); }; return i; }
function colorInput(v,onChange){ const i=document.createElement('input'); i.type='color';
  i.value='#'+(v>>>0).toString(16).padStart(6,'0'); i.oninput=()=>onChange(parseInt(i.value.slice(1),16)); return i; }
function selInput(v,opts,onChange){ const s=document.createElement('select');
  for(const o of opts){ const op=document.createElement('option'); op.value=o; op.textContent=o; if(o===v)op.selected=true; s.appendChild(op); }
  s.onchange=()=>onChange(s.value); return s; }

/* ==================== ★ 保存 / 新增模型 / 缓存 / 显卡 ==================== */
let storeBody=null;
async function renderStorePanel(){
  const b=storeBody; if(!b) return;
  b.innerHTML='';
  const box=document.createElement('div'); box.className='pipe-info'; box.textContent='读取中…'; b.appendChild(box);
  let S=null, A=null, G=null;
  try{ S=await Store.overview(); A=S.agent; }catch(e){ box.textContent='服务端没起来？'+e.message; return; }
  G=gpuInfo();
  box.innerHTML = `<b>显卡</b>：<span class="${G.software||!G.supported?'over':''}">${G.renderer||'未知'}</span>`
    + `<br>${G.webgl||'—'} · ${G.supported?(G.software?'软件渲染（慢）':'硬件加速'):'没有 WebGL'}`
    + ` · 最大纹理 ${G.maxTexture||'?'}`;
  b.appendChild(box);
  if(!G.supported || G.software){
    const adv=gpuAdvice(G);
    const w=document.createElement('div'); w.className='pipe-focus over';
    w.innerHTML = `<b>${adv.title}</b><br>` + adv.steps.map(x=>'· '+x).join('<br>')
      + `<br><span class="tag">详见 docs/gpu.md</span>`;
    b.appendChild(w);
  }
  // Agent
  const ag=document.createElement('div'); ag.className='pipe-info';
  ag.innerHTML = A && A.agent ? `AI 接管：<b>${A.agent}</b><br><span class="tag">${A.note||''}</span>`
    : 'AI 接管：<span class="tag">还没有 Agent 接管</span>';
  b.appendChild(ag);

  // 模型列表
  const h=(t)=>{ const d=document.createElement('div'); d.className='pipe-grp'; d.textContent=t; return d; };
  const line=(m, where)=>{
    const d=document.createElement('div'); d.className='pipe-step';
    d.innerHTML = `${m.name} <span class="tag">${where} · ${m.parts||0} 部件 · ${m.triangles||0} 面</span>`;
    d.title='点击载入';
    d.onclick=async()=>{ const r=await EditorAPI.loadStoredModel(m.id); toast(r.ok?('已载入 '+m.name):r.error); renderStorePanel(); };
    const del=document.createElement('button'); del.textContent='删'; del.style.cssText='float:right;padding:0 6px';
    del.onclick=async(ev)=>{ ev.stopPropagation(); if(!confirm('删除 '+m.name+' ?')) return;
      await EditorAPI.removeStoredModel(m.id); toast('已删除'); renderStorePanel(); };
    d.appendChild(del);
    if(where==='临时'){
      const okb=document.createElement('button'); okb.textContent='确认'; okb.style.cssText='float:right;padding:0 6px;margin-right:4px';
      okb.onclick=async(ev)=>{ ev.stopPropagation(); const r=await EditorAPI.confirmModel(m.id);
        toast(r.ok?'已确认 → NewlyAddedModelList':'失败'); renderStorePanel(); };
      d.appendChild(okb);
    }
    return d;
  };
  const list=document.createElement('div'); list.className='pipe-list';
  list.appendChild(h('NewlyAddedModelTemporaryList · 待确认（'+S.temporary.length+'）'));
  if(!S.temporary.length){ const d=document.createElement('div'); d.className='pipe-step'; d.textContent='（空）'; list.appendChild(d); }
  for(const m of S.temporary) list.appendChild(line(m,'临时'));
  list.appendChild(h('NewlyAddedModelList · 已确认（'+S.confirmed.length+'）'));
  if(!S.confirmed.length){ const d=document.createElement('div'); d.className='pipe-step'; d.textContent='（空）'; list.appendChild(d); }
  for(const m of S.confirmed) list.appendChild(line(m,'正式'));
  b.appendChild(list);

  // 按钮
  const g=document.createElement('div'); g.className='btns';
  const mk=(t,cls,fn)=>{ const x=document.createElement('button'); x.className=cls||''; x.textContent=t; x.onclick=fn; g.appendChild(x); };
  mk('存为新增模型','pri',async()=>{ const r=await EditorAPI.saveModel({});
    toast(r.ok?('已存到临时区：'+r.id):('失败：'+r.error)); renderStorePanel(); });
  mk('存并直接确认','pri',async()=>{ const r=await EditorAPI.saveModel({ confirmed:true });
    toast(r.ok?('已存进正式区：'+r.id):('失败：'+r.error)); renderStorePanel(); });
  mk('刷新列表','',()=>renderStorePanel());
  mk('清空缓存','danger',async()=>{ if(!confirm('清空 TemporaryCache？（AI 测试产物，不影响已保存模型）')) return;
    const r=await EditorAPI.cacheClear(); toast('已清 '+r.removed+' 个文件'); renderStorePanel(); });
  b.appendChild(g);
  const c=document.createElement('div'); c.className='pipe-ev';
  c.textContent = `缓存：${S.cache.files} 个文件 / ${(S.cache.bytes/1024).toFixed(1)} KB`;
  b.appendChild(c);
}

/* ==================== ★ 生成流水线面板（AI 流程可见可操作）==================== */
let pipeBody=null, gateBody=null, LAST_GATE=null;
function renderPipelinePanel(){
  const b=pipeBody; if(!b) return;
  b.innerHTML='';
  const st=EditorAPI.pipeline();
  const info=document.createElement('div'); info.className='pipe-info'+(st.status==='stopped'?' over':'');
  if(st.status==='stopped'){
    info.innerHTML=`<b>★ 硬停</b>：${st.stopReason}<br>不要继续往下做 —— 向用户报告，或点「重置流水线」。`;
  }else if(st.status==='complete'){
    info.innerHTML=`<b>已完成</b> · 循环 ${st.loops.total}/${st.loops.maxTotal}`;
  }else{
    info.innerHTML=`<b>${st.passLabel||''}</b><br>步骤 <b>${st.progress.done+st.progress.skipped}</b>/${st.progress.total}`
      + ` · 循环 <b>${st.loops.total}</b>/${st.loops.maxTotal}`
      + ` · IoU 门槛 <b>${st.iouThreshold}</b>`;
  }
  b.appendChild(info);
  if(st.passFocus){ const f=document.createElement('div'); f.className='pipe-focus'; f.textContent='焦点：'+st.passFocus; b.appendChild(f); }
  if(st.nextCommand){
    const c=document.createElement('div'); c.className='pipe-cmd'; c.textContent=st.nextCommand; c.title='点击复制';
    c.onclick=async()=>{ try{ await navigator.clipboard.writeText(st.nextCommand); toast('命令已复制'); }catch(e){ toast('复制失败'); } };
    b.appendChild(c);
  }
  if(st.requiredEvidence.length){ const e=document.createElement('div'); e.className='pipe-ev';
    e.textContent='要交的证据：'+st.requiredEvidence.join('；'); b.appendChild(e); }

  const list=document.createElement('div'); list.className='pipe-list';
  let last=null;
  for(const r of st.checklist){
    if(r.scope==='pass' && r.passId!==last){ last=r.passId;
      const h=document.createElement('div'); h.className='pipe-grp'+(r.passId===st.currentPass?' cur':'');
      const meta=st.passOrder.find(p=>p.id===r.passId);
      h.textContent=(r.passId===st.currentPass?'▶ ':'')+(meta?meta.label:r.passId); list.appendChild(h); }
    if(r.scope!=='pass' && r.scope!==last){ last=r.scope;
      const h=document.createElement('div'); h.className='pipe-grp';
      h.textContent=({setup:'准备',final:'收尾'})[r.scope]||r.scope; list.appendChild(h); }
    const d=document.createElement('div');
    d.className='pipe-step '+r.status+(r.isCurrent?' now':'');
    d.textContent=(r.status==='done'?'✓ ':r.status==='skipped'?'– ':(r.isCurrent?'▸ ':'· '))+r.label;
    d.title=(r.evidence&&r.evidence.length?('证据：'+r.evidence.join('；')):'')+(r.reason?(' 原因：'+r.reason):'')+'\n'+r.command;
    if(r.status!=='done') d.onclick=()=>{ const ev=prompt(`标记「${r.label}」为完成；请写证据：`, (r.evidence[0]||'')); if(ev===null) return;
      const res=EditorAPI.pipelineMark(r.id,{status:'done',evidence:ev||'(未填)'}); if(!res.ok) toast(res.error); renderPipelinePanel(); };
    list.appendChild(d);
  }
  b.appendChild(list);

  const g=document.createElement('div'); g.className='btns';
  const mk=(t,cls,fn)=>{ const x=document.createElement('button'); x.className=cls||''; x.textContent=t; x.onclick=fn; g.appendChild(x); };
  mk('跑质量门','pri',async()=>{ const r=await EditorAPI.gates({ turntable:true });
    if(!r.ok) return toast('质量门失败：'+r.error);
    renderPipelinePanel();
    toast(r.summary.verdict==='pass'?'✓ 全部通过':(r.summary.verdict==='fail'?'✗ 有门未通过':'⚠ 有门没测到')); });
  mk('存基线图','',()=>{ const r=EditorAPI.baseline('set'); toast(r.ok?'基线已存（用于内外差门）':'失败'); });
  mk('存入档','',()=>EditorAPI.saveSession().then(()=>toast('已存档')));
  mk('读档','',()=>{ const r=EditorAPI.loadSession(); toast(r.ok?'已读档':r.error); renderPipelinePanel(); });
  mk('导出存档','',()=>EditorAPI.exportSession().then(r=>download(new Blob([r.json],{type:'application/json'}),'session.json')));
  mk('重置流水线','danger',()=>{ if(confirm('重置流水线状态？（规格不会变）')){ EditorAPI.pipelineReset(); renderPipelinePanel(); } });
  b.appendChild(g);

  if(LAST_GATE){
    const s=LAST_GATE.summary;
    const box=document.createElement('div'); box.className='pipe-gates';
    box.innerHTML=`<b>质量门</b>：<span class="${s.verdict==='pass'?'':'over'}">${s.verdict.toUpperCase()}</span>`
      + ` · 通过 ${s.passed.length} · 未通过 ${s.failed.length} · 未测 ${s.unevaluated.length}`;
    for(const gate of Object.values(LAST_GATE.report)){
      const d=document.createElement('div'); d.className='pipe-gate'; if(gate.verdict==='fail') d.classList.add('over');
      let extra='';
      if(gate.gate==='silhouette'&&gate.metrics&&gate.metrics.iou!=null) extra=` IoU=${gate.metrics.iou} (需 ${gate.iouMin})`;
      if(gate.gate==='turntable') extra=` 塌缩=${gate.collapseRatio} 缺方位=${gate.missingAzimuths.length}`;
      if(gate.gate==='clearance'&&gate.items) extra=' '+gate.items.map(i=>i.name+' '+(i.insideFraction*100).toFixed(0)+'%').join(' / ');
      if(gate.gate==='seam') extra=` 检查 ${gate.checked} 对 · 失败 ${(gate.failures||[]).length}`;
      if(gate.gate==='chirality') extra=` 配对 ${(gate.pairs||[]).length}`;
      if(gate.gate==='scalp-coverage'&&gate.exposedFraction!=null) extra=` 头皮露出 ${(gate.exposedFraction*100).toFixed(1)}%（上限 ${(gate.maxExposed*100).toFixed(0)}%）`;
      if(gate.gate==='interior-difference'&&gate.interiorDifference!=null) extra=` 内部差 ${gate.interiorDifference}`;
      d.textContent=`${gate.verdict}${gate.verdict==='unevaluated'?'（未测≠通过）':''} · ${gate.gate}${extra}`;
      if(gate.verdict==='fail'||gate.verdict==='unevaluated'){ const why=EditorAPI.gateFailDetail(gate); if(why) d.textContent+=' — '+why; }
      box.appendChild(d);
    }
    if(s.reasons.length){ const r=document.createElement('div'); r.className='pipe-gate over'; r.textContent='✗ '+s.reasons.join(' / '); box.appendChild(r); }
    if(s.note){ const r=document.createElement('div'); r.className='pipe-gate'; r.textContent='⚠ '+s.note; box.appendChild(r); }
    b.appendChild(box);
  }
}

let refPanelBody=null;
function refPanelBuild(b){
  const g1=document.createElement('div'); g1.className='btns';
  const mk=(t,cls,fn)=>{ const x=document.createElement('button'); x.className=cls||''; x.textContent=t; x.onclick=fn; g1.appendChild(x); return x; };
  const fi=document.createElement('input'); fi.type='file'; fi.accept='image/*'; fi.style.display='none';
  mk('载入图片…','pri',()=>fi.click());
  mk('移除','danger',()=>{ clearRefImg(); toast('已移除参照图'); renderRefPanel(); });
  g1.appendChild(fi); b.appendChild(g1);
  const readTo=(file)=>{ const rd=new FileReader();
    rd.onload=async()=>{ const r=await loadRefImage(rd.result,{ opacity:refImg?refImg.info.opacity:0.45,
      height:refImg?refImg.info.height:2.4 });
      toast(r.ok? ('参照图已载入 '+r.width+'×'+r.height) : r.error); renderRefPanel(); };
    rd.readAsDataURL(file); };
  fi.onchange=()=>{ const f=fi.files&&fi.files[0]; if(f) readTo(f); };

  const drop=document.createElement('div');
  drop.style.cssText='border:1px dashed var(--line);border-radius:5px;padding:6px;text-align:center;color:var(--dim);font-size:10.5px';
  drop.textContent='也可以拖图片到这里 / Ctrl+V 粘贴';
  drop.ondragover=e=>e.preventDefault();
  drop.ondrop=e=>{ e.preventDefault(); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) readTo(f); };
  b.appendChild(drop);

  const info=document.createElement('div'); info.style.cssText='color:var(--dim);font-size:10.5px;line-height:1.5;word-break:break-all';
  info.textContent = refImg
    ? (refImg.info.src+' · '+refImg.info.width.toFixed(2)+'×'+refImg.info.height.toFixed(2)+' · '+refImg.info.plane)
    : '未载入。载入后它贴在模型后面，render() 也会带上它 —— 大模型可以叠图对比后迭代。';
  b.appendChild(info);
  if(!refImg) return;

  const sl=(label,val,min,max,step,fn)=>{ const w=document.createElement('div'); w.className='row';
    const s=document.createElement('label'); s.textContent=label; s.style.minWidth='52px';
    const r=document.createElement('input'); r.type='range'; r.min=min; r.max=max; r.step=step; r.value=val;
    const v=document.createElement('span'); v.className='tag'; v.textContent=(+val).toFixed(2);
    r.oninput=()=>{ fn(+r.value); v.textContent=(+r.value).toFixed(2); };
    w.append(s,r,v); return w; };
  b.appendChild(sl('透明度', refImg.info.opacity, 0, 1, 0.02, v=>applyRefOpts({opacity:v})));
  b.appendChild(sl('高度', refImg.info.height, 0.6, 5, 0.05, v=>applyRefOpts({height:v})));
  b.appendChild(row('贴在哪面', selInput(refImg.info.plane, ['front','back','left','right'],
    v=>{ applyRefOpts({plane:v}); renderRefPanel(); })));
  const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=refImg.mesh.visible!==false;
  cb.onchange=()=>applyRefOpts({visible:cb.checked});
  b.appendChild(row('显示',cb));

  const cw=document.createElement('div'); cw.className='row';
  const cl=document.createElement('span'); cl.className='tag'; cl.textContent='点小图取色';
  const cv=document.createElement('canvas'); cv.width=112; cv.height=112;
  cv.style.cssText='border:1px solid var(--line);border-radius:4px;background:var(--raise);cursor:crosshair;flex:none';
  const cc=cv.getContext('2d'), ar=(refImg.canvas.width/refImg.canvas.height)||1;
  const dw=ar>=1?112:Math.round(112*ar), dh=ar>=1?Math.round(112/ar):112;
  cc.drawImage(refImg.canvas,(112-dw)/2,(112-dh)/2,dw,dh);
  const sw=document.createElement('span'); sw.className='tag'; sw.textContent='—';
  cv.onclick=e=>{ const r=cv.getBoundingClientRect();
    const px=refPixel((e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height);
    sw.textContent=px.hex; sw.style.background=px.hex; sw.style.color='#111';
    if(navigator.clipboard) navigator.clipboard.writeText(px.hex).catch(()=>{});
    toast('取色 '+px.hex+'（已复制）'); };
  cw.append(cl,cv,sw); b.appendChild(cw);

  const pt=document.createElement('div'); pt.className='row';
  const pts=document.createElement('span'); pts.className='tag'; pts.textContent='主色板（点一下刷到选中图元）';
  pt.appendChild(pts); b.appendChild(pt);
  const pw=document.createElement('div'); pw.style.cssText='display:flex;flex-wrap:wrap;gap:4px';
  for(const c of refPaletteOf(8)){
    const s=document.createElement('button'); s.title=c.hex+' · '+(c.share*100).toFixed(1)+'%';
    s.style.cssText='width:22px;height:20px;padding:0;border:1px solid var(--line);border-radius:3px;background:'+c.hex;
    s.onclick=()=>{ const es=selectedEntries().filter(e=>!e.imported);
      if(!es.length){ toast('先在视口里选图元'); return; }
      const hex=new THREE.Color(c.hex).getHex();
      for(const e of es){ const pr=e.part.primitives[e.primIndex]; if(pr) pr.color=hex; }
      build(); renderSel(); toast('已把选中图元改成 '+c.hex); };
    pw.appendChild(s);
  }
  b.appendChild(pw);
}

function renderZones(){
  const el=document.getElementById('zoneList'); if(!el) return;
  el.innerHTML='';
  const zones=spec.zones||[];
  const cap=document.createElement('div'); cap.style.cssText='font-size:10.5px;color:var(--dim);margin:4px 0';
  cap.textContent='共 '+zones.length+' 条';
  el.appendChild(cap);
  zones.forEach((z,i)=>{
    const card=document.createElement('div'); card.className='prim';
    const ph=document.createElement('div'); ph.className='ph';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=z.enabled!==false;
    cb.onclick=(e)=>e.stopPropagation();
    cb.onchange=()=>{ z.enabled=cb.checked; };
    const nm=document.createElement('input'); nm.type='text'; nm.value=z.label;
    nm.style.flex='1'; nm.style.minWidth='0';
    nm.onclick=(e)=>e.stopPropagation();
    nm.oninput=()=>{ z.label=nm.value; };
    const up=document.createElement('button'); up.textContent='↑'; up.title='上移（提高优先级）';
    up.onclick=(e)=>{ e.stopPropagation(); if(i>0){ zones.splice(i,0,zones.splice(i,1)[0]); renderZones(); } };
    const dn=document.createElement('button'); dn.textContent='↓';
    dn.onclick=(e)=>{ e.stopPropagation(); if(i<zones.length-1){ zones.splice(i+1,0,zones.splice(i,1)[0]); renderZones(); } };
    const del=document.createElement('button'); del.className='danger'; del.textContent='删';
    del.onclick=(e)=>{ e.stopPropagation(); zones.splice(i,1); renderZones(); };
    ph.append(cb,nm,up,dn,del);
    ph.onclick=()=>card.classList.toggle('on');
    card.appendChild(ph);

    const pc=document.createElement('div'); pc.className='pc';
    const r2=document.createElement('div'); r2.className='row';
    const rl=document.createElement('span'); rl.className='tag'; rl.textContent='角色';
    const rs=selInput(z.role||'any', ['any',...PARENTS.map(p=>p[0])], v=>{ z.role=v; });
    const cl=document.createElement('span'); cl.className='tag'; cl.textContent='分类';
    const cs=selInput(z.cat||'any', ['any',...CATEGORIES], v=>{ z.cat=v; });
    r2.append(rl,rs,cl,cs); pc.appendChild(r2);

    const g2=document.createElement('div'); g2.className='grid7';
    for(const ax of ['x','y','z']) for(const j of [0,1]){
      const w=document.createElement('div'); w.className='f';
      const s=document.createElement('span'); s.textContent=ax+(j?'+':'-');
      const cur=(z.box&&z.box[ax])?z.box[ax]:[ -BIG, BIG ];
      const show=Math.abs(cur[j])>=BIG/2 ? (j?9:-9) : cur[j];
      w.append(s, num(show,.01,v=>{
        z.box=z.box||{}; const a=(z.box[ax]||[-BIG,BIG]).slice();
        a[j]=Math.abs(v)>=8.9 ? (j?BIG:-BIG) : v; z.box[ax]=a;
      }));
      g2.appendChild(w);
    }
    pc.appendChild(g2);

    /* ---- 切割面 ---- */
    z.planes=z.planes||[];
    const pw=document.createElement('div');
    const pt=document.createElement('div'); pt.className='row';
    pt.innerHTML='<span class="tag">切割面（与上面范围同时满足才命中）</span>';
    pw.appendChild(pt);
    z.planes.forEach((pl,pi)=>{
      const ra=document.createElement('div'); ra.className='row';
      const t=document.createElement('span'); t.className='tag'; t.textContent='#'+(pi+1);
      const preset=document.createElement('select');
      const on0=document.createElement('option'); on0.value=''; on0.textContent='法向…'; preset.appendChild(on0);
      for(const k of Object.keys(AXES)){ const o=document.createElement('option'); o.value=k; o.textContent=k; preset.appendChild(o); }
      preset.onchange=()=>{ const a=AXES[preset.value]; if(a){ pl.n=a.slice(); showPlaneHelper(i,pi); rezoneLive(); } };
      const nv=[0,1,2].map(j=>num((pl.n||[1,0,0])[j],.05,v=>{
        pl.n=pl.n||[1,0,0]; pl.n[j]=v; if(activePlane&&activePlane.zi===i&&activePlane.pi===pi) showPlaneHelper(i,pi); rezoneLive(); }));
      ra.append(t,preset,...nv); pw.appendChild(ra);

      const rb=document.createElement('div'); rb.className='row';
      const side=document.createElement('select');
      for(const s of [['>=','保留 +法向一侧'],['<=','保留 -法向一侧']]){
        const o=document.createElement('option'); o.value=s[0]; o.textContent=s[1]; if((pl.side||'>=')===s[0])o.selected=true; side.appendChild(o); }
      side.onchange=()=>{ pl.side=side.value; rezoneLive(); };
      const off=document.createElement('input'); off.type='range'; off.min=-1.5; off.max=1.5; off.step=0.01; off.value=pl.d||0;
      const dv=document.createElement('span'); dv.className='tag'; dv.textContent=(pl.d||0).toFixed(2);
      off.oninput=()=>{ pl.d=+off.value; dv.textContent=(+off.value).toFixed(2); showPlaneHelper(i,pi); rezoneLive(); };
      const eye=document.createElement('button'); eye.textContent='看面'; eye.title='在视口显示这个切割面';
      eye.onclick=()=>showPlaneHelper(i,pi);
      const del=document.createElement('button'); del.className='danger'; del.textContent='删';
      del.onclick=()=>{ z.planes.splice(pi,1); if(activePlane&&activePlane.zi===i) hidePlaneHelper(); renderZones(); };
      rb.append(side,off,dv,eye,del); pw.appendChild(rb);
    });
    const pb=document.createElement('div'); pb.className='btns';
    const b1=document.createElement('button'); b1.textContent='＋切割面';
    b1.onclick=()=>{ (z.planes=z.planes||[]).push({enabled:true,n:[1,0,0],d:0,side:'>='}); renderZones(); };
    const b2=document.createElement('button'); b2.className='pri'; b2.textContent='从选中定面';
    b2.onclick=()=>{ const r=zonePlaneFromSelection(z);
      if(!r.ok){ toast(r.error); return; }
      renderZones(); showPlaneHelper(i, z.planes.length-1); rezoneLive(); toast('已加切割面 · 拖偏移实时切'); };
    pb.append(b1,b2); pw.appendChild(pb);
    pc.appendChild(pw);

    card.appendChild(pc);
    el.appendChild(card);
  });
}

/* 骨架比例面板的刷新器：面板是在第一次 build() **之前**就建好的，
 * 那时 spec.rig 还是模板默认值（groups 还没被 measureRig 填上）。
 * 所以显示值必须能刷新，并且挂在 build() 上（规格一变就同步）。 */
var rigRefresh = null;

section('骨架比例','跟随基础',false,b=>{
  const rows=[];
  const slider=(label,axis,fb,min,max,step)=>{
    const w=document.createElement('div'); w.className='row';
    const l=document.createElement('label'); l.textContent=label;
    const i=document.createElement('input'); i.type='range'; i.min=min;i.max=max;i.step=step;
    const v=document.createElement('span'); v.className='tag';
    i.oninput=()=>{
      rigSet(axis, +i.value);                       // ★ 写 groups + 扁平字段（两条路一致）
      v.textContent=(+i.value).toFixed(2);
      const g=build();
      // base 模式下 rig 是从原作模型量出来的：重新量一遍，把 groups 校准到真实位置
      if(spec.mode==='base' && g) spec.rig=measureRig(g);
      if(rigRefresh) rigRefresh();
    };
    rows.push({ axis, fb, i, v });
    w.append(l,i,v); return w;
  };
  b.appendChild(slider('headY','headY',1.47,.8,2.2,.01));
  b.appendChild(slider('bodyY','bodyY',-0.11,-.5,.5,.01));
  b.appendChild(slider('armX','armX',0.36,.2,.9,.01));
  b.appendChild(slider('armY','armY',1.22,.6,1.6,.01));
  b.appendChild(slider('legX','legX',0.16,.05,.4,.01));
  b.appendChild(slider('legY','legY',0.73,.3,1.1,.01));
  rigRefresh = ()=>{ for(const r of rows){
    const cur = rigGet(r.axis, r.fb);
    r.i.value = cur;
    r.v.textContent = (+cur).toFixed(2);
  } };
  rigRefresh();
  // 展开时也刷新一次（模型可能被 boxify / loadBase 换过）
  try{ b.parentElement.querySelector('h3').addEventListener('click', ()=>rigRefresh()); }catch(e){}
  b.appendChild(row('虹膜',(()=>{ const w=document.createElement('div'); w.style.display='flex'; w.style.gap='4px';
    for(let i=0;i<3;i++) w.appendChild(colorInput(spec.iris[i]??0xffffff, v=>{ spec.iris[i]=v; if(spec.mode==='parts'&&spec.useOrigFace) build(); }));
    return w; })()));

function renderBatchSelection(b){

    cr.appendChild(colorInput(resolveColor(own[0].part.primitives[own[0].primIndex].color),

    o2.sort((a,b)=>b.primIndex-a.primIndex).forEach(e=>{ const arr=e.part.primitives; if(arr[e.primIndex])arr.splice(e.primIndex,1); });

    build(); selection=keys; refreshGizmo(); renderSel(); renderPartList(); });
  mk('合并为新部件','',()=>{ mergeSelection(); });
  mk('取消选择','',()=>detachGizmo());

function mergeSelection(){
  const list=selectedEntries().filter(e=>!e.imported).slice();
  if(!list.length){ toast('没有可合并的新增图元'); return; }
  const parent=list[0].mesh.parent;
  const same=list.filter(e=>e.mesh.parent===parent && !e.mirrored);
  if(!same.length){ toast('需要同一父级且非镜像'); return; }
  const byParent={};
  for(const e of (same)) (byParent[e.part.id]=byParent[e.part.id]||[]).push(e.primIndex);
  const np={ id:'merged'+Math.random().toString(36).slice(2,5), name:'合并部件',
    category:list[0].part.category, parent:same[0].part.parent, metalness:list[0].part.metalness??0.05, primitives:[] };
  same.forEach(e=>np.primitives.push(JSON.parse(JSON.stringify(e.part.primitives[e.primIndex]))));
  for(const [pid,idxs] of Object.entries(byParent)){ const p=spec.parts.find(x=>x.id===pid);
    idxs.sort((a,b)=>b-a).forEach(i=>p.primitives.splice(i,1)); }
  spec.parts.push(np); build();
  selection=np.primitives.map((_,i)=>keyOfPart(np.id,i,false));
  refreshGizmo(); renderPartList(); renderSel(); toast('已合并');
}
