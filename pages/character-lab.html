  #panel header h1{margin:0;font-size:15px;letter-spacing:.1em;font-weight:800}
  #panel header p{margin:6px 0 0;font-size:11px;color:var(--dim);line-height:1.5}
  #scroll{overflow:auto;flex:1;padding:12px 14px 90px}
  .sec{margin-bottom:14px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .sec>h2{margin:0;padding:8px 10px;font-size:12px;letter-spacing:.06em;background:var(--panel2);

  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}

  input[type=range]{flex:1;accent-color:var(--accent);height:18px}

  .btn:hover{background:var(--hover);border-color:var(--accent)}

  #stats{position:fixed;left:16px;top:14px;z-index:15;font-size:11px;color:var(--dim);
    background:var(--glass2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;line-height:1.7}
  #tips{position:fixed;left:16px;bottom:14px;z-index:15;font-size:11px;color:var(--dim);
    background:var(--glass2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
  #toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:40;background:var(--ok-bg2);
    border:1px solid var(--ok-line);color:var(--ok-ink);padding:8px 16px;border-radius:6px;font-size:12px;opacity:0;transition:.25s}
  #toast.on{opacity:1}
  @media(max-width:780px){#panel{width:100%;height:46%;top:auto;bottom:0;border-left:0;border-top:1px solid var(--line)}#tips{display:none}}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { XT, KT, AT, It, Bt, Q } from '../src/characters.orig.js';
import { attachFace } from '../src/characters.face.js';
import { Store, gpuInfo, gpuAdvice } from '../src/characters.store.js';
import * as LP from '../src/characters.lowpoly.js';   // ★ 我们的运行时：移动状态机 + 活动 + 武器池
/* ★ 高模模块（characters.hires2.js，~840KB）**不再静态 import**，也不在首屏就 import ——
   等首屏渲染完再按需加载，避免拖慢加载。首屏先用空表（只是少个 ★ 标记）。 */
let HIRES = null, hiresPromise = null;
const HIRES_VARIANTS = Object.create(null);
const HIRES_PALETTES = Object.create(null);
function loadHires(){
  if (hiresPromise) return hiresPromise;
  hiresPromise = import('../src/characters.hires2.js').then((m) => {
    HIRES = m;
    Object.assign(HIRES_VARIANTS, m.HIRES_VARIANTS || {});
    Object.assign(HIRES_PALETTES, m.HIRES_PALETTES || {});
    try { publishCharacters(); } catch (e) {}          // 函数声明会提升
    try { refreshHiresMarks(); } catch (e) {}          // 补上 ★ / 变体
    return m;
  }).catch((e) => { console.warn('高模模块加载失败（低模不受影响）：', e); return null; });
  return hiresPromise;
}
const initHires  = (...a) => loadHires().then(() => HIRES.initHires(...a));
const buildHires = (...a) => { if (!HIRES) throw new Error('高模模块还没加载完'); return HIRES.buildHires(...a); };
const ek = (...a) => HIRES.ek(...a);
const NE = (...a) => HIRES.NE(...a);
let hiresReady = false;
/** 高模模块到位后：把「原始模型」按钮补 ★、刷新变体下拉 */
function refreshHiresMarks(){
  const cn = new Map(ROSTER);
  for (const b of opButtons) {
    const id = b.dataset.id;
    b.textContent = (cn.get(id) || id) + (HIRES_VARIANTS[id] ? ' ★' : '');
    if (HIRES_VARIANTS[id]) b.title = '含高模：' + HIRES_VARIANTS[id].join(' / ');
  }
  if (typeof refreshVariantSelect === 'function') refreshVariantSelect();
}

/* ------------------------------------------------------------------ 名单 */
const ROSTER = [
  ['lappland','拉普兰德'],['texas','德克萨斯'],['exusiai','能天使'],['croissant','可颂'],
  ['sora','空'],['mostima','莫斯提马'],['chen','陈'],['hoshiguma','星熊'],
  ['swire','诗怀雅'],['emperor','大帝'],['lee','老鲤'],['aak','阿'],
  ['hung','吽'],['waaifu','槐琥']
];
const NAME = Object.fromEntries(ROSTER);

/* ------------------------------------------------------------------ 原厂快照
 * 「还原该干员配色」要恢复到**原厂**调色板。
 * ⚠ 不能靠 `delete KT[id]` 来还原 —— src/characters.orig.js 里 XT(id) 是
 *   `let t = KT[e]` 然后直接读 t.coat / t.trim …，删掉 KT[id] 会抛
 *   TypeError: Cannot read properties of undefined (reading 'coat')。
 *   （AT 那边有 `AT[e] ?? AT.texas` 兜底，删了没事，但统一用快照更省心。）
 * 所以启动时深拷贝一份，还原 = 覆盖回去。
 * -------------------------------------------------------------------------- */
const KT0 = JSON.parse(JSON.stringify(KT));
const AT0 = JSON.parse(JSON.stringify(AT));

/* ============================================================================
 * ★ 新增模型（独立模块 —— **绝不和原作 14 人混在一起**，避免数据污染）
 *   数据来自 NewlyAddedModelList / NewlyAddedModelTemporaryList（服务端 /api/models）
 *   构建方式：直接用编辑器导出的 model.js 工厂函数（不重复实现一套构建器）
 *     new Function('THREE','Q','XT','attachFace', src + '; return build_xxx;')
 * ========================================================================== */
const NEW = { list: [], factories: {}, error: null, inited: false };
/* ★ 磁盘上的模型如果**同一个 id 也是我们的程序化角色**（miku / brs），就用运行时本体构建
   （全质量：圆角盒 + 手绘脸 + 武器），而不是用 model.js 那个小解释器。 */
const runtimeChar = (id) => (LP.CHARACTERS && LP.CHARACTERS[id]) || null;
async function loadNewList(){
  try{
    const r = await Store.listModels();
    NEW.list = [ ...(r.confirmed||[]).map(m=>({ ...m, where:'已确认' })),
                 ...(r.temporary||[]).map(m=>({ ...m, where:'待确认' })) ];
    for (const m of NEW.list) m.runtime = !!runtimeChar(m.id);
    NEW.error = null;
  }catch(e){ NEW.list = []; NEW.error = '读不到磁盘上的模型列表（tools/_serve.js 起来了吗？）：'+(e.message||e); }
  NEW.inited = true;
  return NEW.list;
}
async function loadNewFactory(id){
  if(NEW.factories[id]) return NEW.factories[id];
  /* ★ 程序化角色：直接跑我们的运行时本体（返回完整骨骼引用），不用 model.js 小解释器 */
  if(runtimeChar(id)){
    const fn = () => LP.buildCharacter(id).proto;
    NEW.factories[id] = fn;
    return fn;
  }
  const r = await Store.getModel(id);
  if(!r || !r.spec) throw new Error('模型数据为空');
  if(!r.js) throw new Error('这个模型只存了规格（spec），没有 model.js 工厂 —— 存的时候别关 withJs');
  const src = r.js;
  const m = src.match(/function\s+(build_[A-Za-z0-9_$]+)\s*\(/);
  if(!m) throw new Error('model.js 里找不到 build_xxx 工厂函数');
  const mod = src + '\n;return ' + m[1] + ';';
  const fn = new Function('THREE','Q','XT','attachFace', mod)(THREE, Q, XT, attachFace);
  if(typeof fn !== 'function') throw new Error('工厂函数不可用');
  NEW.factories[id] = fn;
  return fn;
}

/* ==========================================================================
 * 把**权威角色清单**发布给服务端（AI Agent 靠 /api/characters 发现有哪些角色）
 *
 * 为什么由这个页面发：只有它同时知道
 *   ① 低模 14 人的 id + 中文名（ROSTER）
 *   ② 哪些人有高模、有哪几个变体（HIRES_VARIANTS，来自 src/characters.hires2.js）
 * 服务端自己扫 models/ 目录是猜不全的 —— texas / exusiai 共用 _shared-baseline.json，
 * 文件名里根本没有它们的变体名。
 *
 * 静默失败：服务器没起 / 写不进去都不该影响页面。
 * ========================================================================== */
async function publishCharacters(){
  try{
    const { HIRES_VARIANTS } = await import('../src/characters.hires2.js');
    const ref = await fetch('/data/reference-models.json').then(r => r.json()).catch(() => null);
    const det = (ref && ref.models) || {};
    const low = ROSTER.map(([id, label]) => ({
      id, label,
      build: 'XT(' + JSON.stringify(id) + ')',
      faces: 'attachFace(...)  // src/characters.face.js',
      details: '/data/reference-models.json#models.' + id,
      rig: det[id] ? det[id].rig : null,
      palette: det[id] ? det[id].palette : null,
      meshCount: det[id] ? det[id].meshCount : null,
      groups: det[id] && det[id].groups ? Object.keys(det[id].groups) : []
    }));
    const high = Object.keys(HIRES_VARIANTS).map(id => ({
      id, label: NAME[id] || id, variants: HIRES_VARIANTS[id],
      build: 'buildHires(' + JSON.stringify(id) + ', ' + JSON.stringify(HIRES_VARIANTS[id][0]) + ')',
      baked: true,
      files: HIRES_VARIANTS[id].map(v => '/models/' + id + '-' + v + '.json'),
      sharedBaseline: '/models/_shared-baseline.json'
    }));
    await Store.publishCharacters({
      schema: 'lowpoly-workshop/characters@1',
      generatedBy: 'pages/character-lab.html 加载时自动发布',
      note: '原作角色的权威索引。低模是程序化生成的（给 XT(id) 就能拿到几何），高模是烘焙好的 THREE.Object3D.toJSON。',
      low, high,
      sources: { lowPoly:'/characters.orig.js', face:'/characters.face.js',
        highPoly:'/characters.hires2.js', reference:'/data/reference-models.json' }
    });
  }catch(e){ /* 服务端没起就算了，不影响页面 */ }
}
/* publishCharacters() 现在由高模模块加载完成后触发（见顶部 hiresLoaded.then），
   不再卡在首屏 —— 它要动态 import 高模模块、还要发 /api/characters。 */

const P = {
  id: 'texas',
  model: 'low',          // 'low' = XT 程序化 | 'high' = 烘焙高模 | 'new' = 新增模型
  hiresVariant: 'classic',
  newId: null,           // P.model==='new' 时用哪个新增模型
  scale: 1.0,
  pose: 'idle',
  ring: true,
  autoRotate: false
};

/* ------------------------------------------------------------ 场景 */
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9b4ba);
scene.fog = new THREE.Fog(0xa9b4ba, 14, 34);
const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.1, 100);
camera.position.set(1.5, 1.95, 5.8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.20, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 2.5; controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI*0.53;
controls.update();

scene.add(new THREE.HemisphereLight(0xcfe3ee, 0x22303a, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(3.4, 6.2, 4.6); key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near = 0.5; key.shadow.camera.far = 24;
key.shadow.camera.left=-4; key.shadow.camera.right=4; key.shadow.camera.top=5; key.shadow.camera.bottom=-1;
key.shadow.bias = -0.0008; scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb6d0, 0.5); fill.position.set(-4,3,-4.5); scene.add(fill);

// 地面
function groundTexture(){
  const c=document.createElement('canvas'); c.width=c.height=1024;
  const x=c.getContext('2d');
  x.fillStyle='#8d979c'; x.fillRect(0,0,1024,1024);
  for(let i=0;i<9000;i++){ x.fillStyle=`rgba(0,0,0,${Math.random()*0.05})`; x.fillRect(Math.random()*1024,Math.random()*1024,2,2); }
  x.strokeStyle='rgba(255,255,255,0.06)'; x.lineWidth=2;
  for(let i=0;i<=16;i++){ const p=i*64; x.beginPath();x.moveTo(p,0);x.lineTo(p,1024);x.stroke();
    x.beginPath();x.moveTo(0,p);x.lineTo(1024,p);x.stroke(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60,60),
  new THREE.MeshStandardMaterial({map:groundTexture(), roughness:.92, metalness:.02}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

/* -------------------------------------------------- 模型：直接调用原作 XT */
let parts = null, rig = null;

function adapt(m){
  // ⚠ 千万别写成 `m.root.userData.orig = m` —— 那是**循环引用**，
  //    GLTFExporter 序列化 userData 时会抛 "Converting circular structure to JSON"，
  //    结果就是「导出 GLB」永远失败（导出 JSON 却没事，因为那条路不碰 userData）。
  //    用**不可枚举**属性：不参与 JSON.stringify / 对象展开，但调试时还能拿到。
  Object.defineProperty(m.root.userData, 'orig', { value:m, enumerable:false, configurable:true, writable:true });
  m.arms = m.arms || [];
  m.legs = m.legs || [];
  m.knees = m.knees || [];
  m.bodyBase = {
    y: m.body ? m.body.position.y : 0,
    rx: m.body ? m.body.rotation.x : 0,
    rz: m.body ? m.body.rotation.z : 0
  };
  m.headBase = m.head ? { y:m.head.position.y, rx:m.head.rotation.x, rz:m.head.rotation.z, ry:m.head.rotation.y } : null;
  m.hairBase = m.hair ? m.hair.rotation.clone() : null;
  m.coatBase = m.coatTails ? m.coatTails.rotation.clone() : null;
  m.tailBase = m.tail ? m.tail.rotation.clone() : null;
  // 只保留看起来像“肩/髋”枢轴的肢体（y 较高），避免转动脚部
  m.armPivots = m.arms.filter(g=>g.position.y > 0.6);
  m.legPivots = m.legs.filter(g=>g.position.y > 0.5);
  m.motion = 0; m.gait = 0; m.crouch = 0;
  return m;
}

let ringGroup = null;
let buildToken = 0;

function addRing(root){
  if(!P.ring) return;
  ringGroup = new THREE.Group();
  const r1 = new THREE.Mesh(new THREE.RingGeometry(0.52,0.60,48),
    new THREE.MeshBasicMaterial({color:0x4fe07a, transparent:true, opacity:0.9, side:THREE.DoubleSide}));
  r1.rotation.x = -Math.PI/2; r1.position.y = 0.012;
  const r2 = new THREE.Mesh(new THREE.RingGeometry(0.60,0.82,48),
    new THREE.MeshBasicMaterial({color:0x4fe07a, transparent:true, opacity:0.16, side:THREE.DoubleSide}));
  r2.rotation.x = -Math.PI/2; r2.position.y = 0.011;
  ringGroup.add(r1, r2);
  /* ★ 挂到**场景**而不是角色 root：`poseCharacter()` 会用膝部把整只角色往上顶（接地钳制），
     如果光圈是 root 的子节点，就会跟着一起被顶到脚踝高度 —— 黑岩（脚在原点下方）就中招了。 */
  scene.add(ringGroup);
}

/* 高模：按“名字”重新定位语义部件（clone 后 uuid 会变，name 不变） */
function adaptHires(root, names){
  const get = n => n ? root.getObjectByName(n) : null;
  const list = a => (a||[]).map(get).filter(Boolean);
  const m = {
    root, hires:true,
    body:get(names.body), head:get(names.head), hair:get(names.hair),
    coatTails:get(names.coatTails), tail:get(names.tail),
    arms:list(names.arms), legs:list(names.legs), knees:list(names.knees),
    weapons:list(names.weapons)
  };
  m.bodyBase = { y: m.body? m.body.position.y:0, rx: m.body? m.body.rotation.x:0, rz: m.body? m.body.rotation.z:0 };
  m.headBase = m.head ? { y:m.head.position.y, rx:m.head.rotation.x, ry:m.head.rotation.y, rz:m.head.rotation.z } : null;
  m.hairBase = m.hair ? m.hair.rotation.clone() : null;
  m.coatBase = m.coatTails ? m.coatTails.rotation.clone() : null;
  m.tailBase = m.tail ? m.tail.rotation.clone() : null;
  m.armPivots = m.arms.filter(g=>g.position.y > 0.6);
  m.legPivots = m.legs.filter(g=>g.position.y > 0.5);
  m.motion = 0; m.gait = 0; m.crouch = 0;
  return m;
}

function buildCharacter(){
  const token = ++buildToken;
  if(parts){ scene.remove(parts.root); disposeGroup(parts.root); parts = null; }
  if(ringGroup){ scene.remove(ringGroup); disposeGroup(ringGroup); ringGroup = null; }

  // ---- 新增模型（和原作模型走完全独立的一条路）----
  if(P.model === 'new'){
    const rec = NEW.list.find(m=>m.id===P.newId);
    if(!rec){ toast('先在上面「新增模型」里选一个'); P.model='low'; return; }
    updateStats('新增模型载入中…');
    loadNewFactory(rec.id).then(fn=>{
      if(token !== buildToken) return;
      const raw = fn();
      const m = adapt(raw);
      m.newModel = true;
      /* ★ 程序化角色（初音未来 / 黑岩射手）：接我们的**运行时**（状态机 + 武器池），和原作 14 人一样 */
      const inst = runtimeChar(rec.id);
      if(inst){
        m.runtime = true;
        m.spec = m.spec || inst;
        /* ★ 角色自带的武器（黑岩：黑岩巨炮 + 黑刃）**绑定进「角色武器池」**（不是共享池） */
        const bind = (inst.defaultLoadout ? inst.defaultLoadout() : []).slice();
        m.weaponRig = LP.mountWeapons(m, [], { startNative: true, bind });
        m.weaponRig.setArmed(RT.state.combat, RT.state.activity);
      }
      m.root.scale.setScalar(P.scale);
      scene.add(m.root);
      parts = m;
      captureColors(m.root);
      computeGroupDefaults();
      addRing(m.root);
      updateStats();
      renderPalettePanel();
      RT.buildPool && RT.buildPool();
      toast('已载入新增模型 · ' + rec.name);
    }).catch(e=>{
      if(token !== buildToken) return;
      toast('新增模型载入失败：'+(e.message||e));
      updateStats('新增模型载入失败：'+(e.message||e));
      P.model='low'; buildCharacter();
    });
    return;
  }

  const canHigh = P.model === 'high' && !!HIRES_VARIANTS[P.id];
  if(canHigh){
    if(!hiresReady){
      updateStats('高模数据载入中…');
      initHires().then(()=>{ hiresReady = true; if(token===buildToken) buildCharacter(); })
                 .catch(e=>{ if(token!==buildToken) return; toast('高模载入失败：'+(e.message||e)); P.model='low'; buildCharacter(); });
      return;
    }
    try{
      const m = adapt(buildHires(P.id, P.hiresVariant));
      m.hires = true;
      m.root.scale.setScalar(P.scale);
      scene.add(m.root);
      parts = m;
      captureColors(m.root);
      computeGroupDefaults();
      addRing(m.root);
      updateStats();
      renderPalettePanel();
    }catch(e){ toast('高模构建失败：'+(e.message||e)); P.model='low'; buildCharacter(); }
    return;
  }

  /* ★ 已程序化移植的角色走 PORTS（我们的 Builder）；其余暂走原作 XT(id) */
  const ported = LP.PORTS && LP.PORTS[P.id];
  const m = adapt(ported ? LP.buildFromPort(ported) : XT(P.id));
  /* 移植版自带 rootScale（原 It(id) 的值）；没移植的仍走原作 It(id) */
  m.root.scale.setScalar((ported && ported.rootScale ? ported.rootScale : It(P.id)) * P.scale);
  scene.add(m.root);
  parts = m;
  /* ★ 接上我们的运行时：移动状态机 + 武器池（原作默认空手，原生武器在 XT 里） */
  m.spec = { id: P.id, name: NAME[P.id] || P.id };
  m.baseY = m.root.position.y;
  m.weaponRig = LP.mountWeapons(m, [], { startNative: true });   // 原生武器取自模型本身（见 nativeList）
  m.weaponRig.setArmed(RT.state.combat, '');
  addRing(m.root);
  updateStats();
  renderPalettePanel();
  RT.syncW && RT.syncW();
  RT.buildPool && RT.buildPool();
}

function disposeGroup(g){
  const keep = new Set();
  g.traverse(o=>{ if(o.isMesh && o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(mm=>keep.add(mm)); } });
  g.traverse(o=>{ if(o.isMesh) o.geometry?.dispose?.(); });
  keep.forEach(mm=>mm.dispose?.());
}

function updateStats(msg){
  const box = document.getElementById('stats');
  const newRec = P.model==='new' ? NEW.list.find(m=>m.id===P.newId) : null;
  const label = newRec ? newRec.name : (NAME[P.id]||P.id);
  const sub   = newRec ? ('新增模型 · ' + newRec.where) : P.id;
  if(msg){ box.innerHTML = `<b>${label}</b><br>${msg}`; return; }
  if(!parts){ box.innerHTML = '…'; return; }
  let tris=0, meshes=0;
  parts.root.traverse(o=>{ if(o.isMesh && o.geometry){
    meshes++;
    const g=o.geometry; tris += (g.index? g.index.count : g.attributes.position.count)/3;
  }});
  const kind = parts.hires ? '高模（立绘）' : (parts.newModel ? '新增模型' : (parts.ported ? '低模（程序化）' : '低模 XT'));
  box.innerHTML =
    `<b>${label}</b> · ${sub}<br>${kind} · 三角面 ≈ ${Math.round(tris).toLocaleString()} · 网格 ${meshes}`;
}

/* ------------------------------------------------------------ 动画 */
function poseArms(arms, pose, t){
  const set=(i,x,y,z)=>{ if(arms[i]) arms[i].rotation.set(x,y,z); };
  switch(pose){
    case 'idle':   break;
    case 'carry':  set(0,-1.05,0,-0.22); set(1,-1.05,0,0.22); break;
    case 'drink':  set(1,-2.35+Math.sin(t*1.2)*0.09,0,0.15); break;
    case 'stretch':set(0,-2.60,0,0.10); set(1,-2.60,0,-0.10); break;
    case 'dance':  set(0,-0.60+Math.sin(t*3)*0.55,0,0.20); set(1,-0.60+Math.sin(t*3+1)*0.55,0,-0.20); break;
    case 'chat':   set(1,-0.65+Math.sin(t*2)*0.18,0,0.10); break;
    case 'inspect':set(0,-0.70+Math.sin(t*1.8)*0.12,0,0.20); set(1,-0.70+Math.sin(t*1.8+0.5)*0.12,0,-0.20); break;
    case 'snack':  set(1,-2.45+Math.sin(t*1.7)*0.12,0,0.12); break;
  }
}
function animate(m, t, dt){
  const walking = P.pose==='walk', running = P.pose==='run', crouch = P.pose==='crouch';
  const target = (walking||running||crouch)?1:0;
  const spd = running?11:(crouch?4.5:7);
  m.motion += (target-m.motion)*Math.min(1,dt*12);
  m.crouch += ((crouch?1:0)-m.crouch)*Math.min(1,dt*12);
  m.gait += dt*spd*(0.15+0.85*m.motion);
  const mo=m.motion, cr=m.crouch, g=m.gait;

  if(m.body){
    m.body.position.y = m.bodyBase.y + Math.abs(Math.sin(g))*mo*(running?0.05:0.028) + Math.sin(t*2)*0.010*(1-mo);
    m.body.rotation.x = m.bodyBase.rx + cr*0.2 + (1-cr)*(running?0.1:0.015);
    m.body.rotation.z = m.bodyBase.rz + Math.sin(g)*0.03*mo;
  }
  m.legPivots.forEach((l,i)=>{
    l.rotation.x = -cr*0.8 + Math.sin(g)*mo*((i%2)? -1:1)*(running?0.6:0.38);
  });
  m.armPivots.forEach((a,i)=>{
    const swing = Math.sin(g)*mo*((i%2)? -1:1)*(running?0.6:0.4);
    a.rotation.x = a.rotation.x*(1-mo) + swing;
  });
  poseArms(m.armPivots, P.pose, t);

  if(m.head){
    m.head.rotation.y = (m.headBase?.ry||0) + Math.sin(t*0.7)*0.05;
    m.head.rotation.z = (m.headBase?.rz||0) + Math.sin(t*1.3)*0.02;
    m.head.rotation.x = (m.headBase?.rx||0) + cr*0.15;
  }
  if(m.hair && m.hairBase){
    m.hair.rotation.z = m.hairBase.z + Math.sin(t*2.0)*0.045*(1+mo);
    m.hair.rotation.x = m.hairBase.x + Math.sin(t*1.6)*0.035 + mo*0.05;
  }
  if(m.coatTails && m.coatBase){
    m.coatTails.rotation.x = m.coatBase.x + Math.sin(t*1.7)*0.04 + mo*0.12;
    m.coatTails.rotation.z = m.coatBase.z + Math.sin(g)*0.05*mo;
  }
  if(m.tail && m.tailBase){
    m.tail.rotation.z = m.tailBase.z + Math.sin(t*1.4)*0.09;
    m.tail.rotation.y = m.tailBase.y + Math.sin(t*0.9)*0.13;
  }
  if(ringGroup){ const k=1+Math.sin(t*2)*0.02; ringGroup.scale.set(k,k,1); }
}

/* 高模动画：直接调用原作的 ek()（由 rig 的 elbows/ankles/ears/chestLocks/soles 驱动） */
const HIRES_ACTIVITY = {carry:'carry', drink:'drink', stretch:'stretch', dance:'dance', chat:'chat', inspect:'inspect', snack:'snack'};
function animateHires(m, t, dt){
  const walking = (P.pose==='walk'), running = (P.pose==='run'), sneak = (P.pose==='crouch');
  const moving = walking || running || sneak;
  const activity = HIRES_ACTIVITY[P.pose] || '';
  const poseName = sneak ? 'sneak' : (moving ? (running ? 'run' : 'walk') : 'idle');
  try{
    ek(m, t, moving, P.id, false, false, dt, running, activity, false, sneak, 0);
    NE(m, poseName);   // 原作：让武器按最低点高度贴合手部朝上（rig.elbows 推导）
  }catch(e){
    if(!m.__animErr){ m.__animErr = 1; console.warn('hires anim error:', e); }
  }
  if(ringGroup){ const k=1+Math.sin(t*2)*0.02; ringGroup.scale.set(k,k,1); }
}

/* ---------------- 配色面板（低模 KT/AT ｜ 高模调色板 / 顶点色） ---------------- */
const PAL_KEYS = [['hair','头发'],['shade','头发暗部'],['coat','服装'],['trim','饰边/白'],['eye','眼睛']];
const HIRES_GROUPS = [['hair','头发'],['coat','服装'],['skin','皮肤'],['metal','武器/金属']];
const DEFAULT_HI_GROUPS = {hair:0xc9d3d8, coat:0x1a1a1e, skin:0xf1d3bd, metal:0xbfc6cc};
const hiGroupColors = {...DEFAULT_HI_GROUPS};
const CAT2GROUP = {
  '头发':'hair','兽耳':'hair',
  '基础头型':'skin','基础手臂（含手）':'skin','基础腿部':'skin','基础身体':'skin',
  '服装装饰':'coat','身体装饰':'coat','手臂装饰':'coat','腿部装饰':'coat','鞋子':'coat','尾巴':'coat','隐藏杯子':'coat','隐藏纸箱':'coat',
  '武器／手持道具':'metal','额外装饰':'metal'
};
function captureColors(root){
  root.traverse(o=>{
    if(!o.isMesh) return;
    const c=o.geometry && o.geometry.getAttribute && o.geometry.getAttribute('color');
    if(c && !o.userData.__origColor) o.userData.__origColor = new Float32Array(c.array);
  });
}
/* 取当前模型各分组的平均色，作为该角色的默认组色（未改动时重绘=恒等） */
let hiGroupDefaults = {...DEFAULT_HI_GROUPS};
function computeGroupDefaults(){
  const acc={}, cnt={};
  for(const k of Object.keys(DEFAULT_HI_GROUPS)){ acc[k]=[0,0,0]; cnt[k]=0; }
  if(parts && parts.root) parts.root.traverse(o=>{
    if(!o.isMesh) return;
    const c=o.geometry && o.geometry.getAttribute && o.geometry.getAttribute('color');
    if(!c) return;
    const grp=CAT2GROUP[(o.userData && o.userData.studyCategory)||'']||'metal';
    const n=c.count, step=Math.max(1,Math.floor(n/150));
    for(let i=0;i<n;i+=step){ acc[grp][0]+=c.getX(i); acc[grp][1]+=c.getY(i); acc[grp][2]+=c.getZ(i); cnt[grp]++; }
  });
  const out={};
  for(const k of Object.keys(acc)){
    if(!cnt[k]){ out[k]=DEFAULT_HI_GROUPS[k]; continue; }
    const col=new THREE.Color().setRGB(acc[k][0]/cnt[k], acc[k][1]/cnt[k], acc[k][2]/cnt[k]);
    out[k]=col.getHex();
  }
  hiGroupDefaults=out;
  Object.assign(hiGroupColors, out);
}
/* 非破坏式分组重绘：以原始平均色为基准，保留每个顶点的明暗比例。
   有贴图集(map)的部件改为给材质染色(material.color) */
function applyHiresGroupRecolor(){
  if(!parts || !parts.hires) return;
  const T={hair:new THREE.Color(hiGroupColors.hair), coat:new THREE.Color(hiGroupColors.coat),
           skin:new THREE.Color(hiGroupColors.skin), metal:new THREE.Color(hiGroupColors.metal)};
  parts.root.traverse(o=>{
    if(!o.isMesh) return;
    const grp = CAT2GROUP[(o.userData && o.userData.studyCategory)||''] || 'metal';
    const t=T[grp];
    const mats = Array.isArray(o.material)?o.material:[o.material];
    const hasMap = mats.some(mm=>mm && mm.map);
    if(hasMap){
      mats.forEach(mm=>{ if(mm && mm.map){ mm.color.copy(t); mm.needsUpdate=true; } });
      return;
    }
    const c=o.geometry.getAttribute('color');
    if(!c || !o.userData.__origColor) return;
    const src=o.userData.__origColor, n=c.count, e=1e-4;
    let ar=0,ag=0,ab=0;
    for(let i=0;i<n;i++){ ar+=src[i*3]; ag+=src[i*3+1]; ab+=src[i*3+2]; }
    ar/=n; ag/=n; ab/=n;
    for(let i=0;i<n;i++){
      c.setXYZ(i, Math.min(1, t.r*(ar>e? src[i*3]  /ar:1)),
                   Math.min(1, t.g*(ag>e? src[i*3+1]/ag:1)),
                   Math.min(1, t.b*(ab>e? src[i*3+2]/ab:1)));
    }
    c.needsUpdate = true;
  });
}

  const row=document.createElement('div'); row.className='row';
  const l=document.createElement('label'); l.textContent=label;
  const inp=document.createElement('input'); inp.type='color'; inp.value=value;

const CN_COLOR = {skin:'皮肤',hair:'头发',hairLight:'发亮部',hairShade:'发暗部',ivory:'主色',black:'黑',fold:'褶皱',
  red:'红',redLight:'红亮部',stocking:'袜',silver:'银',coat:'外套',lining:'内衬',blue:'蓝',blueLight:'蓝亮部'};

  const b=paletteBody; if(!b) return;
  const sig = P.model+'|'+P.id+'|'+P.hiresVariant;
  if(!force && sig===lastPalSig) return;
  lastPalSig = sig;
  b.innerHTML='';
  if(P.model==='high'){
    const pal = HIRES_PALETTES[P.id+':'+P.hiresVariant];
    const iris = pal && pal.iris && pal.iris.iris;
    const wrap=document.createElement('div'); wrap.className='swatch';
    for(const [k,label] of HIRES_GROUPS){
      wrap.appendChild(colorRow(label, hex(hiGroupColors[k]), v=>{ hiGroupColors[k]=unhex(v); applyHiresGroupRecolor(); }));
    }
    if(Array.isArray(iris)){
      for(let i=0;i<iris.length;i++){
        wrap.appendChild(colorRow('虹膜 '+(i+1), hex(iris[i]), v=>{ iris[i]=unhex(v); buildCharacter(); }));
      }
    }
    const btn=document.createElement('button'); btn.className='btn'; btn.textContent='还原默认配色';
    btn.onclick=()=>{ buildCharacter(); renderPalettePanel(true); toast('已还原'); };
    const note=document.createElement('div');
    note.style.cssText='font-size:11px;color:var(--dim);line-height:1.5';
    note.textContent='分组换色：实时重绘顶点色（保留明暗层次）；带贴图集的部件用材质染色。虹膜改动会重建高模。';
    b.appendChild(note); b.appendChild(wrap); b.appendChild(btn);
  }else{
    const wrap=document.createElement('div'); wrap.className='swatch';
    for(const [key,label] of PAL_KEYS){
      const pal=KT[P.id]||{};
      wrap.appendChild(colorRow(label, hex(pal[key]??0), v=>{ if(!KT[P.id])KT[P.id]={}; KT[P.id][key]=unhex(v); buildCharacter(); }));
    }
    for(let i=0;i<3;i++){
      wrap.appendChild(colorRow('虹膜 '+(i+1), hex((AT[P.id]||[])[i]??0), v=>{
        if(!AT[P.id]) AT[P.id]=[0xffffff,0xffffff,0xffffff];
        AT[P.id][i]=unhex(v); buildCharacter();
      }));
    }
    b.appendChild(wrap);
  }
}
section('配色', '低模 KT/AT ｜ 高模调色板', false, b=>{ paletteBody=b; renderPalettePanel(true); });

section('导出', '', true, b=>{
  const g=document.createElement('div'); g.className='btns';
  // ★ 第三个参数是**样式类**，函数是第四个……不，签名是 (文字, 样式类, 函数)。
  //   曾经有 3 个调用写成 mk('截图', ()=>{}) 漏了样式类 → 函数被当成样式类，
  //   按钮**根本没有点击处理器**（点了没反应）。这里做容错，漏传也认得出来。
  const mk=(t,cls,fn)=>{
    if(typeof cls==='function'){ fn=cls; cls=''; }
    const x=document.createElement('button'); x.className='btn '+(cls||'');
    x.textContent=t; x.onclick=fn; g.appendChild(x);
    return x;
  };
  mk('导出 JSON','primary',()=>download(new Blob([JSON.stringify({id:P.id,scale:P.scale,palette:KT[P.id],iris:AT[P.id]},null,2)],{type:'application/json'}), P.id+'.json'));
  mk('导出 GLB','primary', exportGLB);
  mk('截图','', ()=>{ renderer.render(scene,camera); renderer.domElement.toBlob(bl=>download(bl,'character.png')); });
  mk('还原该干员配色','', ()=>{
    if(KT0[P.id]) KT[P.id] = Object.assign({}, KT0[P.id]);
    // 原厂没有这个 id 时**不要 delete** —— XT() 读不到 KT[id] 会直接崩
    if(AT0[P.id]) AT[P.id] = AT0[P.id].slice(); else delete AT[P.id];
    buildCharacter(); renderPalettePanel(true); toast('已还原该干员配色');
  });
  mk('重置视角','', ()=>{ controls.target.set(0,0.95,0); camera.position.set(1.4,1.6,5.0); controls.update(); toast('视角已重置'); });
  b.appendChild(g);
});

function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
function exportGLB(){
  new GLTFExporter().parse(parts.root.clone(true), res=>{
    download(new Blob([res],{type:'model/gltf-binary'}), P.id+'.glb'); toast('GLB 已导出');
  }, e=>{ console.error(e); toast('导出失败：'+e); }, {binary:true});
}
let toastTimer=null;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),1500); }

/* ============================================================================
 * ★ 自定义运行时（我们的模式）—— 原作 14 人也走这套：
 *   移动状态机（走路/跑/下蹲/腾空） + 活动 12 + 武器池（装/卸/换招/攻击）
 * 由 characters.lowpoly.js 的 poseCharacter() 驱动；原版模型默认**空手**（原生武器在 XT 里）。
 * ========================================================================== */
const RT = { state: { moving: false, running: false, crouch: false, air: false,
                      activity: '', combat: true, attackT: null, attackDuration: 0 } };
function mountRuntimePanel() {
  const scroll = document.getElementById('scroll');
  if (!scroll || document.getElementById('rtSec')) return;
  const sec = document.createElement('div'); sec.className = 'sec'; sec.id = 'rtSec';
  sec.innerHTML = '<h2>运行时 · 移动 / 活动 / 武器池</h2>';
  sec.querySelector('h2').onclick = () => sec.classList.toggle('collapsed');   // ★ 点标题收起 / 展开
  const body = document.createElement('div'); body.className = 'body'; sec.appendChild(body);
  /* ★ 顺序：**原始模型 · 新增模型 · 运行时**（运行时插在「新增模型」下面、「比例/动作」上面） */
  const anchor = [...scroll.querySelectorAll('.sec')].find((s) => /新增模型/.test((s.querySelector('h2') || {}).textContent || ''))
              || [...scroll.querySelectorAll('.sec')].find((s) => /原始模型/.test((s.querySelector('h2') || {}).textContent || ''));
  if (anchor) anchor.after(sec); else scroll.insertBefore(sec, scroll.firstChild);
  const row = (label) => { const r = document.createElement('div'); r.className = 'row';
    const l = document.createElement('label'); l.textContent = label; r.appendChild(l); body.appendChild(r); return r; };
  const grid = () => { const g = document.createElement('div'); g.className = 'grid'; body.appendChild(g); return g; };
  const btn = (parent, label, on) => { const b = document.createElement('button'); b.textContent = label;
    b.onclick = () => on(b); parent.appendChild(b); return b; };

  row('移动 · 状态机');  const tg = grid();
  const tog = (label, key) => { const b = btn(tg, label, () => {
      RT.state[key] = !RT.state[key];
      if (key === 'running' && RT.state.running) RT.state.moving = true;
      if (key === 'moving' && !RT.state.moving) RT.state.running = false;
      sync();
    }); b._k = key; return b; };
  const tW = tog('走路', 'moving'), tR = tog('跑', 'running'), tC = tog('下蹲', 'crouch'), tA = tog('腾空', 'air');
  btn(tg, '重置视角', () => { controls.target.set(0, 0.95, 0); camera.position.set(1.4, 1.6, 5.0); controls.update(); });

  row('活动 · 12');
  const ag = grid();
  const acts = LP.ACTIVITIES.map((a) => btn(ag, a.label, () => {
    RT.state.activity = RT.state.activity === a.id ? '' : a.id; syncActs(); }));
  acts.forEach((b, i) => (b._id = LP.ACTIVITIES[i].id));
  function syncActs() { acts.forEach((b) => b.classList.toggle('on', b._id === RT.state.activity)); }
  syncActs();

  row('武器池');
  const wgTop = grid();                                     // 固定：持械 / 原生装备
  const bArm = btn(wgTop, '持械', () => { RT.state.combat = !RT.state.combat; sync(); });   // ① 持械
  btn(wgTop, '原生装备', () => { parts && parts.weaponRig && (parts.weaponRig.native(), syncW()); });  // ② 原生装备

  row('角色武器池 · 本角色自带');                            // ★ 池 A：角色模型里分割出的原生武器
  const wgNative = grid();                                  // ★ 换角色时重建
  row('共享池 · 黑刃 / 黑岩巨炮');                          // ★ 池 B：全局共享（与池 A **互斥**）
  const wgShared = grid();

  const wgBot = grid();                                     // 固定：清空 / 换招 / 攻击
  btn(wgBot, '清空', () => { parts && parts.weaponRig && (parts.weaponRig.clear(), syncW()); });
  const bMove = btn(wgBot, '换招', () => { const rig = parts && parts.weaponRig; if (!rig) return;
    rig.move = (rig.move + 1) % Math.max(1, rig.moveCount()); syncW(); });
  const bAtk = btn(wgBot, '攻击', () => { const rig = parts && parts.weaponRig; if (!rig) return;
    RT.state.attackT = 0; RT.state.attackDuration = rig.attackDuration(); });

  const wb = {};
  const handsTag = (h) => (h === 2 ? '双手' : '单手');
  /** ★ 按当前角色重建两个池：A=本角色原生武器，B=共享（黑刃/巨炮） */
  function buildPool() {
    wgNative.innerHTML = ''; wgShared.innerHTML = ''; for (const k in wb) delete wb[k];
    const rig = parts && parts.weaponRig;
    /* A：角色武器池（模型里分割出的原生武器）—— 用**下标**当 key（同名武器不能用 name） */
    if (rig && rig.nativeList) rig.nativeList.forEach((n, i) =>
      wb['n' + i] = btn(wgNative, (n.label || n.name) + ' · ' + handsTag(n.hands),
        () => { rig.toggleNative(n); syncW(); }));
    /* B：共享池（我们的两把，任何角色都能装） */
    for (const id of ['blackBlade', 'rockCannon', 'leek']) {
      const def = LP.WEAPONS[id];
      wb[id] = btn(wgShared, (def.label || id) + ' · ' + handsTag(def.hands || 1), () => {
        const r = parts && parts.weaponRig; if (!r) return;
        if (r.entries.some((e) => e.spec.id === id)) r.unequip(id); else r.equip(id); syncW();
      });
    }
    if (rig && !rig.nativeList.length) btn(wgNative, '（本角色没有原生武器）', () => {});
    syncW();
  }
  RT.buildPool = buildPool;
  buildPool();

  function sync() {
    [tW, tR, tC, tA].forEach((b) => b.classList.toggle('on', !!RT.state[b._k]));
    bArm.classList.toggle('on', !!RT.state.combat);
    syncW();
  }
  function syncW() {
    const rig = parts && parts.weaponRig;
    if (!rig) return;
    const inNative = rig.poolMode === 'native';
    /* A：原生武器「开着」的高亮 */
    if (rig.nativeList) rig.nativeList.forEach((n, i) => {
      const b = wb['n' + i]; if (b) b.classList.toggle('on', rig.nativeOn.has(n.object) && inNative);
    });
    /* B：共享武器「装着」的高亮 */
    for (const id of ['blackBlade', 'rockCannon', 'leek']) {
      const b = wb[id]; if (b) b.classList.toggle('on', rig.entries.some((e) => e.spec.id === id));
    }
    /* ★ 互斥：当前池之外的那个池变灰（点它就会自动切池） */
    if (rig.nativeList) rig.nativeList.forEach((n, i) => { const b = wb['n' + i]; if (b) b.classList.toggle('off', !inNative); });
    for (const id of ['blackBlade', 'rockCannon', 'leek']) { const b = wb[id]; if (b) b.classList.toggle('off', inNative); }
    bAtk.textContent = '攻击 · ' + (rig.attackLabel() || '—');
    bMove.textContent = `换招 ${rig.move + 1}/${rig.moveCount()}`;
  }
  RT.syncW = syncW; sync();
}

/* ------------------------------------------------------------ 启动 */
markOps(); buildCharacter(); renderPalettePanel(true); mountRuntimePanel();
const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  if(parts){
    if(parts.hires) animateHires(parts, t, dt);
    else if(parts.weaponRig) LP.poseCharacter(parts, t, dt, RT.state);   // ★ 我们的状态机
    else animate(parts, t, dt);
  }
  if(P.autoRotate && parts) parts.root.rotation.y += dt*0.6;
  controls.update();
  renderer.render(scene, camera);
}
loop();
/* ★ 首屏渲染完再加载高模模块（~840KB）—— 不压首屏 */
(requestIdleCallback || ((f) => setTimeout(f, 150)))(() => loadHires());

window.__lab = { THREE, renderer, scene, camera, controls, P, KT, AT, XT, Q, It, Bt, buildCharacter, animate, animateHires, ek, NE,
  HIRES_VARIANTS, buildHires, initHires, HIRES_PALETTES, hiGroupColors, applyHiresGroupRecolor,
  NEW, loadNewList, loadNewFactory, Store, LP, RT, mountRuntimePanel,
  get parts(){ return parts; },
  setView(x,y,z){ controls.target.set(0,1.20,0); camera.position.set(x,y,z); controls.update(); },
  shot(){ renderer.render(scene, camera); return renderer.domElement.toDataURL('image/png'); } };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
