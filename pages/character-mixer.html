<script type="importmap">
{

    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { XT, It, Bt } from '../src/characters.orig.js';
import { initHires, buildHires, HIRES_VARIANTS } from '../src/characters.hires2.js';

/* ============================ 角色库 ============================ */
const LOW = [['lappland','拉普兰德'],['texas','德克萨斯'],['exusiai','能天使'],['croissant','可颂'],
  ['sora','空'],['mostima','莫斯提马'],['chen','陈'],['hoshiguma','星熊'],['swire','诗怀雅'],
  ['emperor','大帝'],['lee','老鲤'],['aak','阿'],['hung','吽'],['waaifu','槐琥']];
const HIGH = [['lappland','classic','拉普兰德·经典'],['lappland','desolate','拉普兰德·荒芜'],
  ['texas','classic','德克萨斯·经典'],['texas','silent','德克萨斯·缄默'],
  ['exusiai','classic','能天使·经典'],['exusiai','covenant','能天使·新约']];

const lowCache = new Map(), highCache = new Map();
function getLow(id){ if(!lowCache.has(id)) lowCache.set(id, XT(id)); return lowCache.get(id); }
let hiresReady = false, hiresLoading = null;
async function ensureHires(){
  if(hiresReady) return true;
  if(!hiresLoading) hiresLoading = initHires().then(()=>{ hiresReady=true; return true; }).catch(()=>false);
  return hiresLoading;
}
function getHigh(id, v){
  const key=id+':'+v;
  if(!highCache.has(key)) highCache.set(key, buildHires(id, v));
  return highCache.get(key);
}
/** 角色键：'low:texas' | 'high:texas:silent' */
async function getModel(key){
  const p=key.split(':');
  if(p[0]==='low') return getLow(p[1]);
  if(p[0]==='high'){ await ensureHires(); return getHigh(p[1], p[2]); }
  return null;
}
function modelLabel(key){
  const p=key.split(':');
  if(p[0]==='low'){ const e=LOW.find(x=>x[0]===p[1]); return '低模·'+(e?e[1]:p[1]); }
  const e=HIGH.find(x=>x[0]===p[1]&&x[1]===p[2]); return '高模·'+(e?e[2]:p[1]);
}
function modelTier(key){ return key.split(':')[0]; }

/* ============================ 槽位 ============================ */
const SLOTS = [
  { key:'head',      label:'头 / 脸' },
  { key:'hair',      label:'头发' },
  { key:'armL',      label:'左臂', from:'arms', i:0 },
  { key:'armR',      label:'右臂', from:'arms', i:1 },
  { key:'legL',      label:'左腿', from:'legs', i:0 },
  { key:'legR',      label:'右腿', from:'legs', i:1 },
  { key:'coatTails', label:'后摆' },
  { key:'tail',      label:'兽尾' },
  { key:'halo',      label:'光环' },
  { key:'prop',      label:'道具' },
];
const getSlot = (m, s) => s.from ? (m[s.from] ? m[s.from][s.i] : null) : (m[s.key] || null);
function setSlot(m, s, val){ if(s.from){ if(m[s.from]) m[s.from][s.i]=val; } else m[s.key]=val; }
const toArr = (o) => o ? (Array.isArray(o)? o : [o]) : [];
function parentRole(donor, obj){
  if(!obj || !obj.parent) return 'body';
  if(obj.parent === donor.head) return 'head';
  const ai = donor.arms ? donor.arms.indexOf(obj.parent) : -1;
  if(ai>=0) return 'arm'+ai;
  return 'body';
}
function attachByRole(m, role, obj){
  if(role==='head' && m.head) m.head.add(obj);
  else if(role==='arm0' && m.arms && m.arms[0]) m.arms[0].add(obj);
  else if(role==='arm1' && m.arms && m.arms[1]) m.arms[1].add(obj);
  else m.body.add(obj);
}

/* ============================ 合成 ============================ */
let cfg = { main:'low:texas', slots:{} };
for(const s of SLOTS) cfg.slots[s.key] = '';

async function compose(){
  const main = await getModel(cfg.main);
  if(!main) return null;
  // 每次都从缓存原件 deep clone，保证可重复合成
  const M = cloneModel(main);
  for(const slot of SLOTS){
    const donorKey = cfg.slots[slot.key];
    if(!donorKey || donorKey === cfg.main) continue;
    const donor = await getModel(donorKey);
    if(!donor) continue;
    const src = getSlot(donor, slot);

    // ---- 移除当前部件（head/hair 有联动）----
    if(slot.key==='head'){
      if(M.head && M.head.parent) M.head.parent.remove(M.head);
    } else if(slot.key==='hair'){
      const cur = (M.head && M.head.getObjectByName('articulated-back-hair')) || M.hair;
      if(cur && cur.parent) cur.parent.remove(cur);
    } else {
      for(const o of toArr(getSlot(M, slot))) if(o && o.parent) o.parent.remove(o);
    }

    if(!src){
      if(slot.key==='head'){ M.head=null; M.hair=null; }
      else if(slot.key==='hair'){ M.hair=null; }
      else setSlot(M, slot, null);
      continue;
    }

    const items = toArr(src).map(o => ({ o, role: parentRole(donor, o) }));
    const clones = items.map(({o,role}) => { const c = o.clone(true); attachByRole(M, role, c); return c; });

    if(slot.key==='head'){
      M.head = clones[0];
      // 跟随新头的头发（原作命名为 articulated-back-hair）
      M.hair = M.head.getObjectByName('articulated-back-hair') || null;
      if(!M.head.parent) M.body.add(M.head);
    } else if(slot.key==='hair'){
      M.hair = clones[0];
      if(M.head && clones[0].parent!==M.head) M.head.add(clones[0]);
    } else {
      setSlot(M, slot, slot.from ? clones[0] : (Array.isArray(src) ? clones : clones[0]));
    }
  }
  // 主角色根缩放：混搭后统一用主角色比例
  M.root.scale.setScalar(It(cfg.main.split(':')[1]) || 1);
  M.motion = 0; M.gait = 0; M.crouch = 0;
  M.bodyBase = M.body ? M.body.position.y : 0;
  M.armPivots = (M.arms||[]).filter(g=>g.position.y>0.6);
  M.legPivots = (M.legs||[]).filter(g=>g.position.y>0.5);
  return M;
}
/* 深拷贝一个模型骨架（几何/材质共享，结构独立） */
function cloneModel(m){
  const root = m.root.clone(true);
  const out = { root, motion:0, gait:0, crouch:0 };
  const find = (orig, cloneRoot) => {
    // 用“在父级中的索引路径”重新对应 clone 与原件
    const path=[];
    for(let o=orig; o && o!==m.root; o=o.parent){
      path.unshift(Array.prototype.indexOf.call(o.parent.children, o));
    }
    let n=cloneRoot;
    for(const i of path) n=n.children[i];
    return n;
  };
  out.body=find(m.body, root); out.head=find(m.head, root);
  out.hair=find(m.hair, root); out.coatTails=find(m.coatTails, root); out.tail=find(m.tail, root);
  out.arms=(m.arms||[]).map(g=>find(g, root));
  out.legs=(m.legs||[]).map(g=>find(g, root));
  out.knees=(m.knees||[]).map(g=>find(g, root));
  out.weapons=(m.weapons||[]).map(g=>find(g, root));
  out.hires = !!m.hires;
  return out;
}

/* ============================ 场景 ============================ */
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xa9b4ba); scene.fog=new THREE.Fog(0xa9b4ba,16,40);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,200);
camera.position.set(1.6,1.95,5.8);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.15,0); controls.enableDamping=true; controls.dampingFactor=.08;
controls.minDistance=2; controls.maxDistance=16; controls.maxPolarAngle=Math.PI*.53; controls.update();

scene.add(new THREE.HemisphereLight(0xcfe3ee,0x22303a,.9));
const key=new THREE.DirectionalLight(0xffffff,2.0);
key.position.set(3.6,6.4,4.8); key.castShadow=true; key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near=.5; key.shadow.camera.far=26;
key.shadow.camera.left=-4;key.shadow.camera.right=4;key.shadow.camera.top=5;key.shadow.camera.bottom=-1;
key.shadow.bias=-0.0008; scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb6d0,.5);
fill.position.set(-4,3,-4.5); scene.add(fill);

(function ground(){
  const c=document.createElement('canvas'); c.width=c.height=1024; const x=c.getContext('2d');
  x.fillStyle='#8d979c'; x.fillRect(0,0,1024,1024);
  for(let i=0;i<8000;i++){ x.fillStyle=`rgba(0,0,0,${Math.random()*.05})`; x.fillRect(Math.random()*1024,Math.random()*1024,2,2); }
  x.strokeStyle='rgba(255,255,255,.07)'; x.lineWidth=2;
  for(let i=0;i<=16;i++){ const p=i*64; x.beginPath();x.moveTo(p,0);x.lineTo(p,1024);x.stroke();
    x.beginPath();x.moveTo(0,p);x.lineTo(1024,p);x.stroke(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping;
  const g=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({map:t,roughness:.92,metalness:.02}));
  g.rotation.x=-Math.PI/2; g.receiveShadow=true; scene.add(g);
})();
const ring=new THREE.Group();
{ const r1=new THREE.Mesh(new THREE.RingGeometry(.52,.60,48),new THREE.MeshBasicMaterial({color:0x4fe07a,transparent:true,opacity:.9,side:THREE.DoubleSide}));
  r1.rotation.x=-Math.PI/2; r1.position.y=.012;
  const r2=new THREE.Mesh(new THREE.RingGeometry(.60,.82,48),new THREE.MeshBasicMaterial({color:0x4fe07a,transparent:true,opacity:.16,side:THREE.DoubleSide}));
  r2.rotation.x=-Math.PI/2; r2.position.y=.011; ring.add(r1,r2); }

/* ============================ 构建 / 动画 ============================ */
let parts=null;
function disposeGroup(g){ const mats=new Set();
  g.traverse(o=>{ if(o.isMesh){ o.geometry?.dispose?.(); (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m&&mats.add(m)); } });
  mats.forEach(m=>m.dispose?.()); }

async function rebuild(){
  const old=parts; parts=null;
  if(old){ scene.remove(old.root); }
  const token=++rebuild.token;
  const M=await compose();
  if(token!==rebuild.token || !M) return;
  addRing(M.root); scene.add(M.root); parts=M;
  updateHud();
}
rebuild.token=0;

function addRing(root){
  if(root.getObjectByName('__ring')) return;
  const r=ring.clone(true); r.name='__ring'; r.position.set(0,0,0); root.add(r);
}
function poseArms(arms,pose,t){
  const set=(i,x,y,z)=>{ if(arms[i]) arms[i].rotation.set(x,y,z); };
  switch(pose){
    case 'carry': set(0,-1.05,0,-.22); set(1,-1.05,0,.22); break;
    case 'drink': set(1,-2.35+Math.sin(t*1.2)*.09,0,.15); break;
    case 'stretch': set(0,-2.60,0,.10); set(1,-2.60,0,-.10); break;
    case 'dance': set(0,-.60+Math.sin(t*3)*.55,0,.20); set(1,-.60+Math.sin(t*3+1)*.55,0,-.20); break;
    case 'chat': set(1,-.65+Math.sin(t*2)*.18,0,.10); break;
    case 'inspect': set(0,-.70+Math.sin(t*1.8)*.12,0,.20); set(1,-.70+Math.sin(t*1.8+.5)*.12,0,-.20); break;
    case 'snack': set(1,-2.45+Math.sin(t*1.7)*.12,0,.12); break;
  }
}
const ACTIVITY={carry:'carry',drink:'drink',stretch:'stretch',dance:'dance',chat:'chat',inspect:'inspect',snack:'snack'};
function animate(m,t,dt){
  const walking=P.pose==='walk', running=P.pose==='run', sneak=P.pose==='crouch';
  const target=(walking||running||sneak)?1:0, spd=running?11:(sneak?4.5:7);
  m.motion += (target-m.motion)*Math.min(1,dt*12);
  m.crouch += ((sneak?1:0)-m.crouch)*Math.min(1,dt*12);
  m.gait += dt*spd*(.15+.85*m.motion);
  const mo=m.motion, cr=m.crouch, g=m.gait;
  if(m.body){
    m.body.position.y = (m.bodyBase||0) + Math.abs(Math.sin(g))*mo*(running?.05:.028) + Math.sin(t*2)*.010*(1-mo);
    m.body.rotation.x = cr*.2 + (1-cr)*(running?.1:.015);
    m.body.rotation.z = Math.sin(g)*.03*mo;
  }
  m.legPivots.forEach((l,i)=>{ l.rotation.x = -cr*.8 + Math.sin(g)*mo*((i%2)?-1:1)*(running?.6:.38); });
  m.armPivots.forEach((a,i)=>{ const sw=Math.sin(g)*mo*((i%2)?-1:1)*(running?.6:.4); a.rotation.x = a.rotation.x*(1-mo)+sw; });
  poseArms(m.armPivots,P.pose,t);
  if(m.head){
    m.head.rotation.y = Math.sin(t*.7)*.05;
    m.head.rotation.z = Math.sin(t*1.3)*.02;
    m.head.rotation.x = cr*.15;
  }
  const k=1+Math.sin(t*2)*.02; const rr=m.root.getObjectByName('__ring'); if(rr) rr.scale.set(k,k,1);
}

/* ============================ UI ============================ */
const P={ pose:'idle' };
const slotsEl=document.getElementById('slots');
function options(includeEmpty){
  const out=[];
  if(includeEmpty) out.push(['','— 不换（用主角色）']);
  out.push(['__h','── 低模 ──']);
  for(const [id,cn] of LOW) out.push(['low:'+id, cn]);
  out.push(['__h2','── 高模 ──']);
  for(const [id,v,cn] of HIGH) out.push(['high:'+id+':'+v, cn]);
  return out;
}
function renderSlots(){
  slotsEl.innerHTML='';
  const mainRow=document.createElement('div'); mainRow.className='row';
  const ml=document.createElement('label'); ml.textContent='主角色';
  const ms=document.createElement('select');
  for(const [val,txt] of options(false)){ if(txt.startsWith('──')) continue;
    const o=document.createElement('option'); o.value=val; o.textContent=txt; if(cfg.main===val)o.selected=true; ms.appendChild(o); }
  ms.onchange=async()=>{ cfg.main=ms.value; await rebuild(); };
  mainRow.append(ml,ms); slotsEl.appendChild(mainRow);
  for(const s of SLOTS){
    const r=document.createElement('div'); r.className='row';
    const l=document.createElement('label'); l.textContent=s.label;
    const sel=document.createElement('select');
    for(const [val,txt] of options(true)){
      if(txt.startsWith('──')){ const og=document.createElement('option'); og.disabled=true; og.textContent=txt; sel.appendChild(og); continue; }
      const o=document.createElement('option'); o.value=val; o.textContent=txt; if((cfg.slots[s.key]||'')===val)o.selected=true; sel.appendChild(o);
    }
    sel.onchange=async()=>{ cfg.slots[s.key]=sel.value; await rebuild(); };
    r.append(l,sel); slotsEl.appendChild(r);
  }
}
function updateHud(){
  if(!parts){ document.getElementById('hud').textContent='…'; return; }
  let meshes=0,tris=0; parts.root.traverse(o=>{ if(o.isMesh){ meshes++; const g=o.geometry; tris+=(g.index?g.index.count:g.attributes.position.count)/3; }});
  const used=Object.values(cfg.slots).filter(Boolean);
  const tiers=new Set([modelTier(cfg.main), ...used.map(modelTier)]);
  document.getElementById('hud').innerHTML =
    `<b>换装结果</b><br>主角色 ${modelLabel(cfg.main)}<br>网格 ${meshes} · 三角面 <b>${Math.round(tris)}</b>`+
    `<br>替换槽位 ${used.length} / ${SLOTS.length}`+
    (tiers.size>1? `<br><span style="color:var(--gold2)">⚠ 混合了低模与高模（比例会有差异）</span>`:'');
  document.getElementById('slotInfo').textContent = used.length+' 处替换';
}

document.getElementById('allSame').onclick=async()=>{ for(const s of SLOTS) cfg.slots[s.key]=''; renderSlots(); await rebuild(); };
document.getElementById('randomize').onclick=async()=>{
  const pool=[...LOW.map(x=>'low:'+x[0]), ...HIGH.map(x=>'high:'+x[0]+':'+x[1])];
  for(const s of SLOTS) cfg.slots[s.key] = Math.random()<0.55 ? pool[Math.floor(Math.random()*pool.length)] : '';
  renderSlots(); await rebuild(); toast('随机混搭');
};

/* ---- 右栏 ---- */
const rscroll=document.getElementById('rscroll');
function section(title,hint,open,build){
  const sec=document.createElement('div'); sec.className='sec'+(open?'':' collapsed');
  const h=document.createElement('h3'); h.innerHTML=`${title}<span>${hint||''}</span>`;
  h.onclick=()=>sec.classList.toggle('collapsed');
  const b=document.createElement('div'); b.className='body'; sec.append(h,b); rscroll.appendChild(sec); return build(b);
}
section('动作','',true,b=>{
  const sel=document.createElement('select');
  for(const [v,t] of [['idle','待机'],['walk','行走'],['run','奔跑'],['crouch','蹲行'],['carry','搬运'],
    ['drink','饮用'],['stretch','舒展'],['dance','舞动'],['chat','交谈'],['inspect','查看'],['snack','吃零食']]){
    const o=document.createElement('option'); o.value=v; o.textContent=t; if(P.pose===v)o.selected=true; sel.appendChild(o);
  }
  sel.onchange=()=>{ P.pose=sel.value; };
  b.appendChild(sel);
});
section('导出','',true,b=>{
  const g=document.createElement('div'); g.className='btns';
  const mk=(t,cls,fn)=>{ const x=document.createElement('button'); x.className=cls||''; x.textContent=t; x.onclick=fn; g.appendChild(x); };
  mk('导出配置 JSON','',()=>download(new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}),'mix.json'));
  mk('导出 GLB','pri',()=>{
    if(!parts) return;
    new GLTFExporter().parse(parts.root.clone(true), res=>download(new Blob([res],{type:'model/gltf-binary'}),'mix.glb'),
      e=>{console.error(e);toast('导出失败');},{binary:true});
  });
  mk('截图','',()=>{ renderer.render(scene,camera); renderer.domElement.toBlob(bl=>download(bl,'mix.png')); });
  mk('重置视角','',()=>{ controls.target.set(0,1.15,0); camera.position.set(1.6,1.95,5.8); controls.update(); });
  b.appendChild(g);
  const note=document.createElement('div'); note.style.cssText='font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:6px';
  note.textContent='换装原理：从缓存原件深拷贝部件，按“在父级中的索引路径”重新定位，再按部件原本的角色归属（头/身体/左右臂）挂回主角色骨架。';
  b.appendChild(note);
});
section('说明','',true,b=>{
  const d=document.createElement('div'); d.style.cssText='font-size:10.5px;color:var(--dim);line-height:1.6';
  d.innerHTML='· 槽位留空 = 用主角色的对应部件<br>· 高模首次选用会加载 models/（约 10 MB）<br>· 低模/高模混搭比例会不一致';
  b.appendChild(d);
});

/* ============================ 启动 ============================ */
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
let tt=null;
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),1500); }

renderSlots(); rebuild();
const clock=new THREE.Clock(); loop();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clock.getDelta()), t=clock.elapsedTime;
  if(parts) animate(parts,t,dt);
  controls.update(); renderer.render(scene,camera);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

window.__mix = { THREE, scene, camera, controls, renderer,
  get cfg(){return cfg;}, set cfg(v){cfg=v;renderSlots();},
  rebuild, get parts(){return parts;}, rebuildNow:()=>rebuild(),
  shot(){ renderer.render(scene,camera); return renderer.domElement.toDataURL('image/png'); } };
</script>

  setTimeout(function(){
    if(document.querySelector('canvas')) return;
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px/1.8 Arial,"Microsoft YaHei",sans-serif;text-align:center;padding:24px';
    d.innerHTML='<div><h2 style="letter-spacing:.12em;margin:0 0 10px">需要本地服务器</h2><p style="color:var(--dim);margin:0">请运行 <code style="color:var(--ok-ink2)">node tools/_serve.js</code> 后访问 <a style="color:var(--ok-ink2)" href="http://localhost:8765/character-mixer.html">http://localhost:8765/character-mixer.html</a></p></div>';
    document.body.appendChild(d);
  }, 6000);
</script>
