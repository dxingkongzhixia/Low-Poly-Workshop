<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04121f"/><stop offset="0.55" stop-color="#062033"/><stop offset="1" stop-color="#03101a"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fa8ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#1b6fc4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0b2a44" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fc8ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1f7fd6" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="900" height="560" fill="url(#sky)"/>
  <!-- 地面网格 -->
  <g stroke="#1a5c8c" stroke-opacity="0.5" stroke-width="1">
    <path d="M0 470h900M0 500h900M0 530h900M0 545h900"/>
    <path d="M120 430v130M300 430v130M480 430v130M660 430v130M840 430v130"/>
  </g>
  <path d="M60 452h780" stroke="#2b8fd6" stroke-opacity="0.35" stroke-width="2"/>
  <ellipse cx="450" cy="452" rx="330" ry="150" fill="url(#pool)" filter="url(#soft)"/>

  <!-- 全息箱：底 -->
  <g fill="none" stroke="#4fd2ff" stroke-width="3" stroke-linejoin="round" filter="url(#glow)">
    <path d="M190 452 L450 512 L710 452 L450 392 Z" fill="url(#glass)"/>
    <path d="M190 452 L190 200 L450 262 L710 200 L710 452" stroke-opacity="0.75"/>
    <path d="M450 512 L450 262" stroke-opacity="0.65"/>
    <path d="M190 200 L450 140 L710 200 L450 262 Z" fill="url(#glass)"/>
    <path d="M450 140 L450 262" stroke-opacity="0.5"/>
  </g>
  <!-- 箱内刻度 -->
  <g stroke="#39a7e0" stroke-opacity="0.35" stroke-width="1">
    <path d="M255 190v300M320 176v330M385 164v350M515 164v350M580 176v330M645 190v300"/>
  </g>

  <!-- AI Agent 字（块状、发光） -->
  <g font-family="Consolas,Menlo,monospace" font-weight="700" text-anchor="middle" filter="url(#glow)">
    <text x="450" y="300" font-size="132" fill="#dff4ff" stroke="#5fd0ff" stroke-width="2"
          letter-spacing="10">AI</text>
    <text x="450" y="424" font-size="132" fill="#dff4ff" stroke="#5fd0ff" stroke-width="2"
          letter-spacing="8">Agent</text>
  </g>
  <!-- 像素块质感 -->
  <g fill="#9fe6ff" fill-opacity="0.55">
    <rect x="352" y="196" width="18" height="18"/><rect x="378" y="220" width="14" height="14"/>
    <rect x="470" y="196" width="18" height="18"/><rect x="500" y="220" width="14" height="14"/>
    <rect x="300" y="330" width="16" height="16"/><rect x="596" y="330" width="16" height="16"/>
    <rect x="410" y="404" width="16" height="16"/><rect x="486" y="404" width="16" height="16"/>
  </g>
</svg>
